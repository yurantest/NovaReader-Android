            // Скрываем рекламные секции ДО старта TTS —
            // иначе getBlocks() захватит текст до того как display:none применится
            try {
                const contents = view.renderer?.getContents?.();
                if (contents?.length > 0) { hideAdSections(contents[0].doc); hideFakeTOCLists(contents[0].doc); }
            } catch(e) {}

            const ssml = view.tts.start();
            if (!ssml) {
                // Нет текста в новой секции — пробуем перейти к следующей
                log(' Нет текста в секции, переходим дальше...', 'tts');
                ttsPageTurning = true;
                await goToNextSection();
                return;
            }

            if (loadSentencesFromBlock() && ttsSentences.length > 0) {
                // Пропускаем первый блок новой секции если он дублирует последний блок предыдущей
                const newSig = blockSignature();
                if (newSig && newSig === ttsLastBlockSignature) {
                    log(` Дубль заголовка при смене секции пропущен: "${ttsSentences[0].text.substring(0, 40)}"`, 'tts');
                    ttsLastBlockSignature = '';
                    const skipSsml = view.tts.next(false);
                    if (!skipSsml) {
                        await goToNextSection();
                    } else if (loadSentencesFromBlock() && ttsSentences.length > 0) {
                        ttsLastBlockSignature = blockSignature();
                        await speakCurrentSentence();
                    } else {
                        await advanceToNextSentence();
                    }
                    return;
                }
                ttsLastBlockSignature = newSig;
                await speakCurrentSentence();
            } else {
                await advanceToNextSentence();
            }
        }

        // БАГ-ФИКС: защита от повторного входа (re-entrancy guard).
        // Если Python-callback пришёл дважды (баг двойного вызова callback),

        // второй вызов ttsNext будет отброшен пока первый ещё выполняется.
        let _ttsNextRunning = false;

        window.ttsNext = async function() {
            if (!ttsActive || ttsPageTurning) {
                log(' ttsNext: ttsActive=' + ttsActive + ' ttsPageTurning=' + ttsPageTurning, 'tts');
                return;
            }
            if (_ttsNextRunning) {
                log(' ttsNext: уже выполняется, повторный вызов отброшен (двойной callback)', 'warn');
                return;
            }
            // УСТАРЕЛО: раньше здесь отменялся таймер листания — таймеров больше нет.
            if (ttsSplitFlipTimer !== null) { clearTimeout(ttsSplitFlipTimer); ttsSplitFlipTimer = null; }
            _ttsNextRunning = true;
            log(' ttsNext вызван из Python', 'tts');
            try {
                // ── «Виртуальное тире»: транш 1 разрывного предложения дозвучал ──
                // Перелистываем СИНХРОННО (страница переворачивается ровно сейчас,
                // а не по угадываемому таймеру), затем озвучиваем транш 2. Дальше
                // не продвигаемся — advanceToNextSentence() вызовется только после
                // того, как ttsNext() снова придёт по завершении транша 2.
                const cur = ttsSentences[ttsSentenceIndex];
                if (cur && cur.isSplitSentence && cur.partIndex < cur.parts.length - 1) {
                    cur.partIndex++;
                    log(' Виртуальное тире: транш дозвучал → перелистываем перед следующим траншем', 'tts');
                    ttsPageTurning = true;
                    await new Promise(resolve => {
                        view.renderer.addEventListener('relocate', () => resolve(), { once: true });
                        setTimeout(resolve, 1500);
                        view.renderer.next();
                    });
                    await new Promise(r => setTimeout(r, 60));
                    ttsPageTurning = false;
                    await speakCurrentSentence();
                    return;
                }
                await advanceToNextSentence();
            } finally {
                _ttsNextRunning = false;
            }
        };
        // Экспортируем в window для setTimeout/runJavaScript контекстов
        window.startTTS    = () => startTTS();
        window.pauseTTS    = () => pauseTTS();
        window.resumeTTS   = () => resumeTTS();
        window.toggleTTS   = () => {
            if (ttsActive)       pauseTTS();
            else if (ttsPaused)  resumeTTS();
            else                 startTTS();
        };
        window.stopTTSFull  = () => stopTTSFull();
        // ── Коррекции произношения TTS ─────────────────────────────────────
// Список {wrong, correct, case_insensitive} приходит:
//   • при загрузке страницы — из MainActivity.onPageFinished
//     (bridge.getTTSCorrectionsCombined),
//   • при сохранении в TtsCorrectionActivity — через evaluateJavascript.
// Применяются перед отправкой текста в нативный синтез в speakCurrentSentence().
window.__ttsCorrections = [];

window.updateTTSCorrections = function(list) {
    try {
        window.__ttsCorrections = Array.isArray(list) ? list : JSON.parse(list || '[]');
        log(`TTSCorrections: загружено ${window.__ttsCorrections.length}`, 'tts');
    } catch(e) {
        window.__ttsCorrections = [];
        log('TTSCorrections: ошибка разбора — ' + e.message, 'warn');
    }
};

// Применяет замены по порядку: книжные + глобальные (список приходит
// уже объединённым с нативной стороны).
function applyTtsCorrections(text) {
    let s = text;
    for (const it of (window.__ttsCorrections || [])) {
        if (!it || !it.wrong) continue;
        const flags = it.case_insensitive ? 'gi' : 'g';
        try {
            s = s.replace(new RegExp(escapeRegExp(it.wrong), flags), it.correct ?? '');
        } catch (_) {
            s = s.split(it.wrong).join(it.correct ?? '');
        }
    }
    return s;
}

function escapeRegExp(str) {
    return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
        window.closeTTSPanel = () => closeTTSPanel();
        window.loadBook = (data) => loadBook(data);

        // Вызывается из Python (reader_window.py) сразу после синтеза PCM —
        // ДО начала воспроизведения. Сохраняем точную длительность в мс.
        window._ttsDurationMs = (ms) => {
            ttsLastPcmDurationMs = ms;

        // функции (loadBookmarks, loadHighlights, applyHighlightsForCurrentSection,

        function createUserHighlight(color = 'blue', style = 'highlight') {
            if (!currentRange || !currentRangeDoc) {
                log(' Нет выделения (currentRange или currentRangeDoc отсутствует)', 'error');
                return;
            }

            const savedRange = currentRange.cloneRange(); // Клонируем Range для безопасности
            const savedDoc   = currentRangeDoc;
            const savedText  = currentSelection;

            // Создаём ID заранее, чтобы использовать его и в Python, и в Overlayer
            const id = 'user-' + Date.now();

            // Сразу сбрасываем UI
            currentRange = null;
            currentRangeDoc = null;
            currentSelection = null;
            document.getElementById('selectionToolbar').classList.remove('visible');
            document.getElementById('miniPalette').classList.remove('visible');

            try {
                const ov = getOverlayer();
                if (!ov) {
                    log(' Overlayer недоступен', 'error');
                    return;
                }

                const hexColor = HIGHLIGHT_COLORS[color] || '#aecbfa';
                
                // Выбираем метод отрисовки в зависимости от стиля
                const styleMethod = {
                    'highlight': Overlayer.highlight,
                    'underline': Overlayer.underline,
                    'squiggly': Overlayer.squiggly,
                }[style] || Overlayer.highlight;

                log(` Применяем подсветку: цвет=${color}, стиль=${style}, текст=${savedText?.substring(0, 30)}, ID=${id}`, 'highlight');
                log(` Range: startOffset=${savedRange.startOffset}, endOffset=${savedRange.endOffset}`, 'highlight');

                // Применяем подсветку через Overlayer
                try {
                    ov.add(id, savedRange, styleMethod, { color: hexColor + 'b8' });
                    log(` Подсветка добавлена в Overlayer (стиль: ${style})`, 'highlight');
                } catch(ovError) {
                    log(` Ошибка ov.add: ${ovError.message}`, 'error');
                    console.error(ovError);
                    return;
                }

                // Убираем синее выделение текста в iframe
                try { savedDoc.getSelection()?.removeAllRanges(); } catch(e) {}

                // Получаем CFI этой строки для навигации через закладку
                let cfi = null;
                try { cfi = view.getCFI(currentSection, savedRange); } catch(e) {}

                // Сохраняем подсветку в Python с тем же ID
                if (bridge) {
                    bridge.saveHighlight(savedText, color, style, JSON.stringify({
                        id: id,
                        section: currentSection,
                        text: savedText,
                        cfi: cfi
                    }));

                    // Сохраняем соответствие ID
                    userHighlightMap[id] = id;
                }

                log(` Подсветка [${style}/${color}]: ${savedText?.substring(0,40)}`, 'highlight');

            } catch(e) {
                log(` Ошибка подсветки: ${e.message}`, 'error');
                console.error(e);
            }
        }

        // ==================== TTS НАСТРОЙКИ ====================
        function loadTTSSettings() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const settings = JSON.parse(saved);
                    currentEngine = settings.engine || 'Piper';

                    // МИГРАЦИЯ: если в localStorage лежит Edge — принудительно переключаем
                    // на Piper (Edge требует интернет, плохо работает при обрывах связи)
                    if (currentEngine === 'Edge') {
                        log(' Миграция: Edge → Piper (без интернета не работает)', 'tts');
                        currentEngine = 'Piper';
                        currentVoice = 'ru_RU_irina_medium';
                        // Сохраняем миграцию обратно чтобы не повторялась
                        settings.engine = 'Piper';
                        settings.voice = 'ru_RU_irina_medium';
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
                    } else {
                        let defaultVoice = 'ru_RU_irina_medium';
                        if (currentEngine === 'RHVoice' || currentEngine === 'SpeechD') {
                            defaultVoice = 'Anna';
                        }
                        currentVoice = settings.voice || defaultVoice;
                    }

                    ttsSpeed = settings.speed || 1.0;
                    document.getElementById('engineSelect').value = currentEngine;
                    document.getElementById('speedSlider').value = ttsSpeed;
                    const speedValue = document.getElementById('speedValue');
                    if (speedValue) speedValue.textContent = ttsSpeed + 'x';
                    log(` Загружены настройки TTS: ${currentEngine} / ${currentVoice}`, 'tts');
                }
            } catch(e) {}
            renderVoiceList();
        }

        function renderVoiceList() {
            const container = document.getElementById('voiceList');
            if (!container) return;

            const allVoices = VOICES[currentEngine] || [];
            // Для Piper показываем ТОЛЬКО реально установленные голоса —
            // иначе список раздувается до всего каталога потенциально
            // доступных для скачивания (десятки записей при полном каталоге),
            // и непонятно, что из этого реально можно выбрать прямо сейчас.
            const voices = (currentEngine === 'Piper')
                ? allVoices.filter(v => v.available)
                : allVoices;

            container.innerHTML = '';

            if (!voices.length) {
                container.innerHTML = '<div style="color:#9aa0a6;font-size:12px;padding:8px 12px;">Голоса не найдены</div>';
                return;
            }

            voices.forEach(voice => {
                const div = document.createElement('div');
                const isSelected = currentVoice === voice.id;
                div.className = 'voice-item' + (isSelected ? ' selected' : '');

                // Правая кнопка: только Piper — скачать/прогресс/галочка.
                const isPiper = (currentEngine === 'Piper');
                let btnHtml = '';
                if (isPiper) {
                    // Показываем только галочку если голос установлен.
                    // Кнопки загрузки и спиннера нет — скачивание через отдельный виджет.
                    if (voice.available) {
                        btnHtml = `<span class="material-icons vi-ok-icon" title="Установлен"
                            style="font-size:18px;color:#4caf50;flex-shrink:0;">check_circle</span>`;
                    }
                    // Если не установлен — ничего не показываем
                } else {
                    // Системные движки: галочка если доступен
                    if (voice.available !== false) {
                        btnHtml = `<span class="material-icons vi-ok-icon" title="Доступен"
                            style="font-size:18px;color:#4caf50;flex-shrink:0;">check_circle</span>`;
                    }
                }

                // ── Устанавливаем содержимое карточки голоса ──────────────
                div.innerHTML =
                    `<span class="vi-sel material-icons" style="font-size:16px;color:#1a73e8;margin-right:6px;opacity:${isSelected?1:0};transition:opacity .15s;">check</span>` +
                    `<span class="vi-name" style="flex:1;font-size:13px;color:#e8eaed;">${voice.name || voice.id}</span>` +
                    btnHtml;



                // Клик по строке → выбрать голос
                div.addEventListener('click', () => {
                    if (isPiper && !voice.available) return; // не выбираем неустановленные голоса
                    currentVoice = voice.id;
                    renderVoiceList();
                    if (bridge) bridge.setVoice(voice.id);
                    saveTTSSettings();
                    log(' Голос: ' + voice.name, 'tts');
                });

                container.appendChild(div);
            });
        }



        // ==================== ГОЛОСА PIPER ====================

         // ==================== СИСТЕМНЫЕ TTS ДВИЖКИ ====================
        // Обнаруживает SAPI5 (Windows) / speech-dispatcher (Linux).
        // Кждый установленный модуль (RHVoice, espeak-ng...) = отдельный движок в select.
        function detectSystemEngines(retryCount) {
            if (!bridge) return;
            // Qt6 WebChannel: не используем typeof — вызываем напрямую с try/catch
            try {
                bridge.getSystemEngines(json => {
                    try {
                        const engines = JSON.parse(json);
                        let added = 0;
                        engines.forEach(eng => {
                            if (!eng.voices?.length) return;
                            VOICES[eng.key] = eng.voices.map(v => ({
                                id: v.id, name: v.name,
                                available: true, downloading: false,
                                progress: 0, size: ''
                            }));
                            _addEngineOption(eng.key, eng.label);
                            log(' ' + eng.label + ': ' + eng.voices.length + ' голосов', 'tts');
                            added++;
                        });
                        if (added) {
                            renderVoiceList();
                            // Выбираем голос по умолчанию для обнаруженного движка
                            engines.forEach(eng => {
                                const voices = VOICES[eng.key];
                                if (!voices || voices.length === 0) return;
                                
                                // Проверяем, является ли этот движок текущим выбранным
                                if (eng.key !== currentEngine) return;
                                
                                // Проверяем, выбран ли уже голос
                                const hasCurrentVoice = voices.some(v => v.id === currentVoice && v.available !== false);
                                if (!hasCurrentVoice) {
                                    // Выбираем голос по умолчанию в зависимости от движка
                                    let defaultId = null;
                                    if (eng.key === 'Piper') {
                                        defaultId = 'ru_RU_irina_medium';
                                    } else if (eng.key === 'RHVoice' || eng.key === 'SpeechD') {
                                        defaultId = 'Anna';
                                    } else if (eng.key === 'Edge') {
                                        defaultId = 'ru-RU-SvetlanaNeural';
                                    }
                                    
                                    // Пробуем найти голос по умолчанию, иначе первый доступный
                                    let defaultVoice = defaultId ? voices.find(v => v.id === defaultId) : null;
                                    if (!defaultVoice) defaultVoice = voices[0];
                                    
                                    if (defaultVoice) {
                                        currentVoice = defaultVoice.id;
                                        saveTTSSettings();
                                        log(' Выбран голос по умолчанию: ' + currentVoice + ' (' + eng.key + ')', 'tts');
                                        renderVoiceList(); // Перерисовываем, чтобы показать галочку
                                    }
                                }
                            });
                        } else if (!retryCount || retryCount < 5) {
                            // TTSController мг ещё не инициализировать движки — повтряем
                            const delay = [500, 1000, 2000, 3000, 5000][retryCount || 0];
                            setTimeout(() => detectSystemEngines((retryCount || 0) + 1), delay);
                        }
                    } catch(e) { log('getSystemEngines parse: ' + e.message, 'error'); }
                });
            } catch(e) {
                // Слот ещё не готов — пвтор
                if (!retryCount || retryCount < 5) {
                    const delay = [500, 1000, 2000, 3000, 5000][retryCount || 0];
                    setTimeout(() => detectSystemEngines((retryCount || 0) + 1), delay);
                }
            }
        }


        function _addEngineOption(value, label) {
            const sel = document.getElementById('engineSelect');
            if (!sel || [...sel.options].some(o => o.value === value)) return;
            const opt = document.createElement('option');
            opt.value = value; opt.textContent = label;
            sel.appendChild(opt);
            syncCustomEngineSelect();
        }

               // Проверяем, какие голоса уже установлены, и обновляем .available в VOICES['Piper']
        function checkPiperVoices() {
            if (!bridge) return;
            // Qt6 WebChannel: без typeof-проверки, сразу try/catch
            try {
            bridge.getPiperVoices(json => {

            voices.forEach(v => {
                const existing = VOICES['Piper'].find(p => p.id === v.id);

            const nInst = VOICES['Piper'].filter(v => v.available).length;
            log(' Piper (push): ' + nInst + '/' + VOICES['Piper'].length + ' установлено', 'tts');

        // Вызывается из Python._push_tts_data() — системные движки (RHVoice и др.)

                VOICES[eng.key] = eng.voices.map(v => ({
                    id: v.id, name: v.name,
                    available: true, downloading: false,

                }));
                _addEngineOption(eng.key, eng.label);

        function highlightCurrentTocItem() {
    var tocItems = document.querySelectorAll('#tocContent .toc-item');
    if (!tocItems.length) {
        return;
    }

    var loc = view?.lastLocation;
    var currentSection = loc?.section?.current ?? 0;
    var tocItem = loc?.tocItem;
    var currentHref = tocItem?.href ?? '';

    // Сначала безусловно снимаем current со ВСЕХ пунктов, отдельным
    // проходом. Раньше это делалось в том же цикле, что искал совпадение,
    // и по first break цикл останавливался — пункты ПОСЛЕ найденного по
    // списку никогда не проверялись, и если current стоял на одном из
    // них с прошлого раза, он так и оставался висеть рядом с новым.
    for (var el of tocItems) {
        el.classList.remove('current');
    }

    // Отдельно сбрасываем отметку активной книги/вложенной группы.
    // Это важно для сборников: даже если книга свёрнута, её заголовок
    // остаётся видимым и показывает, внутри какой книги сейчас чтение.
    var groupHeaders = document.querySelectorAll('#tocContent .toc-group-header');
    for (var header of groupHeaders) {
        header.classList.remove('current-book', 'current-group');
    }

    var bestMatch = null;
    var bestText = '';

    // ⭐ ИСПОЛЬЗУЕМ for...of с break
    for (var el of tocItems) {
        var href = el.dataset.href || '';
        if (!href) {
            continue;
        }

        // ⭐ Если href совпадает — это наш кандидат, останавливаемся
        if (href === currentHref) {
            bestMatch = el;
            bestText = el.textContent.trim();
            break;  // ⭐ break останавливает цикл
        }

        // ⭐ Если текущий href без якоря, а у элемента есть якорь 0
        // (для случаев, когда currentHref = "0", а элементы имеют "0#0")
        if (currentHref === '0' && href === '0#0') {
            bestMatch = el;
            bestText = el.textContent.trim();
            break;
        }
    }

    // Фолбэк: если ничего не нашли, берём первый элемент в секции
    if (!bestMatch) {
        for (var el of tocItems) {
            var href = el.dataset.href || '';
            var parts = href.split('#');
            var section = parseInt(parts[0]);
            if (section === currentSection) {
                bestMatch = el;
                bestText = el.textContent.trim();
                break;
            }
        }
    }

    if (bestMatch) {
        bestMatch.classList.add('current');

        // Поднимаемся от активной главы к её группе. Верхний .toc-group
        // является именно книгой в сборнике; его заголовок получает
        // постоянную синюю отметку. Вложенные группы тоже слегка
        // подсвечиваются, чтобы было понятно, где именно находится глава.
        var activeGroup = bestMatch.closest('.toc-group');
        if (activeGroup) {
            var topGroup = activeGroup;
            while (topGroup.parentElement) {
                var parentGroup = topGroup.parentElement.closest('.toc-group');
                if (!parentGroup) break;
                topGroup = parentGroup;
            }

            var topHeader = topGroup.querySelector(':scope > .toc-group-header');
            if (topHeader) topHeader.classList.add('current-book');

            var group = activeGroup;
            while (group) {
                var groupHeader = group.querySelector(':scope > .toc-group-header');
                if (groupHeader && groupHeader !== topHeader) {
                    groupHeader.classList.add('current-group');
                }
                var parent = group.parentElement;
                group = parent ? parent.closest('.toc-group') : null;
            }
        }

        setTimeout(function() {
            try {
                bestMatch.scrollIntoView({ block: 'center', behavior: 'smooth' });
            } catch(e) {}
        }, 50);
        log('TOC подсветка: "' + bestText.substring(0, 30) + '..."', 'nav');
    } else {
        log('TOC подсветка: не найдено для секции ' + currentSection, 'warn');
    }
}

            safeAddListener('ttsBtn', 'click', () => {

            safeAddListener('startTTSFromPageBtn', 'click', async () => {
                document.getElementById('ttsSettingsPanel').classList.remove('visible');

                if (!currentVoice) { log(' Сначала выберите голос', 'warn'); return; }

                const renderer = view?.renderer;
                if (!renderer) { startTTS(); return; }

                stopTTSFull();
                ttsActive = true; ttsStarting = true; setTimeout(() => { ttsStarting = false; }, 500);
                ttsPaused = false;
                ttsPageTurning = false;
                updateTTSButtons();
                document.getElementById('ttsControls').classList.add('visible');
                // Скрываем кнопку возврата когда TTS запускается
                document.getElementById('returnToReadingBtn').style.display = 'none';

                try {
                    if (!await initTTSForCurrentDoc()) {
                        ttsActive = false; updateTTSButtons(); return;
                    }

                    // Используем lastRelocateRange — официальный bisect-Range paginator'а.
                    // Из логов: rect.left = renderer.start - renderer.size.
                    // Это ТОЧНОЕ начало левой видимой колонки в doc-координатах iframe.
                    // getPageRange() теперь использует ту же формулу.
                    const leftStart = lastRelocateRange ?? renderer.getPageRange();

                    if (!leftStart) {
                        log('[PageStart] нет leftStart → обычный старт', 'warn');
                        const s = view.tts.start();
                        if (s && loadSentencesFromBlock()) {
                            ttsSuppressScroll = true;
                            await speakCurrentSentence();
                        } else stopTTSFull();
                        return;
                    }

                    log(`[PageStart] leftStart: "${
                        leftStart.startContainer?.textContent?.trim().substring(0,50)}"`, 'tts');

                    // Загружаем блок содержащий начало левой колонки
                    const ssml = view.tts.from(leftStart) || view.tts.start();
                    if (!ssml || !loadSentencesFromBlock()) {
                        log('[PageStart] нет предложений', 'warn');
                        stopTTSFull(); return;
                    }

                    log(`[PageStart] блок: ${ttsSentences.length} предложений`, 'tts');

                    // Ищем первое предложение чьё НАЧАЛО >= leftStart (START_TO_START).
                    // Это пропускает предложения начавшиеся на предыдущем развороте.
                    //
                    // Но если очень длинное предложение занимает несколько колонок,
                    // START_TO_START может прыгнуть слишком далеко вперёд пропустив
                    // предложения которые визуально видны на текущей странице.
                    // В этом случае откатываемся к END_TO_START (конец предложения
                    // >= leftStart) — лучше захватить хвост предыдущего разворота
                    // чем пропустить несколько видимых предложений.
                    const MAX_SKIP = 3; // допустимо пропустить не более 3 предложений

                    let startIdx = -1;
                    for (let i = 0; i < ttsSentences.length; i++) {
                        try {
                            if (ttsSentences[i].range.compareBoundaryPoints(
                                    Range.START_TO_START, leftStart) >= 0) {
                                startIdx = i;
                                break;
                            }
                        } catch(e) {}
                    }

                    if (startIdx < 0) {
                        // Ни одно предложение не начинается после leftStart → последнее
                        startIdx = ttsSentences.length - 1;
                    } else if (startIdx > MAX_SKIP) {
                        // Прыгнули слишком далеко — откатываемся к END_TO_START
                        log(`[PageStart] START_TO_START пропустил ${startIdx} предложений → ` +
                            `откат к END_TO_START`, 'tts');
                        for (let i = 0; i < ttsSentences.length; i++) {
                            try {
                                if (ttsSentences[i].range.compareBoundaryPoints(
                                        Range.END_TO_START, leftStart) >= 0) {
                                    startIdx = i;
                                    break;
                                }
                            } catch(e) {}
                        }
                    }

                    log(`[PageStart] старт: предложение ${startIdx+1}/${ttsSentences.length} ` +
                        `"${ttsSentences[startIdx]?.text?.substring(0,60)}"`, 'tts');

                    ttsSentenceIndex = startIdx;
                    ttsSuppressScroll = true;
                    await speakCurrentSentence();

                } catch(e) {
                    log('[PageStart] Ошибка: ' + e.message, 'error');
                    console.error(e);
                    ttsActive = false; updateTTSButtons();
                }

            // Переключение предложений — пауза → смена индекса → воспроизведение
            // Не используем bridge.stopTTS() напрямую — он асинхронный и вызывает зависание.
            // Вместо этого: ставим паузу (сбрасывает флаги), меняем индекс, возобновляем.
            let _sentenceNavBusy = false;

            // Вспомогательная функция: выполняет действие с блокировкой и авто-таймаутом
            async function _navAction(fn) {
                if (_sentenceNavBusy) return;
                if (!ttsActive && !ttsPaused) return;
                _sentenceNavBusy = true;
                // Авто-разблокировка через 3 сек на случай зависания
                const timeout = setTimeout(() => { _sentenceNavBusy = false; }, 3000);
                try {
                    if (ttsActive) pauseTTS();
                    await new Promise(r => setTimeout(r, 80));
                    await fn();

                    log(' nav error: ' + e.message, 'warn');

                    _sentenceNavBusy = false;

            safeAddListener('ttsPrevBtn', 'click', () => _navAction(async () => {
                const cur = ttsSentences[ttsSentenceIndex];
                // Разрывное предложение на транше 2 → возвращаемся к траншу 1
                // БЕЗ обратного перелистывания: страница уже перевёрнута вперёд для
                // транша 2, а текст транша 1 физически остался на предыдущей
                // странице — но пользователь жмёт "предыдущее", ожидая услышать
                // начало ЭТОГО ЖЕ предложения ещё раз, а не два коротких прыжка
                // туда-обратно. Проще и предсказуемее: просто повторить транш 1
                // на текущей (уже перевёрнутой) странице — он всё равно короткий.
                if (cur && cur.isSplitSentence && cur.partIndex > 0) {
                    cur.partIndex--;
                    ttsPaused = false;

                const cur = ttsSentences[ttsSentenceIndex];

                    ttsPaused = false;
                    ttsActive = true; ttsStarting = true; setTimeout(() => { ttsStarting = false; }, 500);

            dropdown.innerHTML = '';

                div.className = 'custom-select-option' + (opt.value === hiddenSelect.value ? ' selected' : '');
                div.dataset.value = opt.value;
                div.textContent = opt.text;

            }

            const selected = hiddenSelect.options[hiddenSelect.selectedIndex];

        function initCustomEngineSelect() {
            const trigger = document.getElementById('engineSelectTrigger');

                dropdown.classList.toggle('open', !isOpen);

            });

            // Закрыть при клике вне
            document.addEventListener('click', () => {
                dropdown.classList.remove('open');
                trigger.classList.remove('open');
            });

            // Выбор пункта
            dropdown.addEventListener('click', (e) => {
                const opt = e.target.closest('.custom-select-option');
                if (!opt) return;
                const value = opt.dataset.value;
                const label = opt.textContent;

                // Обновляем визуал
                dropdown.querySelectorAll('.custom-select-option').forEach(o =>
                    o.classList.toggle('selected', o === opt));
                document.getElementById('engineSelectLabel').textContent = label;

                // Синхронизируем скрытый select

                // Закрываем
                dropdown.classList.remove('open');

            function comicFitWidth() {

                const scaleByH = maxH / natH;
                comicBaseW = natW * Math.min(scaleByW, scaleByH);
                return comicBaseW;

                if (comicLabel)
                    comicLabel.textContent = Math.round(comicScale * 100) + '%';

            function setComicScale(s) {

                // ══════════════════════════════════════════════════════════════════
        //  УПРАВЛЕНИЕ TTS С BT-ГАРНИТУРЫ
        // ══════════════════════════════════════════════════════════════════
        // Эти функции вызывает нативный TtsRemoteControlManager через
        // evaluateJavascript. Логика:
        //   onTtsRemotePause — сохраняем текущую фразу, останавливаем TTS
        //   onTtsRemotePlay  — если фраза сохранена, повторяем её через
        //                      AndroidBridge.onTTSText; иначе просто
        //                      продолжаем обычный сеанс (advance/start)
        //   onTtsRemoteStop  — полный сброс (кнопка "Stop" на гарнитуре,
        //                      долгое удержание и т.п.)
        //
        // ВАЖНО: переменная __ttsPausedAtPhrase хранит ТЕКСТ фразы, а не
        // Range (Range теряется при перерисовке iframe). При продолжении
        // мы находим эту фразу в текущем блоке ttsSentences[] и стартуем
        // с неё. Если не нашли (например, пользователь перевернул страницу) —
        // начинаем новую сессию с текущего видимого места.

        let __ttsPausedAtPhrase = null;
        let __ttsPausedAtIndex  = -1;

        window.onTtsRemotePause = function() {
            if (!ttsActive && !ttsPaused) return;
            // Запоминаем текущую фразу ДО остановки
            const cur = ttsSentences?.[ttsSentenceIndex];
            if (cur) {
                __ttsPausedAtPhrase = cur.text || null;
                __ttsPausedAtIndex  = ttsSentenceIndex;
            }
            pauseTTS();
            log(' BT-пауза: сохранили фразу #' + __ttsPausedAtIndex, 'tts');
        };

        window.onTtsRemotePlay = function() {
            // Уже играет — не дублируем
            if (ttsActive) return;

            // Пауза с сохранённой фразой — продолжаем с неё
            if (ttsPaused && ttsSentences?.length > 0 && ttsSentenceIndex < ttsSentences.length) {
                ttsPaused = false;
                ttsActive = true;
                ttsStarting = true;
                setTimeout(() => { ttsStarting = false; }, 500);
                ttsPageTurning = false;
                updateTTSButtons();
                document.getElementById('ttsControls')?.classList.add('visible');
                // ВАЖНО: повторяем именно ту фразу, что была на паузе —
                // не сдвигаем индекс. resumeTTS() сделает то же самое.
                speakCurrentSentence();
                log(' BT-play: продолжаем с фразы #' + ttsSentenceIndex, 'tts');
                return;
            }

            // Пауза без сохранённой фразы — просто повторяем
            if (ttsPaused) {
                resumeTTS();
                return;
            }

            // Совсем ничего не играло — стартуем новую сессию
            startTTS();
        };

        window.onTtsRemoteStop = function() {
            __ttsPausedAtPhrase = null;
            __ttsPausedAtIndex  = -1;
            stopTTSFull();
            log(' BT-stop: полная остановка', 'tts');
        };

        // Показ сноски в модальном окне
        function showFootnote(fnView) {
            const modal = document.getElementById('footnoteModal');
            const content = document.getElementById('footnoteContent');
            if (!modal || !content) return;

            content.innerHTML = '';
            const iframe = document.createElement('iframe');
            iframe.style.width = '100%';
            iframe.style.height = '300px';
            content.appendChild(iframe);

            setTimeout(() => {
                try {
                    const fnDoc = fnView.renderer?.getContents?.()?.[0]?.doc;
                    if (fnDoc && iframe.contentDocument) {
                        iframe.contentDocument.body.innerHTML = fnDoc.body.innerHTML;
                    }
                } catch(e) {
                    content.innerHTML = '<p>Сноска загружена</p>';
                }
            }, 100);

            modal.classList.add('visible');
            if (modal.closeTimer) clearTimeout(modal.closeTimer);
            modal.closeTimer = setTimeout(() => {
                modal.classList.remove('visible');
            }, 10000);
        }

        // Показ информации о книге в панели оглавления
        function showBookInfoInPanel(title, author, bookType) {
            const header = document.getElementById('bookInfoHeader');
            const coverImg = document.getElementById('bookCoverImg');
            const infoTitle = document.getElementById('bookInfoTitle');
            const infoAuthor = document.getElementById('bookInfoAuthor');
            
            if (!header || !coverImg || !infoTitle || !infoAuthor) return;
            
            // Показываем панель
            header.style.display = 'flex';
            
            // Устанавливаем название и автора (с обрезкой)
            const shortTitle = title.length > 35 ? title.substring(0, 35) + '…' : title;
            infoTitle.textContent = shortTitle;
            infoAuthor.textContent = author || '';
            infoTitle.title = title;  // Полное название в tooltip
            infoAuthor.title = author || '';
            
            // Для CBZ показываем первую страницу как обложку
            if (bookType === 'cbz' && book?.sections?.length > 0) {
                const firstSection = book.sections[0];
                if (firstSection) {
                    firstSection.load().then(pageUrl => {
                        const match = pageUrl.match(/<img src="([^"]+)"/);
                        if (match && match[1]) {
                            coverImg.src = match[1];
                            coverImg.style.display = 'block';
                        } else {
                            coverImg.style.display = 'none';
                        }
                    }).catch(() => {
                        coverImg.style.display = 'none';
                    });
                }
            } else {
                // Для EPUB/FB2 пытаемся получить обложку
                if (book?.getCover) {
                    book.getCover().then(blob => {
                        if (blob) {
                            // Освобождаем предыдущий blob URL если был
                            if (coverImg.src && coverImg.src.startsWith('blob:')) {
                                URL.revokeObjectURL(coverImg.src);
                            }
                            coverImg.src = URL.createObjectURL(blob);
                            coverImg.style.display = 'block';
                        } else {
                            coverImg.style.display = 'none';
                        }
                    }).catch(() => {
                        coverImg.style.display = 'none';
                    });
                } else {
                    coverImg.style.display = 'none';
                }
            }
        }

        init();
    </script>
