<!DOCTYPE html>
<html style="background:#f4ecd8">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaReader</title>
    <script>
        // Применяем тему синхронно ДО рендера CSS — убирает flash бежевого/белого фона
        try {
            const bg   = localStorage.getItem('nr_theme_bg');
            const text = localStorage.getItem('nr_theme_text');
            const acc  = localStorage.getItem('nr_spinner_color');
            if (bg)   document.documentElement.style.setProperty('--bg-color',   bg);
            if (text) document.documentElement.style.setProperty('--text-color', text);
            if (acc)  document.documentElement.style.setProperty('--spinner-color', acc);
            else if (text) document.documentElement.style.setProperty('--spinner-color', text);
            if (bg)   document.documentElement.style.background = bg;
        } catch(e) {}
    </script>
    <style>
        @font-face {
            font-family: 'Material Icons';
            font-style: normal;
            font-weight: 400;
            src: url('MaterialIcons-Regular.ttf') format('truetype');
        }

        .material-icons {
            font-family: 'Material Icons';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: var(--bg-color, #f4ecd8);
            color: var(--text-color, #5b4636);
            height: 100vh;
        }

        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        #app.ready {
            opacity: 1;
        }

        #viewer-container {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
            background: transparent;
        }


        foliate-view {
            width: 100%;
            height: 100%;
            display: block;
            background: transparent;
            border: none !important;
            outline: none !important;
        }

        /* Убираем все рамки у iframe внутри foliate-view */
        foliate-view iframe {
            border: none !important;
            outline: none !important;
        }

        /* Верхняя панель */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--panel-height, 48px);
            background: rgba(32, 33, 36, 0.95);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 8px;
            z-index: 1000;
            transition: transform 0.3s;
            will-change: transform;
            color: white;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .top-bar.hidden { transform: translateY(-100%); }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--panel-height, 48px);
            background: rgba(32, 33, 36, 0.95);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 8px;
            z-index: 1000;
            transition: transform 0.3s;
            will-change: transform;
            color: white;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .bottom-nav.hidden { transform: translateY(100%); }

        /* Единый отклик на нажатие: Android/WebView не рисует свой синий overlay.
           Визуальный отклик полностью контролирует HTML. */
        button { -webkit-tap-highlight-color: transparent; }
        button:focus, button:focus-visible { outline: none; }
        button:active { transform: scale(0.95); filter: brightness(0.92); }

        .icon-button {
            background: transparent;
            border: none;
            width: calc(var(--panel-height, 48px) * 0.75);
            height: calc(var(--panel-height, 48px) * 0.75);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #e8eaed;
            transition: background 0.2s;
        }

        .icon-button:hover { background: rgba(255,255,255,0.1); }
        .icon-button:active {
            background: rgba(255,255,255,0.15);
            transform: scale(0.95);
            filter: none;
        }
        .icon-button.primary { background: #1a73e8; }
        .icon-button.small { width: 32px; height: 32px; }
        .icon-button .material-icons { font-size: calc(var(--panel-height, 48px) * 0.458); }

        #openSystemTtsSettingsBtn { transition: background .15s, transform .15s, filter .15s; }
        #openSystemTtsSettingsBtn:hover { background: rgba(255,255,255,0.10) !important; }
        #openSystemTtsSettingsBtn:active {
            background: rgba(255,255,255,0.15) !important;
            transform: scale(0.95);
            filter: none;
        }

        #returnToLibraryBtn { transition: background .15s, transform .15s, filter .15s; }
        #returnToLibraryBtn:hover { background: rgba(255,255,255,0.10) !important; }
        #returnToLibraryBtn:active {
            background: rgba(255,255,255,0.15) !important;
            transform: scale(0.95);
            filter: none;
        }

        .book-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin: 0 12px;
            min-width: 0;
        }

        .book-title {
            font-size: 14px;
            font-weight: 500;
            color: #e8eaed;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .book-author {
            font-size: 11px;
            color: #9aa0a6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .page-info {
            font-size: 13px;
            color: #9aa0a6;
            min-width: 70px;
            text-align: center;
        }
        
        #progressInfo {
            color: #4caf50 !important;
            font-weight: 500;
            min-width: 50px;
        }


        /* ── Highlights panel ───────────────────────────────────── */
        .highlights-filter-row {
            display: flex; gap: 6px; padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,.07);
            flex-shrink: 0;
        }
        .hl-filter-btn {
            background: transparent; border: 1px solid rgba(255,255,255,.15);
            border-radius: 14px; color: #9aa0a6; font-size: 12px;
            padding: 3px 12px; cursor: pointer; transition: all .15s;
        }
        .hl-filter-btn.active, .hl-filter-btn:hover {
            background: #1a73e8; border-color: #1a73e8; color: #fff;
        }
        .hl-filter-btn:active {
            background: rgba(255,255,255,.15);
            border-color: rgba(255,255,255,.25);
            transform: scale(0.95);
        }
        .hl-item {
            padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,.05);
            cursor: pointer; transition: background .12s;
        }
        .hl-item:hover { background: rgba(255,255,255,.04); }
        .hl-item-color-bar {
            width: 3px; border-radius: 2px; flex-shrink: 0; align-self: stretch;
        }
        .hl-item-body { flex: 1; min-width: 0; }
        .hl-item-text {
            font-size: 13px; color: #e8eaed; line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .hl-item-meta { font-size: 11px; color: #5f6368; margin-top: 4px; }
        .hl-item-note {
            font-size: 12px; color: #9aa0a6; margin-top: 5px;
            padding: 5px 8px; background: rgba(255,255,255,.04);
            border-radius: 5px; border-left: 2px solid #7ecfff;
            white-space: pre-wrap;
        }
        .hl-item-actions {
            display: flex; gap: 4px; margin-top: 6px; opacity: 0;
            transition: opacity .15s;
        }
        .hl-item:hover .hl-item-actions { opacity: 1; }
        .hl-action-btn {
            background: transparent; border: none; color: #5f6368;
            cursor: pointer; padding: 2px 6px; border-radius: 4px;
            font-size: 11px; display: flex; align-items: center; gap: 3px;
            transition: color .12s, background .12s;
        }
        .hl-action-btn:hover { color: #e8eaed; background: rgba(255,255,255,.08); }
        .hl-action-btn:active { background: rgba(255,255,255,.15); transform: scale(0.95); }
        .hl-action-btn .material-icons { font-size: 14px; }
        .hl-empty { padding: 40px 20px; text-align: center; color: #5f6368; font-size: 14px; }

        /* ── Note dialog ─────────────────────────────────────────── */
        .note-dialog-overlay {
            display: none; position: fixed; inset: 0; z-index: 9000;
            background: rgba(0,0,0,.55); align-items: center; justify-content: center;
        }
        .note-dialog-overlay.visible { display: flex; }
        .note-dialog {
            background: #1e1e2e; border: 1px solid #3a3a50; border-radius: 12px;
            width: min(480px, 92vw); padding: 0; overflow: hidden;
            box-shadow: 0 24px 48px rgba(0,0,0,.6);
            animation: noteSlideIn .18s ease;
        }
        @keyframes noteSlideIn {
            from { opacity:0; transform: scale(.95) translateY(10px); }
            to   { opacity:1; transform: scale(1)  translateY(0); }
        }
        .note-dialog-header {
            display: flex; align-items: center; gap: 8px;
            padding: 14px 16px; border-bottom: 1px solid #3a3a50;
            font-size: 14px; font-weight: 600; color: #e8eaed;
        }
        .note-dialog-header .icon-button.small { margin-left: auto; }
        .note-dialog-quote {
            margin: 12px 16px 0;
            padding: 8px 10px 8px 12px;
            background: rgba(255,255,255,.04);
            border-left: 3px solid #1a73e8;
            border-radius: 0 6px 6px 0;
            font-size: 13px; color: #9aa0a6; line-height: 1.5;
            max-height: 80px; overflow: hidden;
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
        }
        .note-dialog-quote:empty { display: none; }
        .note-dialog-textarea {
            display: block; width: calc(100% - 32px);
            margin: 12px 16px; min-height: 110px; max-height: 260px;
            background: #13131f; border: 1px solid #3a3a50; border-radius: 8px;
            color: #e8eaed; font-size: 14px; font-family: inherit;
            padding: 10px 12px; resize: vertical; outline: none;
            transition: border-color .15s;
        }
        .note-dialog-textarea:focus { border-color: #1a73e8; }
        .note-dialog-actions {
            display: flex; justify-content: flex-end; gap: 8px;
            padding: 12px 16px; border-top: 1px solid #3a3a50;
        }
        .note-btn-cancel, .note-btn-save {
            border: none; border-radius: 6px; padding: 8px 20px;
            font-size: 13px; cursor: pointer; transition: background .15s;
        }
        .note-btn-cancel { background: rgba(255,255,255,.08); color: #9aa0a6; }
        .note-btn-cancel:hover { background: rgba(255,255,255,.13); color: #e8eaed; }
        .note-btn-cancel:active { background: rgba(255,255,255,.18); transform: scale(0.95); }
        .note-btn-save { background: #1a73e8; color: #fff; }
        .note-btn-save:hover { background: #1765cc; }
        .note-btn-save:active { background: #155bb5; transform: scale(0.95); }
        .tts-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4caf50;
            display: none;
        }
        .tts-indicator.active { display: block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; transform: scale(1.2); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* TTS кнопки поверх листа — в нижней части viewer-container */
        .tts-controls {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 500;
            pointer-events: auto;
        }
        .tts-controls.visible { display: flex; }

        /* Кнопка TTS на листе — прозрачный фон, только иконка */
        /* --tts-btn-color обновляется из JS при смене темы */
        :root { --tts-btn-color: rgba(80, 80, 80, 0.75); --tts-btn-hover: rgba(0,0,0,0.95); }

        .tts-page-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--tts-btn-color);
            padding: 4px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.15s;
            line-height: 1;
            filter: var(--tts-btn-shadow, drop-shadow(0 1px 2px rgba(0,0,0,0.3)));
        }
        .tts-page-btn:hover {
            color: var(--tts-btn-hover);
            transform: scale(1.2);
        }
        .tts-page-btn:active {
            color: var(--tts-btn-hover);
            transform: scale(0.95);
            filter: none;
        }
        .tts-page-btn .material-icons { font-size: 24px; }
        /* Кнопка play/pause крупнее */
        #ttsPlayPauseBtn .material-icons { font-size: 30px; }



                .selection-toolbar {
            position: fixed;
            background: rgba(32, 33, 36, 0.98);
            border-radius: 40px;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            gap: 2px;
            z-index: 2000;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s, top 0.2s;
        }

        .selection-toolbar.visible {
            opacity: 1;
            pointer-events: all;
        }

        .toolbar-btn {
            background: transparent;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #e8eaed;
            transition: background 0.2s;
        }

        .toolbar-btn:hover { background: rgba(255,255,255,0.1); }
        .toolbar-btn:active { background: rgba(255,255,255,0.15); transform: scale(0.95); filter: none; }
        .toolbar-btn .material-icons { font-size: 20px; }

        .toc-tab:active, .add-bookmark-btn:active, .tts-start-page-btn:active {
            transform: scale(0.95);
            filter: brightness(0.92);
        }

        .mini-palette {
            position: fixed;
            background: rgba(32, 33, 36, 0.98);
            border-radius: 40px;
            padding: 6px;
            display: flex;
            gap: 4px;
            z-index: 2100;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            transform: translate(-50%, 0);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s, top 0.2s;
        }

        .mini-palette.visible {
            opacity: 1;
            pointer-events: all;
        }

        .color-option {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-red { background-color: #ff4444; }
        .color-violet { background-color: #b344ff; }
        .color-blue { background-color: #4488ff; }
        .color-green { background-color: #44ff44; }
        .color-yellow { background-color: #ffdd44; }

        .tts-settings-panel {
            position: fixed;
            bottom: 70px;
            right: 20px;
            width: 300px;
            background: rgba(32, 33, 36, 0.98);
            border-radius: 12px;
            padding: 16px;
            color: white;
            z-index: 2000;
            display: none;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tts-settings-panel.visible { display: block; }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .settings-header h3 { font-size: 14px; font-weight: 500; color: #e8eaed; }

        .engine-section { margin-bottom: 16px; }
        .engine-section label { display: block; font-size: 11px; color: #9aa0a6; margin-bottom: 6px; text-transform: uppercase; }
        .engine-select { display: none; }
        .custom-select-wrapper { position: relative; width: 100%; }
        .custom-select-trigger {
            width: 100%; padding: 8px 10px; background: #1e1e2e;
            border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
            color: #e8eaed; font-size: 13px; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            box-sizing: border-box; user-select: none;
        }
        .custom-select-trigger:hover { border-color: rgba(255,255,255,0.4); }
        .custom-select-trigger.open { border-color: #4a90e2; border-radius: 6px 6px 0 0; }
        .custom-select-dropdown {
            display: none; position: absolute; top: 100%; left: 0; right: 0;
            background: #1e1e2e; border: 1px solid #4a90e2;
            border-top: none; border-radius: 0 0 6px 6px;
            z-index: 1000; max-height: 200px; overflow-y: auto;
        }
        .custom-select-dropdown.open { display: block; }
        .custom-select-option {
            padding: 8px 10px; color: #e8eaed; font-size: 13px;
            cursor: pointer; transition: background 0.15s;
        }
        .custom-select-option:hover { background: rgba(74,144,226,0.3); color: #fff; }
        .custom-select-option.selected { background: rgba(74,144,226,0.2); color: #4a90e2; }

        .voice-list {
            margin-bottom: 16px;
        }

        .voice-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.15s;
            margin-bottom: 4px;
            position: relative;
            overflow: hidden;
        }
        .voice-item:hover { background: rgba(255,255,255,0.08); }
        .voice-item.selected { background: rgba(26,115,232,0.18); }

        /* Название голоса */
        .voice-item .vi-name { flex: 1; font-size: 14px; color: #e8eaed; }

        /* Иконка выбранного (галочка слева от статуса, синяя) */
        .voice-item .vi-sel {
            font-size: 16px; color: #1a73e8;
            margin-right: 6px; opacity: 0;
            transition: opacity 0.15s;
        }
        .voice-item.selected .vi-sel { opacity: 1; }

        /* Кнопка-статус справа */
        .vi-btn {
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-size: 14px;
            cursor: pointer;
            border: none; outline: none;
            transition: transform 0.15s, background 0.15s;
        }
        .vi-btn:hover { transform: scale(1.1); }

        /* Зелёная галочка — голос установлен */
        .vi-btn.vi-ok {
            background: #34a853;
            color: white;
            cursor: default;
        }

        /* Стрелка вниз — скачать */

        /* Полоска прогресса */
        .vi-progress {
            position: absolute; bottom: 0; left: 0;
            height: 2px; background: #1a73e8;
            transition: width 0.3s;
            border-radius: 1px;
        }

        .speed-section { margin-bottom: 16px; }
        .speed-section label { display: block; font-size: 11px; color: #9aa0a6; margin-bottom: 8px; text-transform: uppercase; }
        .speed-control input { width: 100%; height: 3px; background: rgba(255,255,255,0.2); border-radius: 2px; -webkit-appearance: none; }
        .speed-control input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #1a73e8; border: 2px solid white; border-radius: 50%; cursor: pointer; }
        .speed-markers { display: flex; justify-content: space-between; font-size: 9px; color: #9aa0a6; padding: 0 2px; }
        .speed-value { text-align: center; font-size: 13px; color: #1a73e8; margin-top: 6px; font-weight: 500; }

        /* Компактная кнопка запуска TTS с начала страницы */
        .tts-start-page-wrapper {
            padding: 8px 12px 12px;
            display: flex;
            justify-content: center;
        }

        .tts-start-page-btn {
            width: 56px;
            height: 56px;
            padding: 0;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(26, 115, 232, 0.4);
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .tts-start-page-btn .material-icons { font-size: 28px; }

        .tts-start-page-btn:hover {
            background: #1557b0;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.6);
        }

        .tts-start-page-btn:active { transform: scale(0.95); }

        .tts-start-page-btn:focus-visible {
            outline: 2px solid #8ab4f8;
            outline-offset: 3px;
        }




        .toc-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 320px;
            height: 100vh;
            background: rgba(32,33,36,0.98);
            transform: translateX(-320px);
            transition: transform 0.25s ease;
            will-change: transform;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            color: white;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .toc-panel.visible { transform: translateX(0); }

        .toc-header {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .toc-tabs { display: flex; gap: 4px; }
        .toc-tab {
            background: transparent; border: none; cursor: pointer;
            color: rgba(255,255,255,.45); border-radius: 6px;

            transition: background .15s, color .15s;

        .toc-tab.active { background: rgba(26,115,232,.25);  color: #7ab4f5; }
        .toc-tab .material-icons { font-size: 20px; }

        .toc-content {

            overflow-y: auto;
            padding: 8px 0;

        .toc-item {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;

        /* Модальное окно для сносок */
        .footnote-modal {

    <script type="module">
        import { makeBook } from './view.js';

        window.makeBook = makeBook;

      // ==================== КОНФИГУРАЦИЯ ====================
        const VOICES = {
            'System': [] // "Системный (по умолчанию)" — голос не выбирается в приложении,
                         // играет то, что установлено в настройках синтеза речи Android.
                         // Реальные установленные движки дописываются динамически
                         // через detectSystemEngines().
        };

        // Реестр системных движков: { 'RHVoice': [{id, name, available}], ... }
        const SYSTEM_ENGINES = {};

        const STORAGE_KEY = 'tts_settings';
        const HIGHLIGHT_COLORS = {
            'red': '#ff4444', 'violet': '#b344ff', 'blue': '#4488ff', 'green': '#44ff44', 'yellow': '#ffdd44', 'cyan': '#00CED1'
        };

        // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
        let bridge = null;
        let view = null;
        let book = null;
        let overlayer = null;
        let currentSection = 0;
        let bookReady = false; // Флаг готовности книги
        let currentBookPath = null; // Путь к текущей книге для работы с подсветками

        // TTS переменные

        const L = (ru, en) => window.LANG === 'en' ? en : ru;

        // Перевод элементов TTS-панели. Язык берётся из SettingsWindow

        const TTS_TRANSLATIONS = {
            ru: {
                tts_settings: 'Настройки TTS',
                tts_engine: 'ДВИЖОК',
                tts_speed: 'СКОРОСТЬ',
                tts_start_page: 'Читать с начала страницы',
                close: 'Закрыть',
                piper_voice_folder: 'ПАПКА ДЛЯ ГОЛОСОВ PIPER',

                fast: 'Быстро',

                tts_next: 'Следующее предложение',

            },
            en: {
                tts_settings: 'TTS Settings',
                tts_engine: 'ENGINE',
                tts_speed: 'SPEED',
                tts_start_page: 'Read from the beginning of the page',
                close: 'Close',
                piper_voice_folder: 'PIPER VOICES FOLDER',
                piper_voice_hint: 'Place .onnx and .onnx.json here',
                slow: 'Slow',
                fast: 'Fast',
                copy: 'Copy',
                highlight: 'Highlight',
                bookmark: 'Bookmark',
                save_image: 'Save as image',
                note: 'Note',
                search: 'Search',
                dictionary: 'Dictionary',
                speak_from_here: 'Read from here',
                tts_prev: 'Previous sentence',
                tts_play_pause: 'Pause/Play',
                tts_next: 'Next sentence',
                tts_settings_button: 'TTS Settings',
                tts_stop: 'Stop TTS'
            }
        };

        function ttsText(key) {
            const lang = window.LANG === 'en' ? 'en' : 'ru';
            return TTS_TRANSLATIONS[lang][key] || TTS_TRANSLATIONS.ru[key] || key;
        }

        function applyTTSLanguage() {
            document.querySelectorAll('[data-i18n]').forEach((element) => {
                element.textContent = ttsText(element.dataset.i18n);
            });

            document.querySelectorAll('[data-i18n-title]').forEach((element) => {
                const text = ttsText(element.dataset.i18nTitle);
                element.title = text;
                element.setAttribute('aria-label', text);
            });
        }

        window.setReaderLanguage = function(language) {
            window.LANG = language === 'en' ? 'en' : 'ru';
            applyTTSLanguage();
        };

        let ttsActive = false;
        let ttsGhostMode = false;  // призрачный режим: TTS позиционируется без звука и подсветки
        let ttsPaused = false;          // true = на паузе (подсветка сохранена, можно продолжить)
        let ttsSentences = [];          // [{name, text, range}] — предложения/слова текущего блока
        let ttsSentenceIndex = 0;       // текущий индекс внутри ttsSentences
        let ttsSpeed = 1.0;
        let _splitPredictCache = new WeakMap();
        let currentEngine = 'Piper';
        let currentVoice = 'ru_RU_irina_medium';
        let ttsPageTurning = false;     // флаг: идёт перелистывание / переход секции
        let ttsSuppressScroll = false;  // флаг: не двигать страницу при первом предложении
        let ttsSplitFlipTimer = null;   // УСТАРЕЛО: раньше — таймер листания по проценту/word-timings.
                                        // Больше не используется для планирования листания (см.
                                        // «виртуальное тире» в speakCurrentSentence/window.ttsNext) —
                                        // оставлено только как безопасный no-op sink для старых clearTimeout().
        let ttsLastPcmDurationMs = 0;   // точная длительность (мс) от Python PCM; 0 = неизвестна
        let lastRelocateRange = null;   // Range начала видимой области из последнего relocate
        let pendingTTSStart = null;     // флаг: TTS ждёт готовности книги
        let ttsGlobalRepeatCount = 0;   // ГЛОБАЛЬНЫЙ счётчик повторов
        let ttsLastGlobalText = '';     // последний текст для глобальной проверки
        let ttsLastBlockSignature = ''; // «отпечаток» предыдущего блока (первые N слов) для пропуска дублей

        // Подсветка
        let currentSelection = null;
        let currentRange = null;
        let currentRangeDoc = null;   // doc (iframe) в котором был создан currentRange
        let currentStyle = 'highlight';
        let currentColor = 'blue';

        // Android: обычный doc.addEventListener('pointerup', ...) ниже не
        // всегда успевает отработать до того, как пользователь нажмёт кнопку
        // в НАТИВНОЙ Android-панели выделения (системный ActionMode) — сама
        // панель показывается по внутренней детекции Chromium, независимо
        // от нашего JS. currentSelection/currentRange к этому моменту может
        // быть ещё null, хотя реальное выделение (doc.getSelection()) уже
        // живое. Эта функция синхронизирует переменные с реальным
        // выделением по требованию — вызывается из native-selection-toolbar.js
        // прямо перед кликом по кнопке.
        window.novaSyncSelectionFromLiveDOM = function () {
            try {
                const viewerEl = document.getElementById('viewer');
                const contents = viewerEl?.renderer?.getContents?.() || [];
                for (const c of contents) {
                    const d = c?.doc;
                    if (!d) continue;
                    const sel = d.getSelection?.();
                    const text = sel?.toString().trim();
                    if (text && text.length > 0 && sel.rangeCount > 0) {
                        currentSelection = text;
                        currentRange = sel.getRangeAt(0);
                        currentRangeDoc = d;
                        return true;
                    }
                }
            } catch (e) { /* ignore */ }
            return false;
        };

        // ID текущей TTS подсветки
        let currentTTSHighlightId = null;

        // Цвет TTS-подсветки (настраивается через Python).
        // Источник истины — модуль ./tts-highlight-color.js; эти переменные
        // держат локальную копию, чтобы не переписывать все места по файлу,
        // где ttsHighlightColor/ttsHighlightOpacity читаются напрямую.
        let ttsHighlightColor = DEFAULT_TTS_HIGHLIGHT_COLOR;
        let ttsHighlightOpacity = DEFAULT_TTS_HIGHLIGHT_OPACITY;
        let lastTtsCfi = null;         // CFI последнего озвученного предложения (для возврата)
        let lastTtsSectionIndex  = -1;   // Секция в которой идёт TTS (для проверки смены главы)
        let ttsUserNavigated     = false; // true если пользователь вручную листнул во время TTS
        let ttsStarting          = false; // true в момент запуска TTS — игнорируем relocate
        let lastTtsRange = null;       // Range последнего озвученного предложения
        let lastTtsSentenceText = null; // Текст последнего предложения (для поиска в новом DOM)
        let ttsHighlightColorName = 'cyan';

        // Тонкая обёртка над parseTtsRgba из tts-highlight-color.js — оставлена
        // с тем же именем, чтобы не менять вызовы по всему файлу.
        function parseTtsRgba(rgbaStr) {
            return _parseTtsRgba(rgbaStr);
        }

        // Применяет новый цвет+прозрачность (делегируя хранение состояния в
        // tts-highlight-color.js) и, если подсветка сейчас активна,
        // перерисовывает её немедленно с новыми параметрами.
        function applyTtsHighlightColor(colorHex, opacity) {
            const applied = _setTtsHighlightColor(colorHex, opacity);
            ttsHighlightColor = applied.color;
            ttsHighlightOpacity = applied.opacity;
            if (overlayer && currentTTSHighlightId && lastTtsRange) {
                try {
                    const id = currentTTSHighlightId;
                    overlayer.remove(id);
                    overlayer.add(id, lastTtsRange, Overlayer.highlight, {
                        color: ttsHighlightColor,
                        opacity: ttsHighlightOpacity,
                    });
                } catch(e) {
                    log(' Ошибка обновления цвета TTS-подсветки: ' + e.message, 'error');
                }
            }
        }
        
        // Хранилище пользовательских подсветок: {pythonId: overlayerId}
        const userHighlightMap = {};

        // ==================== ИНДИКАТОР ПОДСВЕТКИ ====================
        const highlightIndicator = document.getElementById('highlightIndicator');
        const highlightText = document.getElementById('highlightText');

        function showHighlightIndicator(text, success = true) {
            highlightIndicator.classList.add('active');
            if (success) {
                highlightText.textContent = ` Подсвечено: ${text.substring(0, 50)}...`;
                highlightIndicator.style.borderLeftColor = ttsHighlightColor;
            } else {
                highlightText.textContent = ` Не найдено: ${text.substring(0, 50)}...`;
                highlightIndicator.style.borderLeftColor = '#ff6b6b';
            }

            setTimeout(() => {
                highlightIndicator.classList.remove('active');
            }, 3000);
        }

        // ==================== ОТЛАДКА ====================
        const debugEl = document.getElementById('debugLogs');
        const highlightDebugEl = document.getElementById('debugHighlight');
        const domDebugEl = document.getElementById('debugDOM');
        const logCountSpan = document.getElementById('logCount');

        let logs = [];
        let logFilter = '';

        function log(msg, type = 'info', data = null) {
            const entry = {
                id: Date.now() + Math.random(),
                time: new Date(),
                type,
                message: msg,
                data
            };

            logs.push(entry);
            if (logs.length > 500) logs.shift();

            renderLogs();
            updateStats();

            console.log(`[${type}] ${msg}`, data || '');
        }
        // Даёт отдельным ES-модулям (view.js, paginator.js и т.п.) писать в
        // ту же систему логов/debug.log, что и сам reader.html - иначе их
        // console.log никогда не попадёт в панель отладки/debug.log,
        // только в консоль DevTools браузера, которая обычно не открыта.
        window.__novaLog = log;

        function renderLogs() {
            if (!debugEl) return;

            const filtered = logs.filter(log => {
                if (!logFilter) return true;
                return log.message.toLowerCase().includes(logFilter) ||
                       (log.data && JSON.stringify(log.data).toLowerCase().includes(logFilter));
            });

            debugEl.innerHTML = filtered.map(log => {
                const timeStr = `${log.time.toLocaleTimeString()}.${log.time.getMilliseconds().toString().padStart(3, '0')}`;
                let dataStr = '';
                if (log.data) {
                    dataStr = ` <span style="color: #ffb86b">${JSON.stringify(log.data)}</span>`;
                }

                let color = '#0f0';
                if (log.type === 'error') color = '#ff6b6b';
                else if (log.type === 'warn') color = '#ffb86b';
                else if (log.type === 'tts') color = '#bd93f9';
                else if (log.type === 'highlight') color = '#ff79c6';
                else if (log.type === 'settings') color = '#8be9fd';
                else if (log.type === 'nav') color = '#8be9fd';

                return `<div class="debug-line"><span class="debug-time">[${timeStr}]</span> <span style="color: ${color}">[${log.type}]</span> ${log.message}${dataStr}</div>`;
            }).join('');

            debugEl.scrollTop = debugEl.scrollHeight;
        }

        function updateStats() {
            if (logCountSpan) {
                logCountSpan.textContent = logs.length;
            }

            // Обновляем вкладку подсветки
            if (highlightDebugEl) {
                highlightDebugEl.innerHTML = `
                    <div style="padding: 12px;">
                        <h4> Статус</h4>
                        <p>Книга готова: ${bookReady ? '' : ''}</p>
                        <p>Overlayer готов: ${overlayer ? '' : ''}</p>
                        <p>Активная подсветка: ${currentTTSHighlightId ? currentTTSHighlightId : 'нет'}</p>
                        <hr>
                        <h4> Текущее предложение</h4>
                        <p>Индекс: ${ttsSentenceIndex + 1}/${ttsSentences.length}</p>
                        <p>Текст: ${ttsSentences[ttsSentenceIndex] ? ttsSentences[ttsSentenceIndex].text.substring(0, 60) + '...' : 'нет'}</p>
                    </div>
                `;
            }

            // Обновляем вкладку DOM
            if (domDebugEl && view?.renderer) {
                try {
                    const contents = view.renderer.getContents();
                    if (contents?.length) {
                        const doc = contents[0].doc;
                        const highlights = doc.querySelectorAll('.tts-highlight');

                        domDebugEl.innerHTML = `
                            <div style="padding: 12px;">
                                <h4> Информация о DOM</h4>
                                <p>Секция: ${currentSection + 1}</p>
                                <p>Элементов подсветки в DOM: ${highlights.length}</p>
                                <p>Классы: ${Array.from(highlights).map(el => el.className).join(', ') || 'нет'}</p>
                            </div>
                        `;
                    }
                } catch(e) {
                    domDebugEl.innerHTML = `<div style="padding:12px;color:#ff6b6b;">Ошибка получения DOM: ${e.message}</div>`;
                }
            }
        }

        // Фильтр логов
        document.getElementById('debugFilter')?.addEventListener('input', (e) => {
            logFilter = e.target.value.toLowerCase();
            renderLogs();
        });

        // Переключение вкладок
        document.querySelectorAll('.debug-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.debug-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.debug-content').forEach(c => c.classList.remove('active'));

                tab.classList.add('active');
                const contentId = tab.dataset.tab;
                if (contentId === 'logs') document.getElementById('debugLogs').classList.add('active');
                else if (contentId === 'highlight') document.getElementById('debugHighlight').classList.add('active');
                else if (contentId === 'dom') document.getElementById('debugDOM').classList.add('active');
            });
        });

        function safeAddListener(id, event, handler) {
            const el = document.getElementById(id);
            if (el) el.addEventListener(event, handler);
            else log(` Элемент #${id} не найден`, 'warn');
        }

        // ==================== ПРОВЕРКА, ЧТО ВЫДЕЛЕНИЕ В КНИГЕ ====================
        function isSelectionInBook() {
            const selection = window.getSelection();
            if (!selection.rangeCount) return false;

            const range = selection.getRangeAt(0);
            if (!range) return false;

            const container = document.getElementById('viewer-container');
            let node = range.startContainer;

            while (node) {
                if (node === container) return true;
                if (node === document.body) break;
                node = node.parentNode;
            }

            return false;
        }

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        async function init() {
            log(' Запуск NovaReader...');

            view = document.getElementById('viewer');
            if (!view) {
                log(' Элемент viewer не найден', 'error');
                return;
            }

            // Клик по viewer — возвращаем фокус в iframe
            view.addEventListener('click', () => {
                try {
                    const contents = view.renderer?.getContents?.();
                    const doc = contents?.[0]?.doc;
                    if (doc) doc.defaultView?.focus();
                } catch(e) {}
            });

            // create-overlay срабатывает когда view.js создал и прикрепил Overlayer к новой секции.
            // НЕ создаём свой Overlayer вручную — он уже есть в getContents()[0].overlayer
            // Слушаем relocate от renderer (paginator) напрямую — там index надёжный
            // Сообщаем Python при движении мыши — для сброса таймера скрытия курсора
            document.addEventListener('mousemove', () => {
                if (bridge?.onMouseMove) bridge.onMouseMove();
            }, { passive: true });
            // Также слушаем движение внутри iframe через relocate
            view.addEventListener('load', ({ detail: { doc } }) => {
                doc.addEventListener('mousemove', () => {
                    if (bridge?.onMouseMove) bridge.onMouseMove();
                }, { passive: true });

                // Клавиатурная навигация — вешаем на doc iframe, т.к. фокус там
                doc.addEventListener('keydown', (e) => {
                    if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
                    if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                        e.preventDefault();
                        view?.next(); setTimeout(() => loadHighlights(), 300);
                    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                        e.preventDefault();
                        view?.prev(); setTimeout(() => loadHighlights(), 300);
                    } else if (e.key === 'F1') {
                        e.preventDefault();
                        window.showKeyboardShortcutsHelp?.();
                    } else if (e.ctrlKey && e.key === 'f') {
                        e.preventDefault();
                        const tocPanel = document.getElementById('tocPanel');
                        const searchInput = document.getElementById('bookSearchInput');
                        if (tocPanel && searchInput) {
                            tocPanel.classList.add('visible');
                            document.getElementById('overlay')?.classList.add('visible');
                            switchTocTab('search');
                            searchInput.focus();
                            searchInput.select();
                        }
                    } else if (e.ctrlKey && e.key === 't') {
                        e.preventDefault();
                        toggleToc();
                    } else if (e.ctrlKey && e.key === 'd') {
                        e.preventDefault();
                        const tocPanel = document.getElementById('tocPanel');
                        const bookmarksPanel = document.getElementById('bookmarksPanel');
                        const overlay = document.getElementById('overlay');
                        if (tocPanel?.classList.contains('visible')) tocPanel.classList.remove('visible');
                        const willOpen = !bookmarksPanel?.classList.contains('visible');
                        bookmarksPanel?.classList.toggle('visible');
                        overlay?.classList.toggle('visible');
                        if (!willOpen) overlay?.classList.remove('visible');
                    } else if (e.key === ' ' && !e.ctrlKey && !e.altKey && !e.metaKey) {
                        e.preventDefault();
                        if (ttsActive) { if (ttsPaused) resumeTTS(); else pauseTTS(); } else startTTS();
                    } else if (e.ctrlKey && e.key === '.') {
                        e.preventDefault();
                        stopTTSFull();
                    } else if (e.key === 'F11') {
                        e.preventDefault();
                        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                        else document.exitFullscreen();
                    }
                });

                // Принудительно фокусируем iframe чтобы keydown доходил до doc
                try { doc.defaultView?.focus(); } catch(e) {}

                // При load секции — узнаём индекс из getContents()
                try {
                    const contents = view.renderer?.getContents?.();
                    if (contents?.length > 0 && contents[0].index !== undefined) {
                        currentSection = contents[0].index;
                        log(` Секция загружена: ${currentSection}`, 'nav');
                    }
                } catch(e) {}
                // Скрываем рекламные секции (Nota bene, реклама пиратских сайтов)
                try { hideAdSections(doc); } catch(e) {}
                try { hideFakeTOCLists(doc); } catch(e) {}
            });

            view.addEventListener('create-overlay', () => {
                try {
                    const contents = view.renderer?.getContents();
                    if (contents && contents.length > 0 && contents[0].overlayer) {
                        overlayer = contents[0].overlayer;
                        log(' Overlayer получен для новой секции');
                    } else {
                        log(' Overlayer не найден в новой секции', 'warn');
                        overlayer = null;
                    }

                    // Если есть отложенный TTS, запускаем его
                    if (pendingTTSStart && bookReady) {
                        log(' Запускаем отложенный TTS', 'tts');
                        pendingTTSStart = null;
                        setTimeout(() => startTTS(), 100);
                    }

                    updateStats();
                } catch(err) {
                    log(` Ошибка получения Overlayer: ${err.message}`, 'error');
                }
            });

            // При загрузке каждой секции (новый iframe) — применяем тему
            // Сообщаем Python при движении мыши — для сброса таймера скрытия курсора
            document.addEventListener('mousemove', () => {
                if (bridge?.onMouseMove) bridge.onMouseMove();
            }, { passive: true });
            // Также слушаем движение внутри iframe через relocate
            view.addEventListener('load', ({ detail: { doc } }) => {
                doc.addEventListener('mousemove', () => {
                    if (bridge?.onMouseMove) bridge.onMouseMove();
                }, { passive: true });
                                // Каждая секция рендерится в НОВОМ iframe со своим document —
                // document.fonts главной страницы туда не «протекает». Поэтому
                // при каждой загрузке секции регистрируем в iframe.document.fonts
                // те же FontFace, что уже загружены на главной странице (fonts.js
                // кеширует сами ArrayBuffer через объекты FontFace — здесь только
                // копируем ссылки, повторной загрузки файла с диска не происходит).
                try { window.__registerFontsInDoc?.(doc); } catch(e) {}
                // Повторно применяем стили т.к. новый iframe = чистый document
                setTimeout(() => applyTheme(), 0);
                if (!doc) return;

                // ── Снятие инлайн-стилей font-family/color/background ────────
                // Инлайн `style="font-family: X !important"` НЕ перебивается CSS
                // в принципе — по спецификации CSS Cascade (Level 4, §6.4.4)
                // инлайн-!important имеет приоритет над любым <style>-!important,
                // даже если у нас селектор html html html ... body * !important.
                // Поэтому принудительно чистим инлайн-стили, которые мешают
                // теме читалки (наш шрифт, наш цвет, наш фон) — после чего
                // правило из getThemeCSS() вступит в силу.
                try {
                    if (themeSettings.fontFamily) {
                        const styled = doc.querySelectorAll('[style]');
                        for (const el of styled) {
                            if (el.closest('#nova-end-of-book')) continue;
                            const s = el.style;
                            if (s.fontFamily)     s.removeProperty('font-family');
                            if (s.color)          s.removeProperty('color');
                            if (s.backgroundColor) s.removeProperty('background-color');
                            if (s.backgroundImage) s.removeProperty('background-image');
                        }
                    }
                } catch (e) { /* не критично */ }
                // Инжектируем серый ::selection в iframe
                try {
                    const style = doc.createElement('style');
                    style.textContent = '::selection { background: rgba(140,140,140,0.35) !important; color: inherit !important; }';
                    (doc.head || doc.documentElement).appendChild(style);
                } catch(e) {}

                doc.addEventListener('click', (ev) => {
                    // Клик по уже выделенному тексту — показываем тулбар снова
                    if (!ev.target.closest('#selectionToolbar')) {
                        setTimeout(() => {
                            try {
                                const sel = doc.getSelection();
                                const text = sel?.toString().trim();
                                if (text && text.length > 1) {
                                    document.getElementById('selectionToolbar').classList.add('visible');
                                } else {
                                    document.getElementById('selectionToolbar').classList.remove('visible');
                                }
                            } catch(e) {}
                        }, 50);
                    }
                });

                doc.addEventListener('pointerup', () => {
                    setTimeout(() => {
                        try {
                            const sel = doc.getSelection();
                            const text = sel?.toString().trim();
                            if (text && text.length > 1 && sel.rangeCount > 0) {
                                currentSelection = text;
                                currentRange = sel.getRangeAt(0);
                                currentRangeDoc = doc;   // запоминаем doc

                                // getBoundingClientRect() внутри iframe возвращает
                                // координаты в системе iframe (НЕ главного окна).
                                // При листании страниц (paginator scrolls #container)
                                // iframe съезжает влево — нужно добавить offset от
                                // frameElement.getBoundingClientRect() (в системе parent).
                                const selRect = currentRange.getBoundingClientRect();
                                const frameEl = doc.defaultView?.frameElement;
                                const frameRect = frameEl
                                    ? frameEl.getBoundingClientRect()
                                    : { left: 0, top: 0 };

                                const mainLeft = frameRect.left + selRect.left + selRect.width / 2;
                                const mainTop  = frameRect.top  + selRect.top;

                                const toolbar = document.getElementById('selectionToolbar');
                                
                                // Проверяем границы экрана
                                const toolbarHeight = 50; // примерная высота тулбара
                                const gap = 10;
                                
                                // Если выделение слишком высоко (менее 60px от верха), открываем ПОД выделением
                                if (mainTop < 60) {
                                    toolbar.style.transform = 'translate(-50%, 0)';
                                    toolbar.style.marginTop = '0px';
                                    toolbar.style.top = (mainTop + gap) + 'px';
                                } else {
                                    // Открываем НАД выделением (по умолчанию)
                                    toolbar.style.transform = 'translate(-50%, -100%)';
                                    toolbar.style.marginTop = '-8px';
                                    toolbar.style.top = mainTop + 'px';
                                }
                                
                                // Сначала выставляем left по центру выделения,
                                // потом зажимаем чтобы тулбар не вылетал за края экрана.
                                toolbar.style.left = mainLeft + 'px';
                                toolbar.classList.add('visible');

                                // Корректируем left после того как тулбар стал visible и получил реальную ширину
                                requestAnimationFrame(() => {
                                    const tbRect = toolbar.getBoundingClientRect();
                                    const margin = 8; // отступ от края экрана
                                    const vw = window.innerWidth;
                                    let left = mainLeft;
                                    // Правый край вылетает
                                    if (left + tbRect.width / 2 > vw - margin) {
                                        left = vw - margin - tbRect.width / 2;
                                    }
                                    // Левый край вылетает
                                    if (left - tbRect.width / 2 < margin) {
                                        left = margin + tbRect.width / 2;
                                    }
                                    toolbar.style.left = left + 'px';
                                });

                                // Обновляем иконку кнопки подсветки
                                updateHighlightButtonIcon(currentSelection);
                            } else {
                                document.getElementById('selectionToolbar').classList.remove('visible');
                                document.getElementById('miniPalette').classList.remove('visible');
                            }
                        } catch(e) {}
                    }, 50);
                });
                
                // Клик по изображению для открытия комикса в полном экране
                doc.addEventListener('click', (e) => {
                    if (e.target.tagName === 'IMG' && window.currentBookData?.type === 'cbz') {
                        const src = e.target.src;
                        if (src && (src.startsWith('blob:') || src.startsWith('data:'))) {
                            if (window._openComicViewer) {
                                window._openComicViewer(src);
                                log(' Комикс: открыт просмотр', 'info');
                            }
                        }
                    }
                });
                doc.addEventListener('pointerdown', (e) => {
                    // Не скрываем тулбар сразу — даём pointerup решить.
                    // Если пользователь кликнул по уже выделенному тексту,
                    // pointerup снова покажет тулбар. Скрываем только если
                    // клик был вне тулбара (обрабатывается глобально ниже).
                    document.getElementById('miniPalette').classList.remove('visible');
                });
                
                // Обработка кликов по сноскам
                doc.addEventListener('click', (e) => {
                    const a = e.target.closest('a[href]');
                    if (!a || !window.footnoteHandler) return;
                    try {
                        const href = a.getAttribute('href');
                        if (href) {
                            window.footnoteHandler.handle(book, {
                                detail: { a, href },
                                preventDefault: () => e.preventDefault()
                            });
                        }
                    } catch(err) {
                        log(' Сноска: ' + err.message, 'warn');
                    }
                }, true);
            });

            // Слушаем перемещение по книге (смена секции И перелистывание страниц)
            // ВАЖНО: foliate-js отдаёт индекс секции в e.detail.section.current,
            // НЕ в e.detail.index (e.detail.index не существует в foliate-js)
            view.addEventListener('relocate', (e) => {
                // Показываем кнопку "Вернуться" если TTS был активен
                // и мы перешли в другое место
                const returnBtn = document.getElementById('returnToReadingBtn');
                // Показываем кнопку только если:
                // 1. Есть сохранённая позиция TTS
                // 2. Пользователь листнул вручную (не TTS)
                // 3. Листание в той же главе (между главами не восстанавливаем)
                if (lastTtsCfi && !ttsPageTurning && !ttsStarting) {
                    const curSection = view.renderer.getContents?.()?.[0]?.index ?? -1;
                    if (lastTtsSectionIndex >= 0 && curSection !== lastTtsSectionIndex) {
                        // Другая глава — сбрасываем всё
                        if (returnBtn) returnBtn.style.display = 'none';
                        lastTtsCfi = null;
                        lastTtsRange = null;
                        lastTtsSentenceText = null;
                        lastTtsSectionIndex = -1;
                        ttsUserNavigated = false;
                    } else {
                        // Та же глава — фиксируем ручную навигацию и показываем кнопку
                        ttsUserNavigated = true;
                        if (returnBtn) returnBtn.style.display = '';
                    }
                }

                // Сохраняем Range видимой области — используется при старте TTS.
                if (e.detail?.range) {
                    lastRelocateRange = e.detail.range;
                    // Отладка: логируем что именно содержит relocate range
                    try {
                        const r = e.detail.range;
                        const rect = r.getBoundingClientRect?.();
                        log(`[relocate] range start: "${r.startContainer?.textContent?.trim().substring(0,30)}"` +
                            ` rect.left=${Math.round(rect?.left)} rect.top=${Math.round(rect?.top)}` +
                            ` renderer.start=${Math.round(view?.renderer?.start)}` +
                            ` renderer.size=${Math.round(view?.renderer?.size)}`, 'nav');
                    } catch(e2) {}
                }

                // Получаем индекс секции из правильного поля
                const sectionIdx = e.detail?.section?.current;
                const prevSection = currentSection;

                if (sectionIdx !== undefined) {
                    currentSection = sectionIdx;
                }

                // updatePageInfo вызываем на КАЖДЫЙ relocate (смена секции И перелистывание)
                updatePageInfo();

                if (sectionIdx !== undefined && sectionIdx !== prevSection) {
                    // Смена секции — доп. обновления
                    if (bridge?.onSectionChanged) {
                        bridge.onSectionChanged(currentSection);
                    }

                    // Обновляем ссылку на overlayer
                    try {
                        const contents = view.renderer?.getContents();
                        if (contents && contents.length > 0 && contents[0].overlayer) {
                            overlayer = contents[0].overlayer;
                        }
                    } catch(err) {}

                    updateBookmarkButton();
                    updateStats();

                    // Применяем подсветки для новой секции
                    if (window.savedHighlights) {
                        applyHighlightsForCurrentSection();
                    }
                }
                // Сохраняем на каждый relocate (включая смен страницы внутри секции)
                autoSavePosition();
                // Подсветка текущего пункта оглавления — тоже на каждый
                // relocate, а не только при ручном вызове из tocNavigate().
                // lastLocation.tocItem к этому моменту уже гарантированно
                // актуален (view.js выставляет его синхронно ДО отправки
                // самого события relocate), так что тут нет гонки со
                // временем, в отличие от вызова с setTimeout из
                // конкретного места навигации. Это же чинит подсветку и
                // для остальных способов навигации (поиск, TTS, кнопки
                // назад/вперёд), не только для клика по оглавлению.
                try { highlightCurrentTocItem(); } catch(e) {}
            });

            // Подключаем WebChannel
            try {
                if (typeof QWebChannel !== 'undefined') {
                    new QWebChannel(qt.webChannelTransport, (channel) => {
                        bridge = channel.objects.readerBridge;
                        log(' WebChannel подключен');

                        if (bridge) {
                            bridge.getBookData((data) => {
                                if (data) {
                                    try {
                                        const parsed = JSON.parse(data);
                                        data = null;  // освобождаем строку до loadBook
                                        loadBook(parsed);
                                    } catch(e) {
                                        log(` Ошибка парсинга книги: ${e.message}`, 'error');
                                    }
                                }
                            });

                            bridge.getTheme((theme) => {
                                try {
                                    const t = JSON.parse(theme);
                                    document.documentElement.style.setProperty('--bg-color', t.bg);
                                    document.documentElement.style.setProperty('--text-color', t.text);
                                } catch(e) {}
                            });

                            // Язык интерфейса — используется в log-сообщениях TTS
                            if (bridge.getLanguage) {
                                bridge.getLanguage((lang) => {
                                    window.setReaderLanguage(lang || 'ru');
                                });
                            }

                            loadTTSSettings();
                            checkPiperVoices();
                            detectSystemEngines();
                        }
                    });
                }
            } catch(e) {
                log(' Ошибка WebChannel: ' + e.message, 'error');
            }

            initUI();
            initSelectionHandlers();
        }

        // ==================== FB2: вспомогательные функции ====================

        // Показывает спиннер поверх экрана ДО парсинга FB2 — устраняет белый экран
        function showFB2LoadingBanner(bookName) {
            // Скрываем статический экран загрузки
            const s = document.getElementById('staticLoadingScreen');
            if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 350); }

            document.getElementById('fb2LoadingBanner')?.remove();
            const d = document.createElement('div');
            d.id = 'fb2LoadingBanner';
            d.style.cssText = [
                'position:fixed;inset:0;z-index:9000;',
                'background:var(--bg-color,#f4ecd8);',
                'display:flex;flex-direction:column;align-items:center;',
                'justify-content:center;gap:16px;',
            ].join('');
            const displayName = bookName.replace(/\.fb2$/i, '');
            d.innerHTML = `
                <div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#aaa;">ЗАГРУЗКА</div>
                <div style="font-size:22px;font-weight:600;max-width:560px;text-align:center;line-height:1.4;">${displayName}</div>
                <div style="width:40px;height:40px;border:3px solid rgba(0,0,0,.12);
                     border-top-color:var(--spinner-color, var(--text-color, #5A4FCF));border-radius:50%;
                     animation:spin 0.8s linear infinite;"></div>
                <div style="font-size:13px;color:#888;">Разбираем главы…</div>`;

        // Плавно скрывает баннер загрузки FB2
        function hideFB2LoadingBanner() {
            const d = document.getElementById('fb2LoadingBanner');
            if (!d) return;
            d.style.transition = 'opacity 0.3s ease';
            d.style.opacity = '0';
            setTimeout(() => d.remove(), 350);
        }

        // ==================== ЗАГРУЗКА КНИГИ ====================
        async function loadBook(bookData) {
            // currentBookData не сохраняем — освобождаем после loadBook
            try {
                log(` Загрузка: ${bookData.name}`);

                // Устанавливаем путь к текущей книге
                currentBookPath = bookData.path || null;

                // ── FB2: показываем спиннер ДО парсинга ──────────────────────
                // Белый экран возникал потому что парсинг 15 МБ XML полностью
                // блокирует JS на 3–10 с. Теперь пользователь видит спиннер,
                // а не пустой экран.
                if (bookData.type === 'fb2') showFB2LoadingBanner(bookData.name);
                else showFB2LoadingBanner(bookData.name); // EPUB тоже показываем баннер

                // ── Создаём File-объект через fetch(file://) ─────────────────
                // --disable-web-security + --allow-file-access-from-files позволяют
                // читать локальные файлы напрямую без base64-кодирования.
                // Выигрыш по памяти для 15 МБ книги:
                //   base64: Python(20МБ) + JS-строка(20МБ) + Uint8Array(15МБ) = ~55МБ пиковых
                //   fetch:  ArrayBuffer(15МБ) = ~15МБ пиковых
                const mimeTypes = {
                    epub: 'application/epub+zip',
                    fb2:  'application/x-fictionbook+xml',
                    cbz:  'application/vnd.comicbook+zip',
                    pdf:  'application/pdf',
                    mobi: 'application/x-mobipocket-ebook',
                    azw3: 'application/x-mobipocket-ebook',
                };
                const mime = mimeTypes[bookData.type] || 'application/octet-stream';

                let file;
                if (bookData.file_url) {
                    // Основной путь: прямое чтение с диска
                    log(` Прямая загрузка: ${bookData.file_url}`);
                    const resp = await fetch(bookData.file_url);
                    if (!resp.ok) throw new Error(`fetch failed: ${resp.status} ${resp.statusText}`);
                    const arrayBuffer = await resp.arrayBuffer();
                    file = new File([arrayBuffer], bookData.name, { type: mime });
                } else if (bookData.content) {
                    // Запасной путь: base64 (на случай регресса)
                    log(' Fallback: base64 decode (file_url отсутствует)');
                    const binary = atob(bookData.content);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    file = new File([bytes], bookData.name, { type: mime });
                } else {
                    throw new Error('Нет данных книги: ни file_url, ни content');
                }

                // Уничтожаем предыдущую книгу перед созданием новой.
                // book.destroy() отзывает все активные Blob URL — без этого вызова
                // они остаются в памяти при каждом открытии новой книги (утечка).
                if (book && typeof book.destroy === 'function') {
                    try { book.destroy() } catch(e) {}
                    book = null
                }

                book = await makeBook(file);
                window._currentBook = book;  // для destroy() при смене книги
                // Парсинг завершён — скрываем баннер
                hideFB2LoadingBanner();
                log(` Книга создана (${book.sections?.length || 0} секций)`);
                
                // Проверка для PDF
                if (bookData.type === 'pdf') {
                    log(` PDF: ${book.sections?.length || 0} страниц`, 'info');
                    if (!book.sections || book.sections.length === 0) {
                        log(' PDF: Нет страниц!', 'error');
                    }
                    if (!book.rendition) {
                        log(' PDF: Нет rendition, устанавливаем pre-paginated', 'warn');
                        book.rendition = { layout: 'pre-paginated' };
                    }
                }

                // Метаданные
                if (book.metadata) {
                    const title = book.metadata.title || bookData.name;
                    document.getElementById('bookTitle').textContent = title;
                    let authorText = '';
                    const author = book.metadata.author;
                    if (typeof author === 'string') authorText = author;
                    else if (Array.isArray(author)) authorText = author.map(a => a?.name || a).join(', ');
                    else if (author?.name) authorText = author.name;
                    document.getElementById('bookAuthor').textContent = authorText;
                    
                    // Показываем информацию в панели оглавления
                    showBookInfoInPanel(title, authorText, bookData.type);
                }

                // Загружаем настройки из Python/config
                if (bridge) {
                    bridge.getSettings(s => {
                        try { applyAllSettings(JSON.parse(s)); } catch(e) {}
                    });
                }

                await view.open(book);
                log(' Книга открыта');

                // Инициализируем обработчик сносок
                let footnoteHandler = null;
                try {
                    const { FootnoteHandler } = await import('./footnotes.js');
                    footnoteHandler = new FootnoteHandler();
                    footnoteHandler.addEventListener('render', (e) => {
                        const { view: fnView } = e.detail;
                        showFootnote(fnView);
                    });
                    log(' FootnoteHandler инициализирован', 'footnote');
                } catch(e) {
                    log(' FootnoteHandler: ' + e.message, 'warn');
                }
                window.footnoteHandler = footnoteHandler;

                if (view.renderer) {
                    view.renderer.setAttribute('spread', 'auto');

                    // 1. Прменяем стили ДО init() — так setStyles сохраняет CSS
                    //    и paginator применит его при загрузке первой секции.
                    //    Порядок: setStyles → section load → fonts.ready → expand()
                    //    → scrollToAnchor(#anchor). Якорь из init() не потеряется.
                    applyTheme();

                    // 2. Загружаем настройки (async, применятся поверх дефолтной темы)
                    if (bridge) {
                        bridge.getSettings(s => {
                            try { applyAllSettings(JSON.parse(s)); } catch(e) {}
                        });
                    }

                    // 3. Получаем схранённую позицию
                    let lastLocation = null;
                    if (bridge) {
                        const posJson = await new Promise(r => bridge.getPosition(r));
                        try {
                            const saved = JSON.parse(posJson);
                            const pos = saved?.position;
                            if (pos?.cfi) lastLocation = pos.cfi;
                            else if (pos?.section > 0) lastLocation = pos.section;
                        } catch(e) {}
                    }

                    const bookTitle = document.getElementById('bookTitle').textContent || '';
                    const bookAuthor = document.getElementById('bookAuthor').textContent || '';

                    if (lastLocation) {
                        // ── ПОВТОРНОЕ ОТКРЫТИЕ ──
                        // Показываем тайтл-оверлей, пока view.init() загружает секцию.
                        // view.init({ lastLocation }) устанавливает #anchor в пагинаторе
                        // ДО загрузки шрифтов, поэтому fonts.ready → expand() корректно
                        // восстанавливает позицию даже после перекладки.
                        log(` осстановление позиции: ${JSON.stringify(lastLocation).substring(0, 60)}`, 'nav');
                        showReturnOverlay(bookTitle, bookAuthor);
                        await view.init({ lastLocation });
                        // Пауза — даём пользователю увидеть тайтл ~400мс
                        await new Promise(r => setTimeout(r, 400));
                        dismissReturnOverlay();
                        log(' Позиция восстановлена', 'nav');
                    } else {
                        // ── ПЕРВОЕ ОТКРЫТИЕ ──
                        // Показываем обложку с кнопкой "Читать".
                        // Кнопка запускает view.init({}) → загружает секцию 0.
                        showFirstOpenScreen(bookTitle, bookAuthor, book);
                    }

                    // 4. Книга готова — запускаем логику, зависящую от bookReady
                    bookReady = true;
                    log(' Книга полностью загружена и готова');
                    // Убираем статический экран загрузки если ещё виден
                    const s = document.getElementById('staticLoadingScreen');
                    if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 350); }
                    // Плавно показываем интерфейс через CSS transition
                    requestAnimationFrame(() => {
                        document.getElementById('app')?.classList.add('ready');
                    });
                    // Сообщаем Python что можно показывать виджет
                    try { bridge?.onBookReady?.(); } catch(e) {}
                    // Очищаем рендер-кэши после полной загрузки книги.
                    // Задержка 3.5с — движок должен завершить все layout-проходы
                    // прежде чем мы сбросим временные буферы.
                    setTimeout(() => {
                        try {
                            // Отзываем все blob: URL кроме аудио (TTS использует их активно)
                            if (window._blobUrls && window._blobUrls.length) {
                                window._blobUrls.forEach(u => {
                                    if (!u.startsWith('blob:') || u.includes('audio')) return;
                                    try { URL.revokeObjectURL(u); } catch(_) {}
                                });
                                window._blobUrls = [];
                            }
                            // Подсказываем V8 что сейчас хорошее время для GC
                            if (typeof window.gc === 'function') window.gc();
                            log('[Memory] JS cleanup: blob URLs revoked, GC hint sent', 'info');
                        } catch(e) {
                            log('[Memory] JS cleanup error: ' + e, 'warn');
                        }
                    }, 3500);
                    // Сбрасываем индекс при новой книге
                    searchIndex = null;
                    searchIndexBuilding = false;
                    lastTtsCfi = null;
                    lastTtsRange = null;
                    lastTtsSentenceText = null;
                    lastTtsSectionIndex = -1;
                    ttsUserNavigated = false;
                    document.getElementById('returnToReadingBtn').style.display = 'none';
                    // Запускаем фоновую индексацию через 3с чтобы не мешать загрузке
                    if (shouldBuildIndex()) {
                        log('[Search] Большая книга — запускаем индексацию в фоне...', 'info');
                        setTimeout(() => buildSearchIndexBackground().catch(() => {}), 3000);
                    }
                    updateStats();
                    loadBookmarks();
                    loadHighlights(); // Загружаем и применяем сохранённые подсветки
                }

                if (book.toc) renderToc(book.toc);

            } catch(e) {
                // КРИТИЧНО: всегда скрываем баннер даже при ошибке —
                // иначе спиннер зависает навсегда и приложение кажется замёрзшим.
                hideFB2LoadingBanner();
                log(' Ошибка загрузки: ' + (e?.message ?? String(e)), 'error');
                console.error('[loadBook] ошибка:', e);
            }
        }

        // ── ОВЕРЛЕЙ ДЛЯ ПОВТОРНОГО ОТКРЫТИЯ ──
        // Показывается поверх книги пока view.init() грузит секцию,
        // затем плавно исчезает (~400мс). Пользователь видит название
        // книги на долю секунды, потом появляется нужная страница.

        function showReturnOverlay(title, author) {
            document.getElementById('coverScreenEl')?.remove();
            const div = document.createElement('div');
            div.id = 'coverScreenEl';
            div.style.cssText = [
                'position:fixed;inset:0;z-index:5000;',
                'background:var(--bg-color,#f4ecd8);',
                'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;',
                'transition:opacity 0.3s ease;',
            ].join('');
            div.innerHTML = `
                <div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#aaa;">ЗАГРУЗКА</div>
                <div style="font-size:26px;font-weight:bold;text-align:center;max-width:560px;line-height:1.35;">${title}</div>
                ${author ? `<div style="font-size:16px;color:#888;">${author}</div>` : ''}
