                <div style="width:48px;height:2px;background:var(--spinner-color, var(--text-color, #5A4FCF));margin-top:4px;"></div>
            `;
            document.getElementById('app').appendChild(div);
        }

        function dismissReturnOverlay() {
            const el = document.getElementById('coverScreenEl');
            if (!el) return;
            el.style.opacity = '0';
            setTimeout(() => el.remove(), 320);
        }

        // ── ЭКРАН ПЕРВОГО ОТКРЫТИЯ ──
        // Показывает обложку или тайтл с кнопкой "Читать".
        // При нажатии кнопки запускает view.init({}) — загружает первую секцию.

        async function showFirstOpenScreen(title, author, bookObj) {
            // Пробуем получить обложку EPUB
            if (bookObj?.getCover) {
                try {
                    const blob = await bookObj.getCover();
                    if (blob?.size > 0) {
                        const url = URL.createObjectURL(blob);
                        showCoverScreen(url, title, author, async () => {
                            URL.revokeObjectURL(url);
                            await view.init({});
                        });
                        return;
                    }
                } catch(e) {}
            }
            // Тайтл-экран для FB2 и EPUB без обложки
            showTitleScreen(title, author, async () => {
                await view.init({});
            });
        }

        function showCoverScreen(imgUrl, title, author, onRead) {
            // Удаляем старый экран если есть
            document.getElementById('coverScreenEl')?.remove();
            const div = document.createElement('div');
            div.id = 'coverScreenEl';
            div.style.cssText = 'position:fixed;inset:0;background:var(--bg-color,#f4ecd8);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5000;gap:16px;';
            div.innerHTML = `
                <img src="${imgUrl}" style="max-height:65vh;max-width:70vw;object-fit:contain;box-shadow:0 8px 32px rgba(0,0,0,0.25);border-radius:4px;">
                <div style="font-size:20px;font-weight:bold;text-align:center;max-width:500px;">${title}</div>
                ${author ? `<div style="font-size:14px;color:#888;">${author}</div>` : ''}
                <button style="margin-top:8px;padding:10px 28px;background:var(--spinner-color, var(--text-color, #5A4FCF));color:white;border:none;border-radius:8px;font-size:15px;cursor:pointer;">Читать</button>
            `;
            div.querySelector('button').onclick = () => { div.remove(); onRead(); };
            document.getElementById('app').appendChild(div);
        }

        function showTitleScreen(title, author, onRead) {
            document.getElementById('coverScreenEl')?.remove();
            const div = document.createElement('div');
            div.id = 'coverScreenEl';
            div.style.cssText = 'position:fixed;inset:0;background:var(--bg-color,#f4ecd8);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5000;gap:16px;';
            div.innerHTML = `
                <div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#aaa;margin-bottom:8px;">E-BOOK</div>
                <div style="font-size:32px;font-weight:bold;text-align:center;max-width:600px;line-height:1.3;">${title}</div>
                ${author ? `<div style="font-size:18px;color:#888;margin-top:4px;">${author}</div>` : ''}
                <div style="width:60px;height:2px;background:var(--spinner-color, var(--text-color, #5A4FCF));margin:8px 0;"></div>
                <button style="margin-top:8px;padding:10px 28px;background:var(--spinner-color, var(--text-color, #5A4FCF));color:white;border:none;border-radius:8px;font-size:15px;cursor:pointer;">Читать</button>
            `;
            div.querySelector('button').onclick = () => { div.remove(); onRead(); };
            document.getElementById('app').appendChild(div);
        }

        // ── НАСТРОЙКИ ──

        // ── КЛЮЧЕВОЕ ОТКРЫТИЕ ──
        // Foliate-js рендерит каждую секцию в <iframe> с изолированным document.
        // CSS переменные главной страницы НЕВИДИМЫ внутри iframe.
        // Единственный правильный способ применить тему — через
        // renderer.setStyles(cssString), который инжектирует <style> в <head> iframe.
        //
        // Именно так делает официальный foliate-js reader.js:
        //   this.view.renderer.setStyles(getCSS(this.style))
        //
        // Фоновый цвет частично работал случайно: paginator.js читает
        // getBackground(doc) из самого документа EPUB и применяет его к
        // #background div снаружи iframe — но это не цвет из наших настроек.

        // Текущие настройки темы (хранятся здесь, применяются при каждой загрузке секции)
        let themeSettings = {
            fontFamily: '',
            fontWeight: 400,
            fontStyle: 'normal',
            bg: '#f4ecd8',
            text: '#5b4636',
            spinnerColor: '',  // library_accent; пусто → берём text
            fontSize: 16,
            lineHeight: 1.5,
            fontFaces: [],   // [{display_name, family, file, variable, weight, wght_min, wght_max, style}]
            fontsBaseUrl: '',  // абсолютный file:// URL папки fonts/ (для Windows)
        };

        // Генерирует CSS строку для инжекции в iframe (аналог getCSS в reader.js).
        // Реализация вынесена в theme-css.js — themeSettings передаётся явно.
        function getThemeCSS() {
            return _getThemeCSS(themeSettings);
        }

        // Скрывает рекламные секции в загруженном документе iframe.
        // Вызывается после загрузки каждой секции.
        // CSS :has() не всегда доступен в старых WebEngine — используем JS.
        function _injectEndOfBookMsg(doc) {
            _injectEndOfBookMsgImpl(doc, themeSettings?.fontFamily);
        }

        function hideAdSections(doc) {
            _hideAdSectionsImpl(doc, themeSettings?.fontFamily, log);
        }

        function hideFakeTOCLists(doc) {
            _hideFakeTOCListsImpl(doc, log);
        }

        // Применяет тему через renderer.setStyles — единственный правильный способ
        /**
         * Вычисляет относительную яркость hex-цвета (0 = чёрный, 1 = белый).
         * Использует формулу W3C WCAG 2.0.
         */
        function _bgLuminance(hex) {
            return _bgLuminanceImpl(hex);
        }

        /** Обновляет CSS-переменные цвета TTS-кнопок под текущую тему. */
        function updateTTSBtnColors() {
            const bg = themeSettings.bg || '#f4ecd8';
            const lum = _bgLuminance(bg);
            const root = document.documentElement;
            if (lum > 0.4) {
                // Светлый фон — тёмные кнопки
                root.style.setProperty('--tts-btn-color',  'rgba(60, 60, 60, 0.80)');
                root.style.setProperty('--tts-btn-hover',  'rgba(0, 0, 0, 1.0)');
                root.style.setProperty('--tts-btn-shadow', 'drop-shadow(0 1px 2px rgba(0,0,0,0.2))');
            } else {
                // Тёмный фон — светлые кнопки
                root.style.setProperty('--tts-btn-color',  'rgba(200, 200, 200, 0.85)');
                root.style.setProperty('--tts-btn-hover',  'rgba(255, 255, 255, 1.0)');
                root.style.setProperty('--tts-btn-shadow', 'drop-shadow(0 1px 3px rgba(0,0,0,0.5))');
            }
        }

        // ── Пользовательские шрифты через FontFace API (fonts.js) ──────────
        // themeSettings.fontFaces/fontsBaseUrl остаются в getThemeCSS() только
        // для обратной совместимости (getThemeCSS() их больше не использует
        // для @font-face — см. theme-css.js, где @font-face блок для этого
        // сценария больше не нужен, т.к. загрузка идёт через FontFace API).
        window.__lastFontMap = window.__lastFontMap || [];

        // Вызывается из applyAllSettings() и из applySettingFromPython()
        // при смене шрифта. Инкапсулирует передачу колбэка, который меняет
        // themeSettings.fontFamily и запускает applyTheme() — сама загрузка
        // и перепагинация с сохранением позиции происходят внутри fonts.js.
        window.__applyFontFromSettings = async function (selectedDisplayName) {
            if (!selectedDisplayName || !window.__lastFontMap?.length) return false;
            const applyCssFn = (family, weight = 400, style = 'normal') => {
                themeSettings.fontFamily = family;
                themeSettings.fontWeight = weight;
                themeSettings.fontStyle = style;
                applyTheme();
            };
            return await _applyReaderFont(
                view, window.__lastFontMap, selectedDisplayName, applyCssFn, log
            );
        };

        // Точка входа для Python (settings_window.py вызывает это напрямую
        // при смене шрифта в настройках, передавая свежий font_faces).
        window.applyReaderFont = async function (fontMapJson, selectedDisplayName) {
            try {
                const fontMap = typeof fontMapJson === 'string' ? JSON.parse(fontMapJson) : fontMapJson;
                window.__lastFontMap = fontMap;
                return await window.__applyFontFromSettings(selectedDisplayName);
            } catch (e) {
                log(' applyReaderFont: ошибка — ' + e.message, 'error');
                return false;
            }
        };

        function applyTheme() {
            if (view?.renderer?.setStyles) {
                view.renderer.setStyles(getThemeCSS());
                log(' Тема применена через renderer.setStyles', 'tts');
            }
            _splitPredictCache = new WeakMap();   // геометрия изменилась
            // Подстраховка: если шрифт/размер/интервал сменились ПОКА текущее
            // предложение уже озвучивается, его закэшированное isSplitSentence/
            // parts/breakIdx посчитаны по старой геометрии и больше не валидны —
            // сбрасываем, чтобы speakCurrentSentence() пересчитал разрез заново
            // при следующем обращении к этому же предложению (например, при
            // повторном проигрывании транша после паузы/prev).
            try {
                const s = ttsSentences?.[ttsSentenceIndex];
                if (s && s.isSplitSentence !== undefined) {
                    delete s.isSplitSentence;
                    delete s.parts;
                    delete s.partIndex;
                    log(' applyTheme: сброшен кэш разрыва текущего предложения (геометрия изменилась)', 'tts');
                }
            } catch(e) {}
            // Применяем фон к главной странице
            document.documentElement.style.setProperty('--bg-color', themeSettings.bg);
            document.documentElement.style.setProperty('--text-color', themeSettings.text);
            document.documentElement.style.background = themeSettings.bg;
            // Волчок загрузки — тот же accent, что library (или цвет текста)
            const spin = themeSettings.spinnerColor || themeSettings.text;
            document.documentElement.style.setProperty('--spinner-color', spin);
            try {
                localStorage.setItem('nr_theme_bg',   themeSettings.bg);
                localStorage.setItem('nr_theme_text', themeSettings.text);
                localStorage.setItem('nr_spinner_color', spin);
            } catch(e) {}
            updateTTSBtnColors();
        }

        function applyAllSettings(s) {
            if (!s) return;
            if (s.theme_bg)    themeSettings.bg = s.theme_bg;
            if (s.theme_text)  themeSettings.text = s.theme_text;
            // library_accent → цвет волчка (как в Library)
            if (s.library_accent) themeSettings.spinnerColor = s.library_accent;
            if (s.font_size)   themeSettings.fontSize = parseInt(s.font_size);
            if (s.line_height) themeSettings.lineHeight = parseFloat(s.line_height);
            if (s.font_faces) themeSettings.fontFaces = s.font_faces;
            if (s.fonts_base_url) themeSettings.fontsBaseUrl = s.fonts_base_url;
            // Пользовательский шрифт грузится ТОЛЬКО через FontFace API (fonts.js) —
            // themeSettings.fontFamily больше не выставляется здесь напрямую,
            // это делает applyCssFn внутри applyReaderFont() после успешной
            // загрузки нужного семейства (см. window.__applyFontFromSettings ниже).
            if (s.reader_font_family && s.font_faces) {
                window.__lastFontMap = s.font_faces;
                window.__applyFontFromSettings(s.reader_font_family);
            } else if (s.reader_font_family) {
                // Фолбэк на случай, если font_faces почему-то не пришли —
                // остаёмся на старом поведении, чтобы не остаться совсем
                // без шрифта.
                themeSettings.fontFamily = s.reader_font_family;
            }
            if (s.spread_mode && view?.renderer) view.renderer.setAttribute('spread', s.spread_mode);
            if (s.tts_word_mode !== undefined) ttsWordMode = !!s.tts_word_mode;
            if (s.page_margin !== undefined) applyPageMargin(s.page_margin);
            if (s.panel_height !== undefined) applyPanelHeight(s.panel_height);
            if (s.default_highlight_style) {
                currentStyle = s.default_highlight_style;
                log(` Стиль подсветки: ${currentStyle}`, 'settings');
            } else {
                log(` Стиль подсветки не указан, используем по умолчанию: highlight`, 'settings');
            }
            // default_highlight_color больше не используется (оставлен только для совместимости)

            // Применяем цвет TTS-подсветки — Python присылает готовую rgba() строку
            // с реальным пользовательским hex-цветом и прозрачностью.
            if (s.tts_highlight_color_rgba) {
                const parsed = parseTtsRgba(s.tts_highlight_color_rgba);
                if (parsed) {
                    applyTtsHighlightColor(parsed.color, parsed.opacity);
                    log(` TTS цвет (rgba) применён: ${parsed.color}, прозрачность ${parsed.opacity}`, 'settings');
                }
            } else if (s.tts_highlight_color) {
                // Обратная совместимость со старым форматом (имя цвета без rgba)
                ttsHighlightColorName = s.tts_highlight_color;
                const ttsColorMap = {
                    'cyan': '#00CED1',
                    'red': '#ff4444',
                    'green': '#44ff44',
                    'yellow': '#ffdd44',
                    'pink': '#ff66b3',
                    'blue': '#4488ff',
                    'violet': '#b344ff',
                };
                ttsHighlightColor = ttsColorMap[s.tts_highlight_color] || '#00CED1';
                log(` TTS цвет применён: ${s.tts_highlight_color} (${ttsHighlightColor})`, 'settings');
            } else {
                log(` TTS цвет не указан в настройках, используем по умолчанию: ${ttsHighlightColor}`, 'settings');
            }

            // Применяем TTS движок и голос из Python настроек
            // МИГРАЦИЯ: если Python вернул Edge — переключаем на Piper и сохраняем
            if (s.tts_engine) {
                const engineFromPython = s.tts_engine;
                if (engineFromPython === 'Edge') {
                    currentEngine = 'Piper';
                    currentVoice = 'ru_RU_irina_medium';
                    log(' Миграция Python config: Edge → Piper', 'tts');
                    // Сохраняем в Python чтобы при следующем запуске уже было Piper
                    if (bridge) {
                        bridge.saveSetting(JSON.stringify({ key: 'preferred_engine', value: 'Piper' }));
                        bridge.saveSetting(JSON.stringify({ key: 'tts_engine', value: 'Piper' }));
                        bridge.saveSetting(JSON.stringify({ key: 'tts_voice', value: 'ru_RU_irina_medium' }));
                        bridge.setPreferredEngine('Piper');
                        bridge.setVoice('ru_RU_irina_medium');
                    }
                } else {
                    currentEngine = engineFromPython;
                    if (s.tts_voice) currentVoice = s.tts_voice;
                }
                const engineSelect = document.getElementById('engineSelect');
                if (engineSelect) engineSelect.value = currentEngine;
                // Явно синхронизируем Python контроллер с текущим движком
                // Без этого Python может держать Edge даже если JS показывает Piper
                if (bridge) {
                    bridge.setPreferredEngine(currentEngine);
                    if (currentVoice) bridge.setVoice(currentVoice);
                }
                log(` TTS движок: ${currentEngine}`, 'settings');
            }
            if (s.tts_speed) {
                ttsSpeed = parseFloat(s.tts_speed);
                const speedSlider = document.getElementById('speedSlider');
                const speedValue = document.getElementById('speedValue');
                if (speedSlider) speedSlider.value = ttsSpeed;
                if (speedValue) speedValue.textContent = ttsSpeed + 'x';
                log(` TTS скорость: ${ttsSpeed}x`, 'settings');
            }

            applyTheme();
        }

        // Приёмник настроек от Python SettingsWindow
        window.applySettingFromPython = function(key, value) {
            switch(key) {
                case 'reader_font_family':
                    // Загрузка через FontFace API (fonts.js) — themeSettings.fontFamily
                    // выставится изнутри applyReaderFont() ПОСЛЕ успешной загрузки
                    // нужного семейства, не раньше (иначе пагинация посчитается
                    // по fallback-шрифту).
                    window.__applyFontFromSettings(value);
                    break;
                case 'font_faces':
                    themeSettings.fontFaces = value;
                    window.__lastFontMap = value;
                    break;
                case 'font_size':
                    themeSettings.fontSize = parseInt(value);
                    applyTheme();
                    break;
                case 'line_height':
                    themeSettings.lineHeight = parseFloat(value);
                    applyTheme();
                    break;
                case 'spread_mode':
                    if (view?.renderer) view.renderer.setAttribute('spread', value);
                    break;
                case 'tts_word_mode':
                    ttsWordMode = !!value;
                    log(' TTS режим подсветки: ' + (ttsWordMode ? 'слова' : 'предложения'), 'tts');
                    break;
                case 'page_margin':
                    applyPageMargin(value);
                    break;
                case 'panel_height':
                    applyPanelHeight(value);
                    break;
                case 'default_highlight_style':
                    currentStyle = value;
                    break;
                case 'default_highlight_color':
                    currentColor = value;
                    break;
                case 'tts_highlight_color_rgba':
                    // Готовая rgba() строка из Python (реальный пользовательский цвет+прозрачность)
                    {
                        const parsed = parseTtsRgba(value);
                        if (parsed) {
                            applyTtsHighlightColor(parsed.color, parsed.opacity);
                            log(` Цвет/прозрачность TTS-подсветки изменены (rgba): ${parsed.color}, ${parsed.opacity}`, 'tts');
                        }
                    }
                    break;
                case 'tts_highlight_color':
                    // Обратная совместимость со старым форматом (имя цвета)
                    ttsHighlightColorName = value;
                    // Преобразуем имя цвета в hex код
                    const ttsColorMap = {
                        'cyan': '#00CED1',
                        'red': '#f28b82',
                        'green': '#81c995',
                        'yellow': '#fdd66b',
                        'pink': '#ff8b8b',
                    };
                    applyTtsHighlightColor(ttsColorMap[value] || '#00CED1');
                    log(` Цвет TTS-подсветки изменён: ${value} (${ttsHighlightColor})`, 'tts');
                    break;
                case 'theme':
                    themeSettings.bg = value.bg;
                    themeSettings.text = value.text;
                    applyTheme();
                    break;
                case 'theme_bg':
                    themeSettings.bg = value;
                    applyTheme();
                    break;
                case 'theme_text':
                    themeSettings.text = value;
                    applyTheme();
                    break;
                case 'library_accent':
                    themeSettings.spinnerColor = value;
                    applyTheme();
                    break;
            }
        };
        window.setSpreadMode = v => view?.renderer?.setAttribute('spread', v);
        window.setPageMargin = v => applyPageMargin(v);
        window.updateHighlightStyle = v => { currentStyle = v; };
        window.updateHighlightColor = v => { currentColor = v; };

        // ══════════════════════════════════════════════════════════════
        //  ИЗВЛЕЧЕНИЕ ГЛАВ ДЛЯ АУДИОКНИГИ
        // ══════════════════════════════════════════════════════════════
        // Проходит по book.toc, для каждого пункта резолвит секцию через
        // book.resolveHref() и извлекает её текст через createDocument() —
        // это работает ОФФ-ЭКРАННО (не через видимый view.renderer), поэтому
        // никак не связано с постраничной вёрсткой/«виртуальным тире»
        // (getSplitAcrossPageInfo) — та логика только про то, как ЧИТАЕТСЯ
        // и ПОДСВЕЧИВАЕТСЯ уже отрисованный на экране текст при постраничном
        // перелистывании, а не про извлечение самого текста секции.
        // Рекламные вставки пиратских сайтов вырезаются той же функцией
        // hideAdSections(), что уже применяется к видимым секциям при чтении.
        window.extractChaptersForAudiobook = async function() {
            if (!book?.toc || !book?.sections) {
                bridge?.onChaptersExtracted?.(JSON.stringify({ error: 'no_toc' }));
                return;
            }
            try {
                // Плоский список пунктов TOC, с сохранением иерархии:
                // depth — глубина вложенности, ancestors — метки ВСЕХ
                // родительских пунктов от корня (например, ["Темные туннели",
                // "Часть первая"] для главы внутри части внутри отдельной
                // книги сборника). ancestors нужен, чтобы аудиорекордер мог
                // показать главы сгруппированными точно так же, как в
                // оглавлении самой книги (со сворачиванием), и чтобы перед
                // текстом каждой главы можно было объявить не только
                // название книги, но и то, какой книге/части она
                // принадлежит — актуально для сборников из нескольких
                // произведений, а не просто книг с частями.
                function flattenToc(items, depth = 0, ancestors = []) {
                    let out = [];
                    for (const item of items) {
                        out.push({ label: item.label, href: item.href, depth, ancestors });
                        if (item.subitems?.length) {
                            out = out.concat(flattenToc(item.subitems, depth + 1,
                                [...ancestors, item.label]));
                        }
                    }
                    return out;
                }
                const flatToc = flattenToc(filterToc(book.toc));

                // metadata.title у EPUB не всегда простая строка — если у
                // книги есть название на нескольких языках (alternate-script
                // в OPF), парсер (epub.js) возвращает "языковую карту"
                // {ru: "...", en: "..."} вместо строки. Разворачиваем её в
                // обычный текст, иначе в TTS/имя файла уходит JSON-объект.
                const langMapToText = (v) => {
                    if (!v) return '';
                    if (typeof v === 'string') return v;
                    if (typeof v === 'object') {
                        const lang = (book.metadata?.language?.[0] || '').split('-')[0];
                        for (const k of Object.keys(v)) {
                            if (k.split('-')[0].toLowerCase() === lang.toLowerCase()) return v[k];
                        }
                        const vals = Object.values(v);
                        return vals.length ? String(vals[0]) : '';
                    }
                    return String(v);
                };

                // Заголовок книги — для распознавания титульной секции (когда
                // первый пункт TOC — это просто «Название / Автор», а не
                // настоящая глава). Такую секцию не делаем отдельным
                // MP3-файлом — её текст присоединяется к первой выбранной
                // главе (см. AudioRecorderWindow._start_record).
                const bookTitleText = langMapToText(book.metadata?.title);
                const bookTitleNorm = bookTitleText.trim().toLowerCase();

                // Метки, по которым распознаём аннотацию и концевые сноски
                // (расшифровки/пояснения к сноскам в конце книги) — такие
                // главы извлекаются (пользователь видит их в списке и может
                // включить вручную), но по умолчанию НЕ отмечены галочкой.
                const RE_ANNOTATION = /^(аннотаци|annotation)/i;
                const RE_ENDNOTES = /^(примечани|сноск|коммент|note|footnote|endnote)/i;
                // Метки типовых титульных/обложечных секций EPUB/FB2 и
                // прочих форматов — распознаём титульную секцию по метке
                // TOC, а не только по совпадению текста с названием книги
                // (в EPUB метка TOC обычно "Cover"/"Title Page"/"Обложка",
                // а не сам текст названия).
                const RE_TITLEPAGE_LABEL = /^(титул|обложк|cover|title\s*page|titlepage|halftitle|frontispiece)/i;

                const chapters = [];

                // Классификация одного пункта TOC + добавление в chapters[].
                function pushChapter(item, text, sectionIndex) {
                    if (!text) return; // пустой кусок (например, титульный лист без текста)

                    const label = (item.label || '').trim();
                    const labelNorm = label.toLowerCase();
                    // Титульная секция: первый пункт TOC, текст короткий и
                    // совпадает (или почти совпадает) с названием книги —
                    // типично «Название\nАвтор» на отдельной странице.
                    const titleMatches = bookTitleNorm.length > 3 && (
                        labelNorm.includes(bookTitleNorm) ||
                        bookTitleNorm.includes(labelNorm) ||
                        text.toLowerCase().includes(bookTitleNorm)
                    );
                    const isTitlePage = chapters.length === 0 && text.length < 500 &&
                        (titleMatches || RE_TITLEPAGE_LABEL.test(labelNorm));
                    const isAnnotation = RE_ANNOTATION.test(labelNorm);
                    const isEndNotes = RE_ENDNOTES.test(labelNorm);
                    // Эпиграф/стих перед главой или частью (например «Ворон» перед
                    // главой 1 у Сапковского): короткий текст (обычно стихотворная
                    // форма), метка TOC либо пустая/безликая («—», номер), либо
                    // явно указывает на эпиграф/стихотворение — а не на «Главу N».
                    // Такие вставки не публикуются отдельным файлом, а
                    // приклеиваются к началу СЛЕДУЮЩЕЙ обычной главы.
                    const RE_EPIGRAPH_LABEL = /^(эпиграф|epigraph|стих|poem|пролог\s*в\s*стихах)/i;
                    const RE_PART_LABEL = /^(часть|part|раздел)\s*\S/i;
                    const isPartHeading = RE_PART_LABEL.test(labelNorm) && !/глава|chapter/i.test(labelNorm);
                    const looksLikeChapterLabel = /(глава|часть|chapter|part|раздел|книга\s+\S)/i.test(labelNorm);
                    // Короткая вставка (обычно стихотворная форма — эпиграф) с
                    // меткой TOC, НЕ похожей на «Глава/Часть N»: даже если сама
                    // метка — это просто первая строка стиха (не пустая и не
                    // безликая), всё равно считаем эпиграфом, а не главой.
                    const isEpigraph = !isTitlePage && !isAnnotation && !isEndNotes &&
                        !looksLikeChapterLabel && text.length < 700 &&
                        (RE_EPIGRAPH_LABEL.test(labelNorm) ||
                         !label || label.length < 3 ||
                         /^[\d.\s—-]*$/.test(label) ||
                         label.length < text.length * 0.9);

                    chapters.push({
                        title: item.label || `Глава ${chapters.length + 1}`,
                        sectionIndex,
                        depth: item.depth,
                        // Метки родителей от корня оглавления — см. комментарий
                        // у flattenToc. Пустой массив у "плоских" книг без
                        // частей/сборников — там группировать нечего.
                        ancestors: (item.ancestors || []).filter(a => a && a.trim()),
                        text,
                        charCount: text.length,
                        isTitlePage,
                        isPartHeading,
                        isEpigraph,
                        skipByDefault: isAnnotation || isEndNotes,
                    });
                }

                // ── Резолвим ВСЕ пункты TOC и группируем по sectionIndex ──
                //
                // ВАЖНО (исправление бага «скрытых под сплэшем» глав): раньше
                // при совпадении sectionIndex у нескольких пунктов TOC текст
                // забирал только первый пункт, остальные тихо пропускались
                // (`if (seenSectionIndexes.has(sectionIndex)) continue`).
                // Совпадение — обычная ситуация, а не редкий случай:
                //  • FB2 (ibc/fb2.js): вложенные <section> «Часть → Глава»
                //    становятся ОДНОЙ book.sections-секцией на всю «Часть»,
                //    вложенные главы адресуются якорями (#fragment) внутри
                //    неё же;
                //  • EPUB: многие книги хранят НЕСКОЛЬКО глав в одном
                //    .xhtml-файле, и nav/ncx ссылается на них через #якоря
                //    того же файла.
                // В обоих случаях старый код видел только ОДНУ «Часть»/файл
                // целиком (её TOC-метку и весь текст сразу), а вложенные
                // главы («скрытые под сплэшем», пока их не откроешь) в
                // список глав вообще не попадали.
                const bySection = new Map(); // sectionIndex -> [{item, resolved}, ...]
                for (const item of flatToc) {
                    if (!item.href) continue;
                    let resolved;
                    try {
                        resolved = await book.resolveHref(item.href);
                    } catch(e) { continue; }
                    const sectionIndex = resolved?.index;
                    if (sectionIndex === undefined || sectionIndex === null) continue;
                    if (!bySection.has(sectionIndex)) bySection.set(sectionIndex, []);
                    bySection.get(sectionIndex).push({ item, resolved });
                }

                for (const [sectionIndex, entries] of bySection) {
                    const section = book.sections[sectionIndex];
                    if (!section) continue;

                    if (!section.createDocument) {
                        // Секция без DOM (редкий формат без createDocument) —
                        // делить по якорям негде, как раньше берём текст
                        // целиком на первый пункт TOC, указывающий на неё.
                        let text = '';
                        try {
                            if (section.getPlainText) {
                                text = stripFootnoteMarkers(section.getPlainText().replace(/\s+/g, ' ').trim());
                            }
                        } catch(e) {
                            log(` extractChaptersForAudiobook: секция ${sectionIndex} — ошибка извлечения: ${e.message}`, 'warn');
                            continue;
                        }
                        pushChapter(entries[0].item, text, sectionIndex);
                        continue;
                    }

                    let doc;
                    try {
                        doc = await section.createDocument();
                        // Убираем рекламные вставки пиратских сайтов —
                        // та же функция, что чистит видимые секции при чтении.
                        try { hideAdSections(doc); } catch(e) {}
                        try { hideFakeTOCLists(doc); } catch(e) {}
                    } catch(e) {
                        log(` extractChaptersForAudiobook: секция ${sectionIndex} — ошибка извлечения: ${e.message}`, 'warn');
                        continue;
                    }

                    if (entries.length === 1) {
                        // Единственный пункт TOC на секцию — обычный случай,
                        // берём текст целиком, как и раньше.
                        const text = stripFootnoteMarkers((doc.body?.textContent ?? '').replace(/\s+/g, ' ').trim());
                        pushChapter(entries[0].item, text, sectionIndex);
                        continue;
                    }

                    // Несколько пунктов TOC делят одну секцию («Часть» +
                    // вложенные «Главы», либо несколько глав в одном файле
                    // EPUB) — вырезаем каждому пункту ТОЛЬКО его собственный
                    // кусок: от его якоря (включительно) до якоря СЛЕДУЮЩЕГО
                    // пункта той же секции (не включая), в порядке следования
                    // элементов В ДОКУМЕНТЕ (не в порядке TOC — обычно
                    // совпадает, но на всякий случай не полагаемся на это).
                    const positioned = entries.map(({ item, resolved }) => {
                        let el = null;
                        try {
                            const a = resolved.anchor ? resolved.anchor(doc) : null;
                            // EPUB отдаёт anchor:()=>0 (число, не элемент) для
                            // пунктов без #якоря — такой пункт не может быть
                            // точкой разреза, обрабатываем как «нет якоря».
                            if (a && a.nodeType) el = a;
                        } catch(e) {}
                        return { item, el };
                    });
                    const withAnchor = positioned.filter(p => p.el);
                    withAnchor.sort((a, b) => {
                        const pos = a.el.compareDocumentPosition(b.el);
                        if (pos & Node.DOCUMENT_POSITION_FOLLOWING) return -1;
                        if (pos & Node.DOCUMENT_POSITION_PRECEDING) return 1;
                        return 0;
                    });

                    if (withAnchor.length === 0) {
                        // Ни один якорь не разрешился — деградируем к
                        // поведению «взять всё целиком», чтобы хотя бы не
                        // потерять весь текст секции.
                        const text = stripFootnoteMarkers((doc.body?.textContent ?? '').replace(/\s+/g, ' ').trim());
                        pushChapter(entries[0].item, text, sectionIndex);
                        continue;
                    }

                    for (let i = 0; i < withAnchor.length; i++) {
                        const { item, el } = withAnchor[i];
                        const nextEl = withAnchor[i + 1]?.el ?? null;
                        let text = '';
                        try {
                            const range = doc.createRange();
                            // Первый пункт секции — от самого начала body, а
                            // не от своего якоря: так не теряется текст ДО
                            // первого найденного якоря (например, заголовок
                            // «Часть N», если он сам не зарегистрирован в TOC).
                            if (i === 0 && doc.body?.firstChild) {
                                range.setStartBefore(doc.body.firstChild);
                            } else {
                                range.setStartBefore(el);
                            }
                            if (nextEl) {
                                range.setEndBefore(nextEl);
                            } else if (doc.body?.lastChild) {
                                range.setEndAfter(doc.body.lastChild);
                            } else {
                                range.setEndAfter(el);
                            }
                            text = stripFootnoteMarkers(range.toString().replace(/\s+/g, ' ').trim());
                        } catch(e) {
                            log(` extractChaptersForAudiobook: секция ${sectionIndex}, пункт "${item.label}" — ошибка разбиения по якорям: ${e.message}`, 'warn');
                        }
                        pushChapter(item, text, sectionIndex);
                    }
                }

                // Эпиграфы к записи не приклеиваем и не включаем вообще —
                // только «Название книги. Автор» + текст самой главы.
                // Отдельным файлом не публикуются и в текст соседней главы
                // не встраиваются (раньше приклеивались — при разборе оказалось,
                // что для разных книг это давало неровный, непредсказуемый
                // результат; надёжнее просто выбросить их из списка).
                const chaptersNoEpigraph = chapters.filter(ch => !ch.isEpigraph);
                chapters.length = 0;
                chapters.push(...chaptersNoEpigraph);

                log(` extractChaptersForAudiobook: извлечено ${chapters.length} глав`, 'info');
                bridge?.onChaptersExtracted?.(JSON.stringify({ chapters, bookTitle: bookTitleText }));
            } catch(e) {
                log(' extractChaptersForAudiobook: ошибка: ' + e.message, 'error');
                bridge?.onChaptersExtracted?.(JSON.stringify({ error: e.message }));
            }
        };


        // Показываем/скрываем кнопку отладки по режиму разработчика
        window.setDevMode = (enabled) => {
            const btn = document.getElementById('debugBtn');
            if (btn) btn.style.display = enabled ? '' : 'none';
        };

        function applyPageMargin(px) {
            if (view?.renderer) {
                view.renderer.style.setProperty('--_margin', px + 'px');
            }
            document.documentElement.style.setProperty('--page-margin', px + 'px');
        }

        function applyPanelHeight(px) {
            // Толщина верхней/нижней панели (Настройки -> Тема). Иконки и
            // сам текст иконок внутри .icon-button пересчитываются
            // автоматически через calc(var(--panel-height)) в CSS —
            // здесь достаточно поменять одну переменную.
            document.documentElement.style.setProperty('--panel-height', px + 'px');
        }

        // ── АВТОСОХРАНЕНИЕ ПОЗИЦИИ (CFI) ──
        // Сохраняет точную позицию (CFI = секция + смещение в DOM).
        // Вызывается на каждый relocate — включая листание страниц внутри секции.
        // Дебаунс 300мс чтобы не спамить, но при закрытии — принудительный flush.

        let _savePositionTimer = null;
        let _pendingSavePos = null;

        function autoSavePosition() {
            if (!bridge || !bookReady) return;
            try {
                const loc = view?.lastLocation;
                const cfi = loc?.cfi ?? null;
                const section = currentSection;
                _pendingSavePos = { section, cfi };
            } catch(e) { return; }

            clearTimeout(_savePositionTimer);
            _savePositionTimer = setTimeout(() => flushSavePosition(), 300);
        }

        function flushSavePosition() {
            clearTimeout(_savePositionTimer);
            _savePositionTimer = null;
            if (!_pendingSavePos || !bridge || !bookReady) return;
            const { section, cfi } = _pendingSavePos;
            _pendingSavePos = null;
            const pos = JSON.stringify({ section, cfi });
            // ВАЖНО: прогресс для библиотеки берём из того же loc.fraction,
            // что показывает сама читалка (progressInfo, updatePageInfo()) —
            // это доля по факту прочитанного текста, а не по номеру секции.
            // Старая формула "section / totalSections" считала прогресс по
            // числу секций EPUB, а не по объёму текста: у книг с малым
            // числом крупных глав вперемешку с мелкими техническими
            // секциями (обложка, титул, содержание, копирайт — тоже
            // отдельные секции) это давало сильно завышенный процент —
            // например, 35% в библиотеке при факте ~1% прочитанного текста.
            const loc = view?.lastLocation;
            let progress = loc?.fraction;
            if (typeof progress !== 'number' || Number.isNaN(progress)) {
                // Фолбэк на старую формулу — только если fraction недоступен.
                progress = section / Math.max(1, (book?.sections?.length || 1) - 1);
            }
            bridge.savePosition(pos, Math.min(1, Math.max(0, progress)));
            log(` Позиция: секция ${section + 1}, CFI=${cfi ? cfi.substring(0, 40) + '...' : 'нет'}`, 'nav');
        }

        // При закрытии вкладки/окна — сохраняем немедленно
        window.addEventListener('beforeunload', () => flushSavePosition());

        function updatePageInfo() {
            if (!view) return;
            const pageInfo = document.getElementById('pageInfo');
            const progressInfo = document.getElementById('progressInfo');
            if (!pageInfo) return;

            const loc = view.lastLocation;
            // foliate-js считает «location» как chars/1500 ≈ страница
            // location.current / location.total даёт номер страницы книги
            if (loc?.location?.total > 0) {
                pageInfo.textContent = `${loc.location.next || loc.location.current} / ${loc.location.total}`;
            } else if (loc?.section) {
                pageInfo.textContent = `${loc.section.current + 1} / ${loc.section.total}`;
            } else {
                pageInfo.textContent = `${currentSection + 1} / ${book?.sections?.length || 0}`;
            }

            if (progressInfo) {
                const fraction = loc?.fraction || 0;
                progressInfo.textContent = `${Math.round(fraction * 100)}%`;
            }
        }

        // ── Helpers ──────────────────────────────────────────────────
        async function tocNavigate(href) {
            if (!href) return;
            try {
                // view.goTo(href) - строкой, НЕ book.resolveHref(href).index -
                // тогда resolveNavigation() внутри view.js сам вызовет
                // book.resolveHref(href) и передаст renderer.goTo() сразу И
                // index, И anchor вместе. Это тот же путь, что использует
                // сам пагинатор для scrollToAnchor()/scrollToRect() - с
                // учётом постраничной вёрстки, а не нативный
                // element.scrollIntoView(), который эту вёрстку не видит.
                //
                // Раньше здесь сначала звали book.resolveHref(href) вручную,
                // потом view.goTo(result.index) - ТОЛЬКО индексом, без
                // anchor - из-за этого relocate фиксировал начало секции, а
                // уже после (через scrollIntoView) экран докручивался к
                // главе визуально, но пагинатор про этот скролл ничего не
                // знал. Из-за этого и CFI сохранялся не тот (relocate уже
                // отработал ДО докрутки), и подсветка оглавления брала
                // устаревшую позицию.
                //
                // Теперь relocate стреляет УЖЕ с правильной позицией - и
                // autoSavePosition(), и highlightCurrentTocItem() висят на
                // глобальном view.addEventListener('relocate', ...) и сами
                // получат верные данные. Отдельно вызывать
                // highlightCurrentTocItem() здесь больше не нужно - только
                // loadHighlights() (загрузка СОХРАНЁННЫХ ранее выделений
                // текста для этой секции - отдельная задача, relocate её
                // не решает).
                await view.goTo(href);
                toggleToc();
                setTimeout(function() {
                    loadHighlights();
                }, 300);
            } catch(e) {
                log('TOC навигация: ' + e.message, 'warn');
            }
        }

        // Логика фильтрации/иерархии/рендера оглавления вынесена в toc.js.
        // renderToc(toc) сохраняет прежнюю однопараметровую сигнатуру —
        // контейнер и callback навигации передаются модулю здесь.
        function renderToc(toc) {
            _renderTocImpl(toc, document.getElementById('tocContent'), tocNavigate);
        }

        // ══════════════════════════════════════════════════════════════
        //  ПОИСК ПО КНИГЕ
        // ══════════════════════════════════════════════════════════════
        let _searchAbort = null;

        function switchTocTab(tab) {
            const tocContent    = document.getElementById('tocContent');
            const searchPane    = document.getElementById('tocSearchPane');
            const tabToc        = document.getElementById('tabToc');
            const tabSearch     = document.getElementById('tabSearch');

            if (tab === 'search') {
                tocContent.style.display  = 'none';
                searchPane.style.display  = 'flex';
                tabSearch.classList.add('active');
                tabToc.classList.remove('active');
                document.getElementById('bookSearchInput')?.focus();
            } else {
                tocContent.style.display  = '';
                searchPane.style.display  = 'none';
                tabToc.classList.add('active');
                tabSearch.classList.remove('active');
            }
        }

        // ── Поисковый индекс для больших книг ───────────────────────────────────
        let searchIndex = null;
        let searchIndexBuilding = false;

        const SEARCH_INDEX_MIN_SECTIONS = 30;
        const SEARCH_INDEX_MIN_SIZE_MB  = 5;

        function shouldBuildIndex() {
            const sections = book?.sections ?? [];
            const totalSize = sections.reduce((s, sec) => s + (sec.size ?? 0), 0);
            return sections.length >= SEARCH_INDEX_MIN_SECTIONS
                || totalSize > SEARCH_INDEX_MIN_SIZE_MB * 1024 * 1024;
        }

        async function buildSearchIndexBackground() {
            if (searchIndex || searchIndexBuilding || !shouldBuildIndex()) return;
            searchIndexBuilding = true;
            searchIndex = new Map();
            log(`[Search] Индексация ${book.sections.length} секций...`, 'info');
            for (let i = 0; i < book.sections.length; i++) {
                const section = book.sections[i];
                try {
                    let text = '';
                    if (section.getPlainText) {
                        text = section.getPlainText();
                    } else if (section.createDocument) {
                        const doc = await section.createDocument();
                        text = doc.body?.textContent ?? '';
                    }
                    const words = text.toLowerCase().match(/[а-яёa-z]{3,}/g) ?? [];
                    const seen = new Set();
                    for (const word of words) {
                        if (seen.has(word)) continue;
                        seen.add(word);
                        if (!searchIndex.has(word)) searchIndex.set(word, []);
                        searchIndex.get(word).push(i);
                    }
                } catch(e) {}
                if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
            }
            searchIndexBuilding = false;
            log(`[Search] Индекс готов: ${searchIndex.size} слов`, 'info');
        }

        function getIndexedSections(query) {
            if (!searchIndex || searchIndexBuilding) return null;
            const words = query.toLowerCase().match(/[а-яёa-z]{3,}/g);
            if (!words?.length) return null;

            // Берём самое редкое слово запроса — оно даёт минимальный
            // но достаточный набор секций. Это лучше пересечения (которое
            // для длинных фраз даёт 0-2 секции) и объединения (которое
            // для частых слов даёт все секции).
            let bestSet = null;
            let bestSize = Infinity;
            for (const word of words) {
                const secs = searchIndex.get(word);
                if (!secs) return new Set(); // слова нет в индексе — точно не найдём
                if (secs.length < bestSize) {
                    bestSize = secs.length;
                    bestSet = new Set(secs);
                }
            }
            return bestSet ?? new Set();
        }

        async function runBookSearch(query) {
            const resultsEl = document.getElementById('bookSearchResults');
            const statusEl  = document.getElementById('bookSearchStatus');
            if (!resultsEl || !statusEl) return;

            resultsEl.innerHTML = '';
            if (view?.clearSearch) view.clearSearch();

            if (!query.trim()) { statusEl.textContent = ''; return; }
            if (!view)          { statusEl.textContent = 'Книга не загружена'; return; }

            // Оптимизация: для длинных фраз (>10 слов) ищем только по первым 5 словам
            const words = query.trim().split(/\s+/);
            const searchQuery = words.length > 10 ? words.slice(0, 5).join(' ') : query;
            if (words.length > 10) {
                statusEl.textContent = `Длинный запрос: ищем по первым ${Math.min(5, words.length)} словам...`;
            }

            statusEl.textContent = 'Поиск…';
            if (_searchAbort) _searchAbort();
            let aborted = false;
            _searchAbort = () => { aborted = true; };

            // Запускаем фоновую индексацию если книга большая
            // (не блокирует текущий поиск, ускорит следующий)
            buildSearchIndexBackground().catch(() => {});

            // Проверяем индекс — для большой книги фильтруем секции
            const indexedSections = getIndexedSections(searchQuery);
            if (indexedSections !== null) {
                const total = book?.sections?.length ?? '?';
                log(`[Search] Индекс: ${indexedSections.size}/${total} секций`, 'info');
                if (indexedSections.size === 0) {
                    statusEl.textContent = 'Ничего не найдено';
                    return;
                }
                statusEl.textContent = `Поиск в ${indexedSections.size} секциях…`;
            }

            // Таймаут: если за 30 сек ничего не найдено — считаем «не найдено»
            const timeoutId = setTimeout(() => {
                if (!aborted) {
                    aborted = true;
                    if (!resultsEl.children.length)
                        statusEl.textContent = 'Ничего не найдено';
                }
            }, 30000);

            try {
                let count = 0;
                const MAX = 300;

                let sectionCount = 0;
                for await (const result of view.search({ query: searchQuery })) {
                    if (aborted) break;

                    // Пропускаем секции которых нет в индексе
                    if (indexedSections !== null && result.index !== undefined
                        && !indexedSections.has(result.index)) continue;

                    sectionCount++;

                    if (!result.subitems?.length) continue;   // progress-объект

                    const chapterLabel = result.label || '';

                    result.subitems.forEach(item => {
                        if (aborted || count >= MAX) return;
                        count++;

                        // excerpt — объект {pre, match, post} из foliate-js search.js
                        let matchHtml = '';
                        const ex = item.excerpt;
                        if (ex && typeof ex === 'object') {
                            const pre   = ex.pre   || '';
                            const match = ex.match || query;
                            const post  = ex.post  || '';
                            matchHtml = escHtml(pre)
                                + '<mark>' + escHtml(match) + '</mark>'
                                + escHtml(post);
                        } else if (typeof ex === 'string') {
                            const esc2 = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                            matchHtml = escHtml(ex).replace(
                                new RegExp('(' + esc2 + ')', 'gi'),
                                '<mark>$1</mark>');
                        } else {
                            matchHtml = escHtml(query);
                        }

                        const el = document.createElement('div');
                        el.className = 'search-result-item';
                        el.innerHTML =
                            '<div class="sr-match">' + matchHtml + '</div>' +
                            (chapterLabel
                                ? '<div class="sr-chapter">' + escHtml(chapterLabel) + '</div>'
                                : '');
                        el.addEventListener('click', async () => {
                            if (item.cfi) {
                                // Переход на позицию
                                await view.goTo(item.cfi);

                                // Обновляем подсветку
                                setTimeout(() => loadHighlights(), 300);

                                // Показываем кнопку снятия выделения
                                const clearBtn = document.getElementById('clearSearchHighlight');
                                if (clearBtn) clearBtn.style.display = 'block';
                                
                                // Добавляем обработчик для снятия выделения по клику
                                // Выделение появится автоматически от foliate-js
                                setTimeout(() => {
                                    const doc = view.renderer?.getContents?.()?.[0]?.doc;
                                    if (doc) {
                                        // Клик по документу снимает выделение поиска
                                        const clickHandler = (e) => {
                                            // Проверяем, что клик не по другому результату поиска
                                            if (e.target.closest('.search-result-item')) return;
                                            
                                            // Снимаем выделение
                                            const selection = doc.defaultView?.getSelection();
                                            if (selection) selection.removeAllRanges();
                                            
                                            // Скрываем кнопку
                                            const btn = document.getElementById('clearSearchHighlight');
                                            if (btn) btn.style.display = 'none';
                                            
                                            // Удаляем обработчик
                                            doc.removeEventListener('click', clickHandler);
                                            log(' Выделение поиска снято', 'info');
                                        };
                                        
                                        // Даем небольшую задержку перед установкой обработчика
                                        setTimeout(() => {
                                            doc.addEventListener('click', clickHandler);
                                            log(' Кликните в любом месте для снятия выделения', 'info');
                                        }, 500);
                                    }
                                }, 300);
                            }
                        });
                        resultsEl.appendChild(el);
                        // Показываем результаты по мере нахождения
                        if (count === 1) statusEl.textContent = 'Поиск… (найдено: 1)';
                        else if (count % 20 === 0) statusEl.textContent = `Поиск… (найдено: ${count})`;
                    });

                    if (count >= MAX) break;
                }

                clearTimeout(timeoutId);
                if (!aborted) {
                    const resultText = count
                        ? 'Найдено: ' + count + (count >= MAX ? '+' : '') + ' результатов'
                        : 'Ничего не найдено';
                    statusEl.textContent = resultText;
                    
                    // Показываем кнопку снятия выделения, если что-то найдено
                    const clearBtn = document.getElementById('clearSearchHighlight');
                    if (clearBtn) {
                        clearBtn.style.display = count > 0 ? 'block' : 'none';
                    }
                }
            } catch(e) {
                clearTimeout(timeoutId);
                if (!aborted) {
                    statusEl.textContent = 'Ничего не найдено';
                    log('Поиск: ' + e.message, 'error');
                }
            }
        }

        // Экранирование HTML для безопасного вывода
        // escHtml вынесен в dom-text-utils.js (импортирован как escHtml выше)

        // ==================== TTS ЯДРО ====================
        // Использует встроенный foliate-js TTS класс:
        // - view.initTTS('sentence', highlightFn) создаёт TTS с Intl.Segmenter
        // - TTS итерирует блоки (p, h1-h6, li...) через getBlocks(doc)
        // - Для каждого блока textWalker+Segmenter строит правильные cross-node Range
        // - view.tts.getRanges() возвращает Map<name,range> для текущего блока
        // - view.tts.setMark(name) вызывает highlightFn(range) и запоминает позицию

        // Обновляет кнопку play/pause и индикатор TTS в зависимости от ttsActive/ttsPaused.
        // ВАЖНО: эта функция читает TTS-состояние (ttsActive, ttsPaused) — она
        // случайно попала в диапазон, вырезанный при переносе кода закладок/
        // подсветок в bookmarks-highlights.js, хотя по смыслу принадлежит
        // TTS-ядру reader.html. Восстановлена здесь.
        function updateTTSButtons() {
            const btn = document.getElementById('ttsPlayPauseBtn');
            const indicator = document.getElementById('ttsIndicator');
            const controls = document.getElementById('ttsControls');
            if (!btn || !indicator) return;

            const prevBtn = document.getElementById('ttsPrevBtn');
            const nextBtn = document.getElementById('ttsNextBtn');
            const settingsBtn = document.getElementById('ttsSettingsBtn');
            const closeBtn = document.getElementById('ttsCloseBtn');
            if (prevBtn) { prevBtn.title = ttsText('tts_prev'); prevBtn.setAttribute('aria-label', ttsText('tts_prev')); }
            if (nextBtn) { nextBtn.title = ttsText('tts_next'); nextBtn.setAttribute('aria-label', ttsText('tts_next')); }
            if (settingsBtn) { settingsBtn.title = ttsText('tts_settings_button'); settingsBtn.setAttribute('aria-label', ttsText('tts_settings_button')); }
            if (closeBtn) { closeBtn.title = ttsText('tts_stop'); closeBtn.setAttribute('aria-label', ttsText('tts_stop')); }

            if (ttsActive) {
                btn.innerHTML = '<span class="material-icons">pause</span>';
                btn.title = ttsText('tts_play_pause');
                btn.setAttribute('aria-label', ttsText('tts_play_pause'));
                indicator.classList.add('active');
                indicator.style.background = '';
                if (controls) controls.classList.add('visible');
            } else if (ttsPaused) {
                btn.innerHTML = '<span class="material-icons">play_arrow</span>';
                indicator.classList.add('active');
                indicator.style.background = '#f59e0b';
                if (controls) controls.classList.add('visible');
            } else {
                btn.innerHTML = '<span class="material-icons">play_arrow</span>';
                indicator.classList.remove('active');
                indicator.style.background = '';
                if (controls) controls.classList.remove('visible');
            }
        }

        function getOverlayer() {
            try {
                const contents = view?.renderer?.getContents();
                return contents?.[0]?.overlayer || null;
            } catch(e) { return null; }
        }

        // Инициализация bookmarks-highlights.js — передаём геттеры, так как
        // bridge/view/book/currentSection/currentBookPath переприсваиваются
        // в разных местах этого файла (подключение WebChannel, навигация и
        // т.д.), а модуль должен всегда видеть АКТУАЛЬНОЕ значение, а не
        // значение на момент инициализации.
        initBookmarksHighlights({
            getBridge: () => bridge,
            getView: () => view,
            getBook: () => book,
            getCurrentSection: () => currentSection,
            getCurrentBookPath: () => currentBookPath,
            getOverlayer: () => getOverlayer(),
            log,
            HIGHLIGHT_COLORS,
            Overlayer,
            userHighlightMap,
            findTextRange,
        });

        function getTTSDoc() {
            try {
                return view?.renderer?.getContents()?.[0]?.doc || null;
            } catch(e) { return null; }
        }

        function ttsHighlight(range) {
            clearTTSHighlight();
            // Снимаем ручное выделение текста мышью (синяя/серая заливка) —
            // оно осталось бы висеть поверх/рядом с TTS-подсветкой строки,
            // если запустили озвучку через "Читать с этого места".
            try {
                if (currentRangeDoc) {
                    currentRangeDoc.getSelection()?.removeAllRanges();
                }
                window.getSelection()?.removeAllRanges();
            } catch(e) {}
            currentRange = null;
            currentSelection = null;
            try { document.getElementById('selectionToolbar')?.classList.remove('visible'); } catch(e) {}

            const ov = getOverlayer();
            if (!ov || !range) return;
            const id = 'tts-' + Date.now();
            try {
                // Цвет и прозрачность берутся из пользовательских настроек
                // (ttsHighlightColor / ttsHighlightOpacity), а не жёстко заданы.
                ov.add(id, range, Overlayer.highlight, {
                    color: ttsHighlightColor,
                    opacity: ttsHighlightOpacity,
                });
                currentTTSHighlightId = id;
                // Сохраняем CFI текущей позиции TTS для кнопки "Вернуться"
                try {
                    const contents = view.renderer?.getContents?.();
                    if (contents?.length > 0) {
                        lastTtsCfi = view.getCFI(contents[0].index, range);
                        lastTtsSectionIndex = contents[0].index;
                    }
                } catch(e2) {}
                // Сохраняем Range и текст для восстановления подсветки после ручного листания
                try {
                    lastTtsRange = range.cloneRange();
                    // Текст текущего предложения — для поиска в новом DOM после goTo
                    if (ttsSentences[ttsSentenceIndex]) {
                        lastTtsSentenceText = ttsSentences[ttsSentenceIndex].text;
                    }
                } catch(e3) {}
                log(' Подсветка: ' + range.toString().substring(0, 40), 'tts');
                updateStats();
            } catch(e) {
                log(' Ошибка подсветки: ' + e.message, 'error');
            }
        }

        function clearTTSHighlight() {
            const ov = getOverlayer();
            if (currentTTSHighlightId && ov) {
                try { ov.remove(currentTTSHighlightId); } catch(e) {}
                currentTTSHighlightId = null;
                updateStats();
            }
        }

        // Инициализирует view.tts для текущего doc.
        // Всегда пересоздаёт (view.tts = null), чтобы начать с первого блока.
        // Заголовки секций которые TTS должен пропускать полностью
        const TTS_SKIP_TITLES = [
            'nota bene', 'note bene', 'notabene',
            'от пирата', 'от пиратов', 'реклама',
            'цокольный этаж', 'searchfloor',
        ];

        function isCurrentDocAdSection() {
            const doc = getTTSDoc();
            if (!doc) return false;
            const t = ((doc.title || '') + ' ' +
                       (doc.querySelector('h1,h2')?.textContent || '')).toLowerCase();
            return TTS_SKIP_TITLES.some(s => t.includes(s));
        }

        async function initTTSForCurrentDoc() {
            const doc = getTTSDoc();
            if (!doc) { log(' doc недоступен', 'error'); return false; }

            // Пропускаем рекламные секции по заголовку документа
            const docTitle = (doc.title || '').trim().toLowerCase();
            const h1Text   = (doc.querySelector('h1,h2')?.textContent || '').trim().toLowerCase();
            const checkText = docTitle + ' ' + h1Text;
            if (TTS_SKIP_TITLES.some(t => checkText.includes(t))) {
                log(` Пропускаем рекламную секцию: "${docTitle || h1Text}"`, 'info');
                return false;
            }

            view.tts = null; // сбрасываем, чтобы initTTS пересоздал
            try {
                await view.initTTS('sentence', ttsHighlight);
                return !!view.tts;
            } catch(e) {
                log(' initTTS: ' + e.message, 'error');
                return false;
            }
        }

        // «Подпись» блока — первые 6 слов всех предложений вместе (для пропуска дублей)
        function blockSignature() {
            // Пустая подпись = «этот блок дублем считать нельзя».
            // Раньше в диалогах подряд идущие одинаковые реплики («— Да.» / «— Да.»,
            // «— Что?» / «— Что?») давали одинаковую подпись, и вторая реплика
            // молча пропускалась целиком. Дубли заголовков (ради которых проверка
            // и сделана) — это обычный текст, а не прямая речь.
            const first = (ttsSentences[0] && ttsSentences[0].text || '').trim();
            if (/^[\u2014\u2013\u2015\-"'\u00AB\u201C\u201E\u201C]/.test(first)) return '';
            const sig = ttsSentences.slice(0, 3).map(s => s.text.trim()).join(' ')
                   .split(/\s+/).slice(0, 8).join(' ').toLowerCase();
            // Короткая законченная фраза («Да.», «Нет!», «Что?») — реплика, не заголовок
            // (у заголовков обычно нет точки/«!»/«?» в конце).
            if (sig.split(' ').length < 4 && /[.!?\u2026]["'\u00BB\u201D)]*$/.test(sig)) return '';
            return sig;
        }

        // ── Пословная подсветка (только Edge TTS — точные WordBoundary тайминги) ────
        // В отличие от Piper (нет нативных таймингов слов), Edge TTS присылает
        // offset/duration для каждого слова через WebSocket-протокол синтеза.
        // Здесь мы просто планируем подсветку по этим точным меткам времени.
        let ttsWordMode           = false;  // переключатель из настроек
        let ttsWordHighlightTimer = null;
        let ttsWordRanges         = null;   // [{text, range}, ...] слова текущего предложения

        // Разбивает Range предложения на массив слов [{text, range}] по порядку
        // Убирает маркеры сносок вида "[2]", "[12]" — цифра в квадратных
        // скобках сразу после слова/номера (ссылка на пояснение в конце
        // книги). Само слово перед сноской остаётся, только номер сноски
        // вырезается — иначе TTS зачитывает "…не вспоминай [2]" вместо
        // просто "…не вспоминай". Не трогает обычные квадратные скобки с
        // текстом внутри (не только цифрами) — это может быть авторская
        // ремарка, а не сноска.
        function stripFootnoteMarkers(text) {
            if (!text) return text;
            return text.replace(/\s*\[\d{1,3}\]/g, '').replace(/\s{2,}/g, ' ');
        }

        function splitSentenceIntoWords(sentRange) {
            const doc = sentRange.startContainer.ownerDocument;
            const result = [];
            // ИСПРАВЛЕНО: если commonAncestorContainer сам является текстовым узлом
            // (Node.TEXT_NODE), TreeWalker с SHOW_TEXT, стартующий от него, не
            // обходит сам этот узел как первый nextNode() — в итоге walker не
            // возвращает ни одной ноды и функция отдаёт 0 слов даже когда
            // предложение целиком лежит в одном текстовом узле. Поднимаемся к
            // родительскому элементу, чтобы TreeWalker корректно увидел узел.
            let root = sentRange.commonAncestorContainer;
            if (root.nodeType === Node.TEXT_NODE) root = root.parentNode;
            const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
            let node;
            while ((node = walker.nextNode())) {
                const nodeRange = doc.createRange();
                nodeRange.selectNodeContents(node);
                if (sentRange.compareBoundaryPoints(Range.END_TO_START, nodeRange) >= 0) continue;
                if (sentRange.compareBoundaryPoints(Range.START_TO_END, nodeRange) <= 0) break;
                const start = node === sentRange.startContainer ? sentRange.startOffset : 0;
                const end   = node === sentRange.endContainer   ? sentRange.endOffset   : node.length;
                const text  = node.textContent.slice(start, end);
                const wordRe = /[^\s\u00A0]+/g;
                let m;
                while ((m = wordRe.exec(text)) !== null) {
                    const wStart = start + m.index;
                    const wEnd   = wStart + m[0].length;
                    const wRange = doc.createRange();
                    wRange.setStart(node, wStart);
                    wRange.setEnd(node, wEnd);
                    result.push({ text: m[0], range: wRange });
                }
            }
            return result;
        }

        // Вызывается из Python когда WordBoundary-тайминги для текущего предложения готовы.
        // Только подсветка — никакого листания здесь никогда не было и не будет
        // (листание для разрывных предложений теперь синхронно в window.ttsNext).
        window._ttsWordTimings = function(timings) {
            if (!ttsWordMode || !ttsActive) return;
            const s = ttsSentences[ttsSentenceIndex];
            if (!s) return;
            try {
                // Для разрывного предложения слова строим по текущему траншу
                // (parts[partIndex]), а не по всему s.range — иначе подсветка
                // пыталась бы выйти за пределы текущей видимой страницы.
                const rangeForWords = s.isSplitSentence ? s.parts[s.partIndex].range : s.range;
                ttsWordRanges = splitSentenceIntoWords(rangeForWords);
                _scheduleWordHighlights(timings);
            } catch(e) {
                log(' Ошибка построения слов для подсветки: ' + e.message, 'warn');
            }
        };

        function _scheduleWordHighlights(timings) {
            if (ttsWordHighlightTimer) { clearTimeout(ttsWordHighlightTimer); ttsWordHighlightTimer = null; }
            if (!ttsWordRanges || !timings || !timings.length) return;
            // Сопоставляем по позиции — количество слов от Edge обычно совпадает
            // с разбивкой DOM, т.к. оба считают по границам пробелов.
            const n = Math.min(ttsWordRanges.length, timings.length);
            let i = 0;
            const startWallClock = performance.now();
            function tick() {
                if (!ttsWordMode || !ttsActive || i >= n) return;
                const w = ttsWordRanges[i];
                if (w && w.range) {
                    try { ttsHighlight(w.range); } catch(e) {}
                }
                i++;
                if (i < n) {
                    const nextDelay = timings[i].start_ms - (performance.now() - startWallClock);
                    ttsWordHighlightTimer = setTimeout(tick, Math.max(0, nextDelay));
                }
            }
            tick();
        }

        function _clearWordHighlightSchedule() {
            if (ttsWordHighlightTimer) { clearTimeout(ttsWordHighlightTimer); ttsWordHighlightTimer = null; }
            ttsWordRanges = null;
        }

        // Загружает предложения из текущего блока в ttsSentences[].
        // Возвращает true если есть предложения.
        // Regex для определения "ложной" границы предложения на инициале:
        // текст заканчивается на одну заглавную букву (кириллица или латиница)
        // сразу перед точкой — например "Васильев П." — это НЕ конец предложения,
        // а сокращение имени/отчества. Также ловим и обратный случай — кусок,
        // состоящий ЦЕЛИКОМ из одной заглавной буквы с точкой (когда сегментатор
        // умудрился выделить "П." отдельным микро-"предложением").
        // \p{L} — любая буква (не только заглавная \p{Lu}): встречаются и
        // "p. R." со строчной первой буквой (авторское форматирование),
        // а не только "П." / "P." заглавными.
        // Строчная буква — инициал, только если это НЕ однобуквенное русское слово
        // (а, в, и, к, о, с, у, я): иначе «— сказал я.» склеивается со следующей репликой.
        const INITIAL_LETTER = '(?:\\p{Lu}|(?![авикосуя])\\p{Ll})';
        const INITIAL_TAIL_RE = new RegExp('(?:^|[\\s(])' + INITIAL_LETTER + '\\.$', 'u');
        const INITIAL_ONLY_RE = new RegExp('^' + INITIAL_LETTER + '\\.$', 'u');
        // Кусок, оставшийся от разорванного маркера сноски — например
        // сегментатор мог отрезать "[1]" от конца предыдущего предложения и
        // отдать его отдельным микро-"предложением": "1]", "[1]", "12]".
        // Открывающей скобки может уже не быть (осталась в предыдущем куске).
        const BARE_FOOTNOTE_RE = /^\[?\d{1,3}\]$/;

        /**
         * Склеивает соседние сегменты, если Intl.Segmenter(granularity:'sentence')
         * ошибочно разорвал предложение на инициале (например "Васильев П." | "П.
         * пришёл..." или "Васильев П." | "П." | "пришёл..."). Озвучка Piper всё
         * равно читает блок целиком без пауз на этом месте — рассинхрон был только
         * в подсветке, которая опиралась на эти (неверно разбитые) границы.
         */
        function mergeInitialSplits(rawSentences) {
            const merged = [];
            for (const item of rawSentences) {
                const prev = merged[merged.length - 1];
                const prevEndsWithInitial = prev &&
                    (INITIAL_TAIL_RE.test(prev.text) || INITIAL_ONLY_RE.test(prev.text));
                // Голый обрубок сноски ("1]", "[1]") — не самостоятельное
                // предложение ни при каких условиях, всегда приклеиваем к
                // предыдущему куску (даже если prev не заканчивается на
                // инициал) — иначе он озвучится/подсветится сам по себе.
                const itemIsBareFootnote = BARE_FOOTNOTE_RE.test(item.text);
                if (prev && (prevEndsWithInitial || itemIsBareFootnote)) {
                    // Склеиваем prev.range и item.range в один непрерывный range,
                    // чтобы подсветка охватывала оба куска сразу.
                    try {
                        const combined = prev.range.cloneRange();
                        let endContainer = item.range.endContainer;
                        let endOffset = item.range.endOffset;
                        // Если конец range приходится на текстовый узел, но
                        // endOffset не доходит до его реального конца (так
                        // бывает, когда foliate-js отдаёт диапазон, обрезанный
                        // по границе сегмента, а не по границе узла) —
                        // расширяем до полной длины узла, чтобы подсветка
                        // визуально захватывала весь видимый кусок целиком.
                        if (endContainer.nodeType === Node.TEXT_NODE &&
                            endOffset < endContainer.length &&
                            !endContainer.data.slice(endOffset).trim()) {
                            endOffset = endContainer.length;
                        }
                        combined.setEnd(endContainer, endOffset);
                        prev.range = combined;
                        const joiner = itemIsBareFootnote ? '' : ' ';
                        let joined = (prev.text + joiner + item.text).replace(/\s+/g, ' ').trim();
                        // Если item был обрубком сноски — сам номер сноски из
                        // склеенного текста тоже вырезаем (иначе он всё равно
                        // прозвучит в TTS, просто уже не отдельным "предложением").
                        if (itemIsBareFootnote) joined = stripFootnoteMarkers(joined);
                        prev.text = joined;
                        // ВАЖНО: после склейки s.range больше не совпадает с тем,
                        // что foliate-js помнит под именем s.name — setMark(s.name)
                        // подсветил бы ИСХОДНЫЙ (не расширенный) диапазон. Помечаем
                        // сегмент как склеенный, чтобы при показе подсветки
                        // использовать наш prev.range напрямую, а не setMark().
                        prev.wasMerged = true;
                        continue; // item поглощён предыдущим — не добавляем отдельно
                    } catch (e) {
                        // Если склейка Range не удалась (разные документы/узлы вне
                        // общего предка и т.п.) — не рискуем, оставляем как есть.
                        log(' mergeInitialSplits: не удалось склеить range: ' + e.message, 'warn');
                    }
                }
                merged.push(item);
            }
            return merged;
        }

        // ── Разбиение диалогов по тире ────────────────────────────────────────
        // Intl.Segmenter режет текст только по концу предложения (. ! ? …), поэтому
        // «— Огурец так не сажают, — пробубнил Антип, устраиваясь рядом…» приходит
        // одним предложением. Для озвучки реплику и слова автора нужно читать
        // отдельными фразами независимо от знаков препинания:
        //   «— Огурец так не сажают,» | «— пробубнил Антип, устраиваясь…»
        // Режем только предложения, НАЧИНАЮЩИЕСЯ с тире (прямая речь), по каждому
        // следующему тире внутри: отдельному («—» между пробелами) либо
        // приклеенному к слову («—пробубнил») после знака препинания.
        const TTS_SPLIT_DIALOGUE = true;
        const DIALOGUE_START_RE  = /^[\u2014\u2013\u2015-]/;     // — – ― -
        const DASH_ONLY_RE       = /^[\u2014\u2013\u2015\u2212-]$/;
