        const DASH_LEAD_RE       = /^[\u2014\u2013\u2015]\S/;
        const PUNCT_END_RE       = /[,.!?\u2026:;]["'\u00BB\u201D)]*$/;
        // Режем только если ПЕРЕД тире стоит знак препинания («— Реплика, — сказал
        // он»). Тире без знака перед ним — это тире внутри самой реплики
        // («— Пару грядок посеем — и будет.»), там разрывать нельзя.
        const TTS_DIALOGUE_DASH_NEEDS_PUNCT = true;

        function splitDialogueSentences(sentences) {
            if (!TTS_SPLIT_DIALOGUE) return sentences;
            const out = [];
            for (const sent of sentences) {
                if (!DIALOGUE_START_RE.test(sent.text)) { out.push(sent); continue; }
                try {
                    const words = splitSentenceIntoWords(sent.range);
                    // Индексы слов, с которых начинается новая часть
                    const cuts = [];
                    for (let wi = 1; wi < words.length - 1; wi++) {
                        const t = words[wi].text;
                        const prevHasPunct = !TTS_DIALOGUE_DASH_NEEDS_PUNCT ||
                            PUNCT_END_RE.test(words[wi - 1].text);
                        const isDash = prevHasPunct && (DASH_ONLY_RE.test(t) ||
                            (DASH_LEAD_RE.test(t) && PUNCT_END_RE.test(words[wi - 1].text)));
                        if (isDash) cuts.push(wi);
                    }
                    if (!cuts.length) { out.push(sent); continue; }

                    const doc  = sent.range.startContainer.ownerDocument;
                    const norm = t => t.replace(/\s+/g, ' ').trim();
                    const bounds = [0, ...cuts, words.length];
                    const pieces = [];
                    for (let k = 0; k < bounds.length - 1; k++) {
                        const r = doc.createRange();
                        r.setStart(words[bounds[k]].range.startContainer,
                                   words[bounds[k]].range.startOffset);
                        r.setEnd(words[bounds[k + 1] - 1].range.endContainer,
                                 words[bounds[k + 1] - 1].range.endOffset);
                        const text = norm(r.toString());
                        if (text.length < 1) continue;
                        // wasMerged=true → подсветка берёт наш range напрямую (не setMark),
                        // потому что s.name у foliate-js знает только исходное предложение.
                        pieces.push({ name: sent.name, text, range: r, wasMerged: true });
                    }
                    if (pieces.length > 1) {
                        log(' Диалог разбит на ' + pieces.length + ' частей: "' +
                            sent.text.substring(0, 50) + '"', 'tts');
                        out.push(...pieces);
                    } else {
                        out.push(sent);
                    }
                } catch (e) {
                    log(' splitDialogueSentences: ' + e.message, 'warn');
                    out.push(sent);
                }
            }
            return out;
        }

        function loadSentencesFromBlock() {
            _clearWordHighlightSchedule();
            if (!view.tts) return false;
            const ranges = view.tts.getRanges();
            if (!ranges?.size) return false;
            const rawSentences = [];
            for (const [name, range] of ranges) {
                const text = range.toString().replace(/\s+/g, ' ').trim();
                if (text.length < 1) continue;
                rawSentences.push({ name, text, range });
            }
            // ttsSentences всегда хранит ПРЕДЛОЖЕНИЯ.
            // Разбивка на слова для подсветки происходит отдельно,
            // через ttsHighlightWordsInRange() по таймингам от TTS-движка.
            // Перед сохранением склеиваем ложные разрывы на инициалах
            // (см. mergeInitialSplits) — иначе подсветка обрывается на
            // "Фамилия И." или показывает второй инициал отдельным куском,
            // хотя сама озвучка идёт без паузы на этом месте.
            ttsSentences = splitDialogueSentences(mergeInitialSplits(rawSentences));
            ttsSentenceIndex = 0;
            if (ttsSentences.length > 0) {
                log(' Блок: ' + ttsSentences.length + ' предложений', 'tts');
                log(' Первое: ' + ttsSentences[0].text.substring(0, 100), 'tts');
            } else {
                log(' Блок пуст!', 'warn');
            }
            return ttsSentences.length > 0;
        }

        // Убеждаемся, что range виден (для paginated режима — листаем если нужно)
        // Границы текущей видимой страницы в АБСОЛЮТНЫХ координатах контента
        // (renderer.start = правая граница, renderer.size = ширина одной страницы).
        // range.getClientRects() внутри iframe уже возвращает эти же координаты —
        // iframe сам не скроллится, скроллится внешний #container — поэтому здесь
        // и во всех трёх функциях ниже сравнение идёт напрямую, без каких-либо
        // пересчётов через frameElement/frameLeft.
        function _pageBounds() {
            const r = view?.renderer;
            const size = r?.size ?? 0;
            if (!r || !size) return null;
            return { left: Math.max(0, r.start - size), right: r.start };
        }

        // Определяет: находится ли range на ТЕКУЩЕЙ видимой странице (без листания)?
        //
        // ИСПРАВЛЕНО: range.getClientRects() внутри iframe-документа уже возвращает
        // АБСОЛЮТНЫЕ координаты контента (iframe сам не скроллится — скроллится
        // внешний #container) — тот же принцип, что в getFirstVisibleRange()/
        // getPreciseVisibleStartRange(). Пересчёт через frameElement.getBoundingClientRect()
        // был лишним и ошибочным: смещение frameLeft «плавает» от текущего скролла
        // #container, поэтому сравнение "плавало" вместе с ним и детект срабатывал
        // на 1-2 строки раньше/позже. Теперь — прямое сравнение с границами
        // страницы через _pageBounds(), без какого-либо пересчёта систем координат.
        function isRangeOnCurrentPage(range) {
            try {
                if (!range) return false;
                const bounds = _pageBounds();
                if (!bounds) return false;

                const rects = Array.from(range.getClientRects()).filter(r => r.width > 0);
                if (!rects.length) return false;

                // Достаточно, чтобы ХОТЯ БЫ один rect (обычно начало предложения)
                // лежал в границах текущей страницы.
                return rects.some(r => r.left >= bounds.left && r.left < bounds.right);
            } catch(e) {
                return false;
            }
        }

        async function ensureRangeVisible(range) {
            // Используем renderer.scrollToAnchor — именно так делает foliate-js TTS.
            // Он вычисляет Math.floor(rect.left / pageSize) и прыгает прямо на нужную
            // страницу, даже если она несколько страниц вперёд. view.next() делал
            // только один шаг, что ломало перелистывание в длинных главах.
            //
            // ИСПРАВЛЕНО: раньше вызывался безусловно для КАЖДОГО предложения, в том
            // числе уже видимого на текущей странице — из-за этого renderer дёргался
            // (relocate вперёд-назад) даже когда листать было не нужно, потому что
            // scrollToAnchor всё равно проделывал полный пересчёт/скролл к anchor.
            // Пока предложение читается на текущей видимой странице — вообще не
            // трогаем позицию скролла, только подсвечиваем. Листание должно
            // происходить ОДИН раз и только через явный переход между траншами
            // разрывного предложения (см. window.ttsNext) или через turnPageTTS().
            if (!range || !view?.renderer) return;
            if (isRangeOnCurrentPage(range)) {
                log(' ensureRangeVisible: range уже на текущей странице — скролл не нужен', 'tts');
                return;
            }
            try {
                await view.renderer.scrollToAnchor(range);
            } catch(e) {
                log(' scrollToAnchor: ' + e.message, 'warn');
            }
        }

        // ==================== TTS ====================

        /**
         * Расширяет range вправо до ближайшего знака пунктуации (. ! ? : ;)
         * или до конца текстового узла, если знак не найден.
         *
         * Проблема: пользователь выделяет "Пролог" без точки, но в DOM текст "Пролог."
         * view.tts.from(range) не находит точного совпадения → позиционируется неверно.
         */
        function extendRangeToPunctuation(range) {
            // Дотягивает range до знака завершения предложения — но только если
            // знак находится в пределах 5 символов. Это нужно для заголовков типа
            // "Пролог." где пользователь выделил "Пролог" без точки.
            // Если знак далеко — возвращаем range как есть, чтобы не перепрыгнуть
            // на следующее предложение (диалоги, короткие фразы без знаков).
            try {
                const node = range.endContainer;
                if (node.nodeType !== Node.TEXT_NODE) return range;
                const text = node.textContent;
                let pos = range.endOffset;
                // Уже захватывает знак пунктуации — ничего не делаем
                if (pos > 0 && /[.!?:;…]/.test(text[pos - 1])) return range;
                // Ищем знак пунктуации только в пределах 5 символов
                const limit = Math.min(pos + 5, text.length);
                let found = -1;
                for (let i = pos; i < limit; i++) {
                    if (/[.!?:;…]/.test(text[i])) { found = i; break; }
                }
                if (found === -1) return range;  // знак не найден рядом — не расширяем
                const ext = range.cloneRange();
                ext.setEnd(node, found + 1);
                return ext;
            } catch(e) {
                return range;
            }
        }


        // Получить первый видимый Range на экране (для старта с текущей страницы)
        function getFirstVisibleRange() {
            // Тот же подход что у speakFromHere: создаём Range из реального DOM-узла,
            // затем вызываем view.tts.from(range).
            //
            // Координатная система (из isOnNextPage):
            //   Текущая страница N: rect.left ∈ [renderer.start - renderer.size, renderer.start)
            //   Следующая страница: rect.left >= renderer.start
            //   renderer.start = N * columnWidth (абсолютные координаты контента)
            //
            // Алгоритм: собираем ВСЕ текстовые узлы на текущей странице,
            // сортируем по (rect.top, rect.left), берём самый первый.
            try {
                const contents = view?.renderer?.getContents?.();
                if (!contents?.length) return null;
                const doc = contents[0].doc;
                if (!doc?.body) return null;

                const pageEnd   = view?.renderer?.start ?? 0;   // правый край текущей страницы (= renderer.start)
                const pageWidth = view?.renderer?.size  ?? 0;   // ширина одной колонки

                const candidates = [];
                const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
                let node;
                while ((node = walker.nextNode())) {
                    const text = node.textContent.trim();
                    if (!text) continue;
                    const range = doc.createRange();
                    range.setStart(node, 0);
                    range.setEnd(node, Math.min(1, node.length));
                    const rect = range.getBoundingClientRect();
                    if (!rect || rect.width === 0 || rect.height === 0) continue;
                    if (rect.top < 0) continue;

                    let onCurrentPage;
                    if (pageWidth > 0) {
                        onCurrentPage = rect.left < (pageEnd || pageWidth) &&
                                        rect.left >= Math.max(0, (pageEnd || pageWidth) - pageWidth);
                    } else {
                        onCurrentPage = rect.top < window.innerHeight;
                    }

                    if (onCurrentPage) {
                        candidates.push({ node, top: rect.top, left: rect.left });
                    }
                }

                if (!candidates.length) return null;

                candidates.sort((a, b) => a.top !== b.top ? a.top - b.top : a.left - b.left);

                // Берём первый кандидат
                let best = candidates[0];
                
                // ПРОВЕРКА: если текст начинается со строчной буквы - это продолжение
                // предыдущего предложения, ищем следующее с заглавной
                const bestText = best.node.textContent.trim();
                if (bestText.length > 0 && /^[а-яa-z]/.test(bestText)) {
                    log(`ℹ Текст начинается с маленькой: "${bestText.substring(0,30)}...", ищем дальше`, 'tts');
                    const nextBest = candidates.find(c => {
                        const text = c.node.textContent.trim();
                        return text.length > 0 && /^[А-ЯA-Z]/.test(text);
                    });
                    if (nextBest) {
                        best = nextBest;
                        log(` Нашли с заглавной: top=${best.top}`, 'tts');
                    }
                }
                
                const range = doc.createRange();
                range.setStart(best.node, 0);
                range.setEnd(best.node, best.node.length);
                log(` getFirstVisibleRange: top=${Math.round(best.top)} left=${Math.round(best.left)} pageEnd=${pageEnd} pageWidth=${pageWidth} text="${best.node.textContent.trim().substring(0,40)}"`, 'tts');
                return range;
            } catch(e) {
                log(' getFirstVisibleRange: ' + e.message, 'warn');
            }
            return null;
        }

        // ── Определяет начало ЛЕВОЙ страницы разворота ──────────────────────────
        //
        // Проблема: foliate-js разбивает текст на ЛОГИЧЕСКИЕ блоки (параграфы).
        // tts.from(range) находит блок по range — но блок мог начаться на
        // предыдущей (правой) странице и продолжиться на текущей левой.
        // В таком случае TTS начнёт с предыдущей страницы.
        //
        // Решение: искать первый БЛОЧНЫЙ ЭЛЕМЕНТ (p, div, section и т.п.),
        // чьё НАЧАЛО (первый символ) находится на текущей левой странице.
        // Тогда tts.from() попадёт именно в этот блок и начнёт с его начала —
        // что уже visually на левой странице.
        //
        // Граница левой страницы в экранных координатах:
        //   left:  frameRect.left
        //   right: frameRect.left + oneColumnWidth
        function getLeftPageStartRange(renderer) {
            // renderer.start = scrollLeft iframe (сколько пикселей прокручено).
            // renderer.size  = ширина одной страницы (видимой области).
            // Левая колонка в координатах iframe начинается на renderer.start.
            // Сканируем сверху вниз через caretPositionFromPoint(x, y) где
            // x = renderer.start + небольшой отступ от левого края колонки.
            try {
                const contents = renderer?.getContents?.();
                if (!contents?.length) return null;
                const doc = contents[0].doc;
                if (!doc?.body) return null;

                const scrollStart = renderer.start ?? 0;
                const x = scrollStart + 6; // отступ от левого края колонки

                const stepY = 6;
                // Раньше сканировали только первые 400px — на страницах с высоким
                // отступом сверху, крупным заголовком, буквицей или картинкой это
                // пропускало настоящую первую строку и TTS стартовал с более
                // позднего блока (визуально выглядело как "перескок" вниз страницы).
                // Теперь сканируем всю видимую высоту страницы.
                const maxY = doc.defaultView?.innerHeight ?? window.innerHeight ?? 800;

                for (let y = stepY; y < maxY; y += stepY) {
                    let node = null, offset = 0;

                    if (doc.caretPositionFromPoint) {
                        const pos = doc.caretPositionFromPoint(x, y);
                        if (pos?.offsetNode?.nodeType === Node.TEXT_NODE) {
                            node = pos.offsetNode;
                            offset = pos.offset;
                        }
                    }
                    if (!node && doc.caretRangeFromPoint) {
                        const r = doc.caretRangeFromPoint(x, y);
                        if (r?.startContainer?.nodeType === Node.TEXT_NODE) {
                            node = r.startContainer;
                            offset = r.startOffset;
                        }
                    }

                    if (!node || !node.textContent?.trim()) continue;

                    // Пропускаем служебные элементы foliate
                    let parent = node.parentElement;
                    let isService = false;
                    while (parent && parent !== doc.body) {
                        if (parent.classList?.contains('foliate-overlay') ||
                            parent.classList?.contains('foliate-footnote') ||
                            parent.tagName?.toLowerCase() === 'script' ||
                            parent.tagName?.toLowerCase() === 'style') {
                            isService = true; break;
                        }
                        parent = parent.parentElement;
                    }
                    if (isService) continue;

                    const range = doc.createRange();
                    range.setStart(node, offset);
                    range.setEnd(node, Math.min(offset + 1, node.length));

                    log(` getLeftPageStartRange: x=${Math.round(x)} y=${y}` +
                        ` scrollStart=${Math.round(scrollStart)}` +
                        ` text="${node.textContent.trim().substring(0, 40)}"` +
                        ` offset=${offset}`, 'tts');
                    return range;
                }

                log(' getLeftPageStartRange: не нашёл текст через caretPositionFromPoint', 'warn');
                return null;
            } catch (e) {
                log(' getLeftPageStartRange: ' + e.message, 'warn');
                return null;
            }
        }

        // Проверяет, находится ли range на видимой ЛЕВОЙ странице разворота.
        // Используется в ghost-режиме для поиска первого предложения на левой странице.
        function isOnVisibleLeftPage(range) {
            try {
                if (!range) return false;
                const rect = range.getBoundingClientRect();
                if (!rect || rect.width === 0 || rect.height === 0) return false;
                // Небольшой допуск (2px), чтобы не отбрасывать первую/последнюю строку
                // из-за долей пикселя межстрочного интервала — раньше это могло
                // приводить к пропуску верной стартовой строки и "перескоку" вниз.
                const TOLERANCE = 2;
                if (rect.top < -TOLERANCE || rect.bottom > window.innerHeight + TOLERANCE) return false;

                const renderer = view?.renderer;
                const totalSize = renderer?.size ?? window.innerWidth;
                const paginatorEl = document.querySelector('foliate-paginator');
                let columnCount = 1;
                if (paginatorEl) {
                    const cs = getComputedStyle(paginatorEl);
                    const cc = parseInt(cs.getPropertyValue('--_max-column-count-spread'));
                    if (cc >= 1) columnCount = cc;
                }
                const oneColumnWidth = totalSize / columnCount;

                const contents = renderer?.getContents?.();
                const frameEl = contents?.[0]?.doc?.defaultView?.frameElement;
                const frameRect = frameEl ? frameEl.getBoundingClientRect() : { left: 0 };

                const leftEdge  = frameRect.left;
                const rightEdge = frameRect.left + oneColumnWidth;
                const charCenter = rect.left + rect.width / 2;

                return charCenter >= leftEdge && charCenter < rightEdge;
            } catch(e) {
                return false;
            }
        }

        // Получает range с первого реально видимого символа текста на текущей странице разворота
        // Использует binary search по символам текстового узла для точного определения позиции
        function getPreciseVisibleStartRange(renderer) {
            try {
                // Получаем документ текущей секции из renderer
                const contents = renderer?.getContents?.();
                if (!contents?.length) {
                    log(' getPreciseVisibleStartRange: нет содержимого renderer', 'warn');
                    return null;
                }

                const doc = contents[0].doc;
                if (!doc?.body) {
                    log(' getPreciseVisibleStartRange: нет doc.body', 'warn');
                    return null;
                }

                // Получаем параметры видимой области от renderer
                const pageEnd = renderer.start ?? 0;       // правый край текущей страницы
                const pageWidth = renderer.size ?? 0;      // ширина одной страницы
                const viewportHeight = window.innerHeight; // высота viewport

                // Вычисляем границы текущей страницы для spread-режима
                const pageLeft = pageWidth > 0 ? Math.max(0, pageEnd - pageWidth) : 0;
                const pageRight = pageEnd || pageWidth;

                // Создаём TreeWalker только по текстовым узлам тела документа
                const walker = doc.createTreeWalker(
                    doc.body,
                    NodeFilter.SHOW_TEXT,
                    {
                        acceptNode: (node) => {
                            // Пропускаем пустые узлы
                            const text = node.textContent;
                            if (!text || text.trim().length === 0) return NodeFilter.FILTER_REJECT;

                            // Пропускаем узлы в script, style, noscript, overlay, footnotes
                            let parent = node.parentElement;
                            while (parent && parent !== doc.body) {
                                const tagName = parent.tagName.toLowerCase();
                                if (tagName === 'script' || tagName === 'style' || tagName === 'noscript') {
                                    return NodeFilter.FILTER_REJECT;
                                }
                                // Пропускаем overlay и footnotes от foliate
                                if (parent.classList?.contains('foliate-overlay') ||
                                    parent.classList?.contains('foliate-footnote') ||
                                    parent.classList?.contains('footnote') ||
                                    parent.classList?.contains('overlay')) {
                                    return NodeFilter.FILTER_REJECT;
                                }
                                // Пропускаем скрытые элементы — реклама пиратских сайтов
                                try {
                                    const cs = doc.defaultView.getComputedStyle(parent);
                                    if (cs.display === 'none' ||
                                        cs.visibility === 'hidden' ||
                                        cs.visibility === 'collapse' ||
                                        parseFloat(cs.opacity) < 0.01 ||
                                        parseFloat(cs.fontSize) < 1) {
                                        return NodeFilter.FILTER_REJECT;
                                    }
                                } catch(_) {}
                                parent = parent.parentElement;
                            }

                            return NodeFilter.FILTER_ACCEPT;
                        }
                    }
                );

                // Собираем кандидаты: первый видимый символ каждого узла
                const symbolCandidates = [];

                for (let node = walker.nextNode(); node; node = walker.nextNode()) {
                    const text = node.textContent;
                    if (!text || text.length === 0) continue;

                    // Проверяем, есть ли у узла видимые rect на текущей странице
                    const parentRects = node.parentElement?.getClientRects?.();
                    if (!parentRects || parentRects.length === 0) continue;

                    // Проходим по всем rect узла и ищем первый видимый на текущей странице
                    let firstVisibleSymbolIndex = -1;
                    let firstVisibleRect = null;

                    // Binary search: находим первый видимый символ в узле
                    const result = findFirstVisibleSymbol(doc, node, text, pageLeft, pageRight, viewportHeight);
                    if (result) {
                        firstVisibleSymbolIndex = result.index;
                        firstVisibleRect = result.rect;
                    }

                    if (firstVisibleSymbolIndex >= 0 && firstVisibleRect) {
                        symbolCandidates.push({
                            node,
                            index: firstVisibleSymbolIndex,
                            top: firstVisibleRect.top,
                            left: firstVisibleRect.left,
                            text: text.substring(firstVisibleSymbolIndex, Math.min(firstVisibleSymbolIndex + 50, text.length))
                        });
                    }
                }

                if (!symbolCandidates.length) {
                    log(' getPreciseVisibleStartRange: нет видимых символов на странице', 'warn');
                    return null;
                }

                // Сортируем по (top, left) — сначала верхние, потом левые
                symbolCandidates.sort((a, b) => {
                    const topDiff = a.top - b.top;
                    if (Math.abs(topDiff) > 3) return topDiff; // разница по вертикали > 3px
                    return a.left - b.left; // разница по горизонтали
                });

                // Берём первый (самый верхний-левый) видимый символ
                const best = symbolCandidates[0];
                const range = doc.createRange();
                range.setStart(best.node, best.index);
                range.setEnd(best.node, Math.min(best.index + 10, best.node.length));

                log(` getPreciseVisibleStartRange: символ #${best.index} top=${Math.round(best.top)} left=${Math.round(best.left)} "${best.text}..."`, 'tts');
                return range;

            } catch (e) {
                log(' getPreciseVisibleStartRange: ' + e.message, 'warn');
                return null;
            }
        }

        // Binary search: находит первый видимый символ в текстовом узле
        // Возвращает { index, rect } или null
        function findFirstVisibleSymbol(doc, node, text, pageLeft, pageRight, viewportHeight) {
            const textLength = text.length;
            if (textLength === 0) return null;

            // Проверяем весь узел целиком - если ни один rect не виден, пропускаем узел
            const fullRange = doc.createRange();
            fullRange.selectNodeContents(node);
            const allRects = fullRange.getClientRects();
            if (!allRects || allRects.length === 0) return null;

            // Проверяем, есть ли вообще видимые rect на текущей странице
            let hasVisible = false;
            for (let i = 0; i < allRects.length; i++) {
                const rect = allRects[i];
                if (rect.width === 0 || rect.height === 0) continue;
                if (rect.left >= pageLeft - 10 && rect.left < pageRight &&
                    rect.top >= 0 && rect.bottom <= viewportHeight) {
                    hasVisible = true;
                    break;
                }
            }
            if (!hasVisible) return null;

            // Binary search по символам
            let low = 0;
            let high = textLength - 1;
            let foundIndex = -1;
            let foundRect = null;

            while (low <= high) {
                const mid = Math.floor((low + high) / 2);

                // Создаём range для одного символа
                const range = doc.createRange();
                range.setStart(node, mid);
                range.setEnd(node, Math.min(mid + 1, textLength));

                const rects = range.getClientRects();
                if (!rects || rects.length === 0) {
                    low = mid + 1;
                    continue;
                }

                const rect = rects[0];
                if (rect.width === 0 || rect.height === 0) {
                    low = mid + 1;
                    continue;
                }

                // Проверяем, виден ли символ на текущей странице
                const isVisible = (
                    rect.left >= pageLeft - 10 &&
                    rect.left < pageRight &&
                    rect.top >= 0 &&
                    rect.bottom <= viewportHeight
                );

                if (isVisible) {
                    foundIndex = mid;
                    foundRect = rect;
                    // Пробуем найти ещё раньше (левее/выше)
                    high = mid - 1;
                } else {
                    // Символ не виден - проверяем, где он находится
                    // Если rect выше или левее видимой области - идём вперёд
                    if (rect.top < 0 || (rect.left < pageLeft - 10 && rect.top < viewportHeight)) {
                        low = mid + 1;
                    }
                    // Если rect ниже или правее видимой области - идём назад
                    else if (rect.bottom > viewportHeight || rect.left >= pageRight) {
                        high = mid - 1;
                    }
                    else {
                        low = mid + 1;
                    }
                }
            }

            if (foundIndex >= 0 && foundRect) {
                return { index: foundIndex, rect: foundRect };
            }

            return null;
        }

        // Функция коррекции визуального позиционирования для spread-режима
        // Гарантирует, что при старте TTS пользователь видит левую страницу разворота
        // Если текущая страница правая (нечётный индекс), переходим на левую (чётный индекс)
        async function ensureVisualLeftStart() {
            try {
                const renderer = view?.renderer;
                if (!renderer) return false;
                
                // Получаем текущий индекс страницы (0-based)
                const currentPage = renderer.page;
                if (currentPage === undefined || currentPage === null) return false;
                
                // Получаем общее количество страниц
                const pages = renderer.pages;
                if (!pages || pages < 2) return false; // Не spread-режим
                
                // page=0 — первая страница (левая), page=1 — вторая (правая) и т.д.
                // Если текущая страница нечётная (правая на развороте),
                // переходим на предыдущую (левую)
                if (currentPage % 2 === 1) {
                    log(` ensureVisualLeftStart: страница ${currentPage} (правая), переходим на предыдущую`, 'tts');
                    await renderer.prev();
                    // Даём время на завершение анимации и перерисовку
                    await new Promise(resolve => setTimeout(resolve, 150));
                    log(` ensureVisualLeftStart: переход завершён`, 'tts');
                    return true;
                }
                
                log(` ensureVisualLeftStart: страница ${currentPage} уже левая`, 'tts');
                return false;
            } catch (e) {
                log(' ensureVisualLeftStart: ' + e.message, 'warn');
                return false;
            }
        }

        async function startTTS() {
            if (!currentVoice) {
                log(L(' Сначала выберите голос', ' Please select a voice first'), 'warn');
                return;
            }
            if (!bookReady) {
                log(L(' Книга ещё не готова, TTS отложен', ' Book not ready, TTS deferred'), 'tts');
                pendingTTSStart = true;
                return;
            }
            if (currentEngine === 'Piper') {
                const voice = VOICES['Piper']?.find(v => v.id === currentVoice);
                if (!voice?.available) {
                    log(L(' Голос Piper не установлен', ' Piper voice not installed'), 'warn');
                    return;
                }
            }

            // ── Продолжение с паузы ──
            if (ttsPaused && ttsSentences.length > 0 && ttsSentenceIndex < ttsSentences.length) {
                log(L('▶ Продолжаем с паузы (предл. ', '▶ Resuming from pause (sent. ') + + (ttsSentenceIndex+1) + '/' + ttsSentences.length + ')', 'tts');
                resumeTTS();
                return;
            }

            // ── Новый старт ──
            ttsPaused = false;
            ttsActive = true; ttsStarting = true; setTimeout(() => { ttsStarting = false; }, 500);
            ttsPageTurning = false;
            ttsStarting = true; setTimeout(() => { ttsStarting = false; }, 500);
            ttsGlobalRepeatCount = 0;
            ttsLastGlobalText = '';
            ttsLastBlockSignature = '';
            updateTTSButtons();
            document.getElementById('ttsControls').classList.add('visible');

            try {
                if (!await initTTSForCurrentDoc()) {
                    if (isCurrentDocAdSection()) {
                        log(' Старт TTS на рекламной секции — пропускаем', 'info');
                        setTimeout(() => { if (ttsActive) window.ttsNext(); }, 100);
                        return;
                    }
                    log(' initTTSForCurrentDoc вернул false', 'error');
                    ttsActive = false;
                    updateTTSButtons();
                    return;
                }

                // ── Призрачный режим (ghost mode) ────────────────────────────────────
                // Проблема: tts.from(range) позиционируется на БЛОК, содержащий range.
                // Блок мог начаться на предыдущей (правой) странице — TTS стартует с неё.
                //
                // Решение (без визуального моргания):
                //   1. Находим примерную стартовую позицию через getLeftPageStartRange()
                //   2. В ghost-режиме ttsHighlight — пустышка, TTS не воспроизводится
                //   3. Вызываем tts.from() → загружаем предложения блока
                //   4. Ищем в предложениях то, что реально находится на левой странице
                //   5. Выключаем ghost-режим, устанавливаем ttsSentenceIndex и стартуем

                const renderer = view?.renderer;
                const isFirstPageOfSection = (renderer?.page ?? -1) === 0;

                if (isFirstPageOfSection) {
                    // Первая страница секции — tts.start() надёжнее (нет предыдущего блока)
                    log(L(' Первая страница → tts.start()', ' First page → tts.start()'), 'tts');
                    const ssml = view.tts.start();
                    if (!ssml) {
                        log(' Нет содержимого', 'warn');
                        ttsActive = false; updateTTSButtons(); return;
                    }
                    log(' SSML length: ' + ssml.length, 'tts');
                    if (loadSentencesFromBlock() && ttsSentences.length > 0) {
                        ttsLastBlockSignature = blockSignature();
                        await speakCurrentSentence();
                    } else {
                        await advanceToNextSentence();
                    }
                } else {
                    // Не первая страница — используем ghost-режим для точного позиционирования.
                    // getPreciseVisibleStartRange() делает точный геометрический обход всех
                    // текстовых узлов (binary search по символам) и надёжнее находит настоящую
                    // первую видимую строку, чем getLeftPageStartRange(), который сканирует
                    // фиксированную x-координату и раньше вызывал перескок на страницах
                    // с высокими заголовками/буквицами/картинками сверху. Используем его первым,
                    // старый метод — как резервный вариант.
                    let startRange = getPreciseVisibleStartRange(renderer);
                    if (!startRange) startRange = getLeftPageStartRange(renderer);
                    if (!startRange) startRange = getFirstVisibleRange();

                    if (!startRange) {
                        // Совсем нет диапазона — обычный старт
                        log(' Нет startRange, tts.start()', 'tts');
                        const ssml = view.tts.start();
                        if (ssml && loadSentencesFromBlock()) {
                            ttsLastBlockSignature = blockSignature();
                            await speakCurrentSentence();
                        } else {
                            await advanceToNextSentence();
                        }
                        return; // важно: выходим из try-блока
                    }

                    log(L(' Ghost mode: позиционируемся без звука/подсветки', ' Ghost mode: positioning silently'), 'tts');

                    // Включаем ghost-режим: подменяем ttsHighlight пустышкой
                    ttsGhostMode = true;
                    const realHighlight = ttsHighlight;
                    const ghostHighlight = () => {};  // ничего не рисует

                    try {
                        // Пересоздаём TTS с ghost-подсветкой
                        view.tts = null;
                        await view.initTTS('sentence', ghostHighlight);
                        if (!view.tts) throw new Error('initTTS вернул null в ghost-режиме');

                        // Позиционируем на блок который содержит startRange
                        const rangeExt = extendRangeToPunctuation(startRange);
                        let ssml = view.tts.from(rangeExt) || view.tts.from(startRange);
                        if (!ssml) ssml = view.tts.start();

                        log(' Ghost SSML length: ' + (ssml?.length ?? 'null'), 'tts');

                        if (!ssml || !loadSentencesFromBlock()) {
                            throw new Error('ghost: нет предложений');
                        }

                        log(' Ghost блок: ' + ttsSentences.length + ' предл., ищем левую страницу', 'tts');

                        // Ищем первое предложение на левой странице — начинаем с начала блока
                        let foundIndex = -1;
                        for (let i = 0; i < ttsSentences.length; i++) {
                            const s = ttsSentences[i];
                            if (s.range && isOnVisibleLeftPage(s.range)) {
                                foundIndex = i;
                                log(' Ghost: найдено предл. #' + i + ' на левой стр.: "' +
                                    s.text.substring(0, 50) + '"', 'tts');
                                break;
                            }
                        }

                        // Если в текущем блоке ничего не на левой — пробуем следующий блок
                        if (foundIndex === -1) {
                            log(' Ghost: в блоке нет предл. на левой стр., пробуем следующий', 'tts');
                            const nextSsml = view.tts.next();
                            if (nextSsml && loadSentencesFromBlock()) {
                                for (let i = 0; i < ttsSentences.length; i++) {
                                    const s = ttsSentences[i];
                                    if (s.range && isOnVisibleLeftPage(s.range)) {
                                        foundIndex = i;
                                        log(' Ghost: следующий блок, предл. #' + i + ': "' +
                                            s.text.substring(0, 50) + '"', 'tts');
                                        break;
                                    }
                                }
                            }
                        }

                        // Выключаем ghost-режим
                        ttsGhostMode = false;

                        // Пересоздаём TTS с реальной подсветкой
                        const ghostSentences = [...ttsSentences];
                        const ghostIndex = foundIndex >= 0 ? foundIndex : 0;

                        view.tts = null;
                        await view.initTTS('sentence', realHighlight);
                        if (!view.tts) throw new Error('initTTS вернул null после ghost');

                        // Позиционируем на то же место — стартуем с найденного предложения
                        const targetSentence = ghostSentences[ghostIndex];
                        let finalSsml;
                        if (targetSentence?.range) {
                            finalSsml = view.tts.from(targetSentence.range)
                                     || view.tts.from(startRange);
                        } else {
                            finalSsml = view.tts.from(startRange);
                        }
                        if (!finalSsml) finalSsml = view.tts.start();

                        log(' Final SSML length: ' + (finalSsml?.length ?? 'null'), 'tts');

                        if (!finalSsml || !loadSentencesFromBlock()) {
                            throw new Error('ghost: нет предложений после пересоздания');
                        }

                        // Устанавливаем индекс на найденное предложение
                        // Ищем совпадение по тексту в новом блоке
                        if (ghostIndex > 0 && targetSentence) {
                            const targetText = targetSentence.text.trim();
                            const matchIdx = ttsSentences.findIndex(
                                s => s.text.trim() === targetText ||
                                     s.text.trim().startsWith(targetText.substring(0, 30)));
                            if (matchIdx >= 0) {
                                ttsSentenceIndex = matchIdx;
                                log(' Ghost: стартуем с предл. #' + matchIdx + ': "' +
                                    ttsSentences[matchIdx].text.substring(0, 50) + '"', 'tts');
                            }
                        }

                        ttsLastBlockSignature = blockSignature();
                        await speakCurrentSentence();

                    } catch(ghostErr) {
                        log(' Ghost mode ошибка: ' + ghostErr.message + ', обычный старт', 'tts');
                        ttsGhostMode = false;

                        // Fallback: обычный старт
                        view.tts = null;
                        await view.initTTS('sentence', realHighlight);
                        if (!view.tts) { ttsActive = false; updateTTSButtons(); return; }

                        const rangeExt = extendRangeToPunctuation(startRange);
                        const ssml = view.tts.from(rangeExt) || view.tts.from(startRange)
                                  || view.tts.start();
                        if (!ssml || !loadSentencesFromBlock()) {
                            await advanceToNextSentence();
                        } else {
                            ttsLastBlockSignature = blockSignature();
                            await speakCurrentSentence();
                        }
                    }
                }
            } catch(e) {
                log(' startTTS: ' + e.message, 'error');
                ttsActive = false;
                updateTTSButtons();
            }
        }

        // Пауза — сохраняет подсветку и позицию, можно продолжить
        function pauseTTS() {
            ttsActive = false;
            ttsPaused = true;
            if (ttsWordHighlightTimer) { clearTimeout(ttsWordHighlightTimer); ttsWordHighlightTimer = null; }
            if (ttsSplitFlipTimer !== null) { clearTimeout(ttsSplitFlipTimer); ttsSplitFlipTimer = null; }
            // Скрываем кнопку "Показать панель" на паузе
            updateTTSButtons();
            if (bridge) bridge.pauseTTS();
            // НЕ очищаем подсветку — показываем где остановились
            log(' Пауза — подсветка сохранена', 'tts');
        }

        // Продолжение с паузы — повторяет текущую фразу
        function resumeTTS() {
            if (!ttsPaused) return;
            
            // Проверяем, есть ли сохранённые предложения
            if (ttsSentences.length > 0 && ttsSentenceIndex < ttsSentences.length) {
                log('▶ Повторяем предл. ' + (ttsSentenceIndex+1) + '/' + ttsSentences.length, 'tts');
                ttsPaused = false;
                ttsActive = true; ttsStarting = true; setTimeout(() => { ttsStarting = false; }, 500);
                ttsPageTurning = false;
                updateTTSButtons();
                document.getElementById('ttsControls').classList.add('visible');
                // Повторяем текущую фразу (не переходим к следующей!)
                speakCurrentSentence();
            } else {
                // Если предложений нет, начинаем заново
                log('▶ Начинаем заново', 'tts');
                startTTS();
            }
        }

        // Нативный TTS может вернуть ERROR (например, движок ещё инициализируется
        // или временно не смог открыть аудиомаршрут). Без этого обработчика JS
        // оставался в ttsActive=true и выглядел как «зависший» TTS без звука.
        window.onTTSError = function(message) {
            log(' Android TTS: ' + (message || 'неизвестная ошибка'), 'error');
            ttsActive = false;
            ttsPaused = false;
            ttsStarting = false;
            ttsPageTurning = false;
            updateTTSButtons();
            clearTTSHighlight();
        };

        // Полная остановка — сбрасывает всё состояние
        function stopTTSFull() {
            _clearWordHighlightSchedule();
            ttsActive = false;
            ttsPaused = false;
            ttsSentences = [];
            ttsSentenceIndex = 0;
            ttsPageTurning = false;
            // Сбрасываем "отпечаток" последнего озвученного блока — иначе при
            // повторном запуске TTS (Stop → Play) сигнатура первого блока новой
            // сессии может случайно совпасть с сигнатурой, оставшейся от конца
            // ПРЕДЫДУЩЕЙ сессии, и защита от дублей (см. blockSignature()) ложно
            // сочтёт этот блок повтором и пропустит его целиком.
            ttsLastBlockSignature = '';
            if (ttsSplitFlipTimer !== null) { clearTimeout(ttsSplitFlipTimer); ttsSplitFlipTimer = null; }
            if (bridge) bridge.stopTTS();
            clearTTSHighlight();
            // Показываем кнопку возврата только если пользователь вручную листал
            if (lastTtsCfi && ttsUserNavigated) {
                const btn = document.getElementById('returnToReadingBtn');
                if (btn) btn.style.display = '';
            }
            // Скрываем кнопки TTS из bottomNav и панель настроек
            document.getElementById('ttsControls').classList.remove('visible');
            document.getElementById('ttsSettingsPanel').classList.remove('visible');
            updateTTSButtons();
            flushSavePosition();
            log(' TTS остановлен', 'tts');
        }

        // Кнопка закрыть:
        // - Если TTS играет → сворачивает панель (но TTS продолжает), кнопка появится в настройках
        // - Если TTS на паузе/стоп → полная остановка и скрытие
        function closeTTSPanel() {
            // Кнопки TTS встроены в bottomNav — "сворачивать" нечего.
            // Крестик всегда означает полную остановку TTS.
            stopTTSFull();
        }

        // Озвучивает текущее предложение (ttsSentences[ttsSentenceIndex])
        // Разрез предложения по границе страницы («виртуальное тире»).
        // bounds — границы страницы, относительно которых считаем разрез: для
        // озвучиваемого предложения это текущая страница (_pageBounds()), а для
        // ПРЕДСКАЗАНИЯ у следующих предложений (см. _predictSpokenTexts) — страница,
        // на которой они начнутся. Возвращает { parts, partIndex } либо null,
        // если предложение не разорвано.
        function computeSplitParts(range, bounds) {
            const splitInfo = getSplitAcrossPageInfo(range, bounds);
            if (!splitInfo.isSplit) return null;
            const words  = splitSentenceIntoWords(range);
            let firstOnCurrent = -1;  // первое слово, видимое на текущей странице
            let firstOnNext    = -1;  // первое слово уже на следующей странице
            if (bounds) {
                for (let wi = 0; wi < words.length; wi++) {
                    const wRects = Array.from(words[wi].range.getClientRects()).filter(r => r.width > 0);
                    if (!wRects.length) continue;
                    if (firstOnCurrent < 0 && wRects[0].left >= bounds.left - 4 && wRects[0].left < bounds.right) firstOnCurrent = wi;
                    if (wRects[0].left >= bounds.right) { firstOnNext = wi; break; }
                }
            }
            const doc  = range.startContainer.ownerDocument;
            const norm = t => t.replace(/\s+/g, ' ').trim();
            const mkRange = (w0, w1) => {
                const r = doc.createRange();
                r.setStart(words[w0].range.startContainer, words[w0].range.startOffset);
                r.setEnd(words[w1].range.endContainer, words[w1].range.endOffset);
                return r;
            };
            const last = words.length - 1;
            const parts = [];
            let partIndex = 0;
            if (splitInfo.startsBefore && firstOnCurrent > 0) {
                // Предложение началось на предыдущей странице: часть 0 невидима,
                // стартуем с видимой половины (часть 1).
                parts.push({ text: norm(mkRange(0, firstOnCurrent - 1).toString()), range: mkRange(0, firstOnCurrent - 1) });
                const curEnd = firstOnNext > 0 ? firstOnNext - 1 : last;
                parts.push({ text: norm(mkRange(firstOnCurrent, curEnd).toString()), range: mkRange(firstOnCurrent, curEnd) });
                if (firstOnNext > 0) {
                    parts.push({ text: norm(mkRange(firstOnNext, last).toString()), range: mkRange(firstOnNext, last) });
                }
                partIndex = 1;   // ← старт с половины предложения
            } else if (firstOnNext > 0) {
                // Обычный случай: начало на текущей странице, хвост на следующей.
                parts.push({ text: norm(mkRange(0, firstOnNext - 1).toString()), range: mkRange(0, firstOnNext - 1) });
                parts.push({ text: norm(mkRange(firstOnNext, last).toString()), range: mkRange(firstOnNext, last) });
                partIndex = 0;
            }
            return parts.length > 1 ? { parts, partIndex } : null;
        }

        async function speakCurrentSentence() {
            if (!ttsActive || !ttsSentences.length) return;
            const s = ttsSentences[ttsSentenceIndex];

            // Пропускаем "* * *" — не озвучиваем, сразу переходим к следующему предложению
            if (/^[\s*\-–—_~]+$/.test(s.text.trim())) {
                log(' Пропуск "* * *"', 'tts');
                // Если это первое предложение в блоке (ttsSentenceIndex === 0),
                // то НЕ увеличиваем индекс - пусть advanceToNextSentence() сам перейдёт к следующему блоку
                if (ttsSentenceIndex === 0) {
                    log('ℹ "* * *" - первое в блоке, переходим к следующему блоку', 'tts');
                    await advanceToNextSentence();
                    return;
                }
                // Если не первое - просто пропускаем
                ttsSentenceIndex++;
                if (ttsSentenceIndex < ttsSentences.length) {
                    await speakCurrentSentence();
                } else {
                    await advanceToNextSentence();
                }
                return;
            }

            // Запоминаем текст — используется для пропуска дублей заголовков при смене секции
            ttsLastGlobalText = s.text;

            // ── «Виртуальное тире»: разрывное предложение — определяем ДО подсветки ──
            // Разбиваем на два транша (part1/part2), только если s.isSplitSentence ещё
            // не вычислялось для этого предложения (вычисляем один раз и кэшируем на s).
            if (s.isSplitSentence === undefined) {
                s.isSplitSentence = false;
                try {
                    const res = computeSplitParts(s.range, _pageBounds());
                    if (res) {
                        s.isSplitSentence = true;
                        s.parts = res.parts;
                        s.partIndex = res.partIndex;
                        log(` Виртуальное тире: частей=${res.parts.length}, старт с части ${res.partIndex + 1}`, 'tts');
                    }
                } catch(e) {
                    log(' Виртуальное тире: ошибка вычисления — ' + e.message, 'warn');
                }
            }

            // Активная часть: либо транш разрывного предложения, либо предложение целиком
            const activeRange = s.isSplitSentence ? s.parts[s.partIndex].range : s.range;
            const activeTextRaw = s.isSplitSentence ? s.parts[s.partIndex].text : s.text;
            // Сноски-цифры в тексте вида "слово[2]" или "24:7[2]" — это ссылка
            // на пояснение в конце книги, а не часть фразы; для TTS/записи
            // цифру сноски вырезаем, само слово перед ней озвучиваем как есть.
            const activeText = stripFootnoteMarkers(activeTextRaw);

            if (s.isSplitSentence || s.wasMerged) {
                // Прямая подсветка транша/склеенного предложения — НЕ setMark
                // (setMark работает с исходным s.name/диапазоном foliate-js,
                // который для склеенных инициалов/сносок короче, чем реальный
                // s.range после mergeInitialSplits — подсветка бы не дотягивала
                // до конца).
                _clearWordHighlightSchedule();
                try { ttsHighlight(activeRange.cloneRange()); } catch(e) {}
            } else if (!ttsWordMode) {
                try {
                    // setMark вызывает ttsHighlight(range) через callback, который рисует подсветку
                    view.tts.setMark(s.name);
                } catch(e) {
                    log(' setMark ошибка: ' + e.message, 'warn');
                    // Fallback: подсвечиваем напрямую
                    try { ttsHighlight(s.range.cloneRange()); } catch(e2) {}
                }
            } else {
                // Режим слов: ставим mark молча (для внутреннего состояния foliate-js),
                // подсветку первого слова делаем сразу, остальные — по приходу
                // window._ttsWordTimings() с точными метками от Edge TTS.
                try { view.tts.setMark(s.name); } catch(e) {}
                _clearWordHighlightSchedule();
                try {
                    const words = splitSentenceIntoWords(s.range);
                    if (words.length > 0) ttsHighlight(words[0].range);
                } catch(e) {}
            }
            // Убеждаемся, что подсвеченный текст виден
            // ttsSuppressScroll=true когда стартуем с кнопки "Читать с начала страницы" —
            // страница уже на месте, не нужно прыгать на физическое положение в потоке.
            if (ttsSuppressScroll) {
                ttsSuppressScroll = false; // сбрасываем после первого предложения
            } else if (!s.isSplitSentence) {
                // Для траншей разрывного предложения ensureRangeVisible не нужен —
                // part1 всегда на текущей странице по построению, а part2 показывается
                // уже ПОСЛЕ явного renderer.next() в window.ttsNext (см. ниже).
                try { await ensureRangeVisible(s.range); } catch(e) {}
            }
            log(' [' + (ttsSentenceIndex+1) + '/' + ttsSentences.length + '] ' + activeText.substring(0, 60), 'tts');
            if (bridge) {
    const correctedText = applyTtsCorrections(activeText);
    if (correctedText !== activeText) {
        log(' TTS коррекции: "' + activeText.substring(0, 60) + '" → "' + correctedText.substring(0, 60) + '"', 'tts');
    }
    log(' Текст: ' + correctedText.substring(0, 200), 'tts');
    sendTTSLookahead();
    bridge.onTTSText(correctedText);
} else {
    log(' bridge не определён!', 'error');
}
        }


        // Сколько предложений вперёд готовим. Диалоговые реплики короткие (1–2 с
        // звучания) — при запасе в 3 фразы синтез на медленном канале не успевал.
        const TTS_LOOKAHEAD_COUNT = 6;
        // Кэш уже обработанных (склейка инициалов + разбиение диалогов) следующих
        // блоков: ключ — массив ranges из view.tts.peekNextRanges() (он кэшируется).
        const _lookaheadBlockCache = new WeakMap();

        function _isDividerText(t) {
            return /^[\s*\-–—_~]+$/.test((t || '').trim());   // «* * *» не озвучиваем
        }

        // Предложения следующего блока ровно в том виде, в каком их потом получит
        // ttsSentences (loadSentencesFromBlock) — иначе кэш озвучки не совпадёт.
        // Возвращает [{ text, range }] без разделителей «* * *».
        function _sentencesOfPeekedBlock(entries) {
            let items = _lookaheadBlockCache.get(entries);
            if (items) return items;
            const raw = [];
            for (const [name, range] of entries) {
                const text = range.toString().replace(/\s+/g, ' ').trim();
                if (text.length < 1) continue;
                raw.push({ name, text, range });
            }
            items = splitDialogueSentences(mergeInitialSplits(raw))
                .filter(x => !_isDividerText(x.text))
                .map(x => ({ text: x.text, range: x.range }));
            _lookaheadBlockCache.set(entries, items);
            return items;
        }

        // ЧТО РЕАЛЬНО УЙДЁТ НА ОЗВУЧКУ для предложения, которое мы ещё не начали читать.
        // Если предложение разорвано границей страницы, speakCurrentSentence() отправит
        // не весь текст, а его части (транш 1, потом транш 2 после переворота). Раньше
        // заготовка делалась по тексту целиком → на каждом таком предложении кэш не
        // срабатывал, и озвучка ждала полный синтез («пауза на переходе страницы»).
        // Разрез считаем относительно страницы, на которой предложение НАЧНЁТСЯ
        // (текущая + k·ширина страницы): именно такой будет геометрия к моменту чтения,
        // потому что к нему мы либо перелистнём, либо уже на этой странице.
        // Результат — массив текстов: все части по порядку (1, 2, …) либо [text].
        function _predictSpokenTexts(range, text, curBounds) {
            try {
                if (!curBounds || !range) return [text];
                const size = curBounds.right - curBounds.left;
                if (!(size > 0)) return [text];
                const rects = Array.from(range.getClientRects()).filter(r => r.width > 0);
                if (!rects.length) return [text];
                const firstLeft = Math.min(...rects.map(r => r.left));
                // допуск 4px — тот же, что в isOnNextPage()/getSplitAcrossPageInfo()
                const v  = Math.max(0, Math.floor((firstLeft - curBounds.left + 4) / size));
                const vb = { left: curBounds.left + v * size, right: curBounds.right + v * size };
                const key = vb.left + ':' + vb.right;
                const cached = _splitPredictCache.get(range);
                if (cached && cached.key === key) return cached.texts;
                let texts = [text];
                const res = computeSplitParts(range, vb);
                if (res) texts = res.parts.slice(res.partIndex).map(p => p.text);
                _splitPredictCache.set(range, { key, texts });
                return texts;
            } catch (e) {
                return [text];
            }
        }

        // Сообщаем нативному движку тексты СЛЕДУЮЩИХ предложений — Edge TTS синтезирует их
        // заранее, пока играет текущее (на медленном интернете исчезают паузы между
        // фразами). Порядок озвучки это не меняет: играет только то, что уходит в
        // bridge.onTTSText(); тексты тут должны совпадать с теми, что будут
        // отправлены позже, иначе заготовка просто не пригодится.
        // Заглядываем и в СЛЕДУЮЩИЕ БЛОКИ (абзацы): диалоги состоят из коротких
        // абзацев, и без этого на каждой границе абзаца была пауза. Предложения,
        // которые разорвёт граница страницы, берём так, как они будут озвучены
        // (по частям) — см. _predictSpokenTexts().
        function sendTTSLookahead() {
            try {
                if (!bridge || typeof bridge.prefetchTTS !== 'function') return;
                const out = [];
                const push = (texts) => {
                    for (const t of texts) {
                        if (out.length >= TTS_LOOKAHEAD_COUNT) return;
                        out.push(t);
                    }
                };
                const s = ttsSentences[ttsSentenceIndex];
                if (!s) return;
                const bounds = _pageBounds();
                // 1) оставшиеся транши текущего разрывного предложения
                if (s.isSplitSentence && s.parts) {
                    push(s.parts.slice(s.partIndex + 1).map(p => p.text));
                }
                // 2) следующие предложения этого блока
                for (let i = ttsSentenceIndex + 1; i < ttsSentences.length && out.length < TTS_LOOKAHEAD_COUNT; i++) {
                    const n = ttsSentences[i];
                    if (!n || _isDividerText(n.text)) continue;
                    if (n.isSplitSentence && n.parts) {
                        // уже разрезано (например, возврат назад) — читаем как есть
                        push(n.parts.slice(n.partIndex).map(p => p.text));
                    } else {
                        push(_predictSpokenTexts(n.range, n.text, bounds));
                    }
                }
                // 3) следующие блоки (до конца секции; дальше заглянуть нельзя)
                for (let off = 1; out.length < TTS_LOOKAHEAD_COUNT && off <= 4; off++) {
                    const entries = view?.tts?.peekNextRanges?.(off);
                    if (!entries) break;
                    for (const it of _sentencesOfPeekedBlock(entries)) {
                        if (out.length >= TTS_LOOKAHEAD_COUNT) break;
                        push(_predictSpokenTexts(it.range, it.text, bounds));
                    }
                }
                const clean = out.map(stripFootnoteMarkers).map(applyTtsCorrections).filter(t => t && t.trim());
                if (clean.length) bridge.prefetchTTS(JSON.stringify(clean));
            } catch (e) {
                log(' sendTTSLookahead: ' + e.message, 'warn');
            }
        }

        // Определяет: пересекает ли range границу СТРАНИЦЫ?
        // Возвращает { isSplit: bool, charsOnCurrentPage: number }
        // charsOnCurrentPage — приблизительное количество символов видимой части.
        //
        // ИСПРАВЛЕНО (3-я итерация): предыдущая версия пересчитывала
        // rect.left → "абсолютные координаты контента" через frameElement.
        // getBoundingClientRect(), но rect.left из range.getClientRects() внутри
        // iframe-документа УЖЕ является абсолютной координатой контента — iframe
        // сам не скроллится (скроллится внешний #container). Пересчёт через
        // frameLeft был лишним и ошибочным: frameLeft «плавает» вместе с текущим
        // скроллом #container, поэтому граница «плавала» вместе с ним же — отсюда
        // срабатывание на 1-2 строки раньше/позже. Тот же принцип уже правильно
        // реализован в getFirstVisibleRange()/getPreciseVisibleStartRange().
        // Теперь — прямое сравнение rect.left с границами _pageBounds(),
        // без каких-либо пересчётов систем координат.
        function getSplitAcrossPageInfo(range, boundsArg) {
            const empty = { isSplit: false, charsOnCurrentPage: 0, startsBefore: false };
            try {
                if (!range) return empty;
                const bounds = boundsArg || _pageBounds();
                if (!bounds) return empty;
                const rects = Array.from(range.getClientRects()).filter(r => r.width > 0);
                if (!rects.length) return empty;
                const tol = 4;
                const onPrev    = rects.filter(r => r.left < bounds.left - tol);
                const onCurrent = rects.filter(r => r.left >= bounds.left - tol && r.left < bounds.right);
                const onNext    = rects.filter(r => r.left >= bounds.right);
                if (!onCurrent.length && !onNext.length) return empty;
                const areaOf = rs => rs.reduce((s, r) => s + r.width * r.height, 0);
                const total = areaOf(onPrev) + areaOf(onCurrent) + areaOf(onNext);
                const fraction = total ? areaOf(onCurrent) / total : 0;
                return {
                    isSplit: (onCurrent.length > 0 && onNext.length > 0) ||
                             (onPrev.length > 0 && onCurrent.length > 0),
                    charsOnCurrentPage: Math.round(range.toString().length * fraction),
                    startsBefore: onPrev.length > 0,   // предложение началось на ПРЕДЫДУЩЕЙ странице
                };
            } catch(e) {
                return empty;
            }
        }

        // Длительность озвучки (мс) — берём точное значение от Python если есть,
        // иначе грубую оценку по символам. После каждого вызова сбрасываем точное
        // значение чтобы следующее предложение не унаследовало чужую длительность.
        function estimateTTSDurationMs(text) {
            if (ttsLastPcmDurationMs > 0) {
                const exact = ttsLastPcmDurationMs;
                ttsLastPcmDurationMs = 0;  // использовали — сбрасываем
                log(` estimateTTSDurationMs: точное PCM = ${exact}ms`, 'tts');
                return exact;
            }
            // Fallback: грубая оценка по символам ±20%
            const charsPerSec = 13 * (ttsSpeed || 1.0);
            const est = Math.max(300, Math.round(text.length / charsPerSec * 1000));
            log(` estimateTTSDurationMs: оценка по символам = ${est}ms`, 'tts');
            return est;
        }

        // ── Переходит к следующему предложению: по страницам через CFI ──
        //
        // Вместо "следующий блок" — проверяем есть ли следующее предложение
        // на текущей странице. Если нет — листаем страницу через renderer.next().
        // view.next() вызывается только для смены секции (goToNextSection).
        // Все range остаются валидными при листании страниц внутри секции
        // (iframe не перегружается, только scroll-позиция меняется).
        //
        // CFI сохраняется через view.lastLocation.cfi при паузе.

        // Правый край текущей видимой страницы (для paginated-режима)
        // Проверяет: range ушёл НА СЛЕДУЮЩИЙ разворот целиком?
        //
        // Ключевое отличие от split-предложений:
        //   isOnNextPage  → true только если ВСЕ rects предложения за границей (rect.left >= size)
        //   getSplitAcrossPageInfo → обрабатывает случай когда часть здесь, часть там
        //
        // getBoundingClientRect() → VIEWPORT-координаты.
        // renderer.size = ширина одного разворота в viewport-пикселях.
        // Проверяет: range ушёл НА СЛЕДУЮЩУЮ СТРАНИЦУ целиком?
        //
        // Ключевое отличие от split-предложений:
        //   isOnNextPage  → true только если ВСЕ rects предложения за границей
        //   getSplitAcrossPageInfo → обрабатывает случай когда часть здесь, часть там
        //
        // ИСПРАВЛЕНО (3-я итерация): убран пересчёт через frameElement/frameLeft —
        // rect.left из range.getClientRects() внутри iframe уже является абсолютной
        // координатой контента (см. комментарий у getSplitAcrossPageInfo и
        // _pageBounds() выше). Прямое сравнение с bounds.right, без toContentX.
        function isOnNextPage(range) {
            try {
                if (!range) return false;
                const bounds = _pageBounds();
                if (!bounds) return false;

                const rects = Array.from(range.getClientRects()).filter(r => r.width > 0);
                if (!rects.length) return false;

                const minLeft = Math.min(...rects.map(r => r.left));

                // Небольшой допуск на субпиксельное округление
                const tolerance = 4;
                log(` isOnNextPage: minLeft=${minLeft.toFixed(1)} `+
                    `right=${bounds.right.toFixed(1)}`, 'tts');
                return minLeft >= bounds.right - tolerance;
            } catch(e) {
                log(' isOnNextPage ошибка: ' + e.message, 'warn');
                return false;
            }
        }

        // Листает страницу и продолжает TTS с текущего предложения
        async function turnPageTTS() {
            if (!ttsActive) return;
            ttsPageTurning = true;
            log(' Листаем страницу...', 'tts');

            await new Promise(resolve => {
                view.renderer.addEventListener('relocate', () => resolve(), { once: true });
                setTimeout(resolve, 1500);
                view.renderer.next();
            });

            await new Promise(r => setTimeout(r, 80));
            ttsPageTurning = false;
            if (!ttsActive) return;
            await speakCurrentSentence();
        }

        async function advanceToNextSentence() {
            if (!ttsActive || ttsPageTurning) return;

            // Проверка на предисловие распространителя
            const actualSection = view?.lastLocation?.section?.current ?? currentSection;
            // Уникальные фразы распространителей
            const distributorPhrases = [
                'цокольный этаж', 'сайт заблокирован', 'censor tracker',
                'антизапретом', 'телеграм-бот', 'telegram-бот',
                'наградите автора лайком', 'понравилась книга',
            ];
            const currentText = ttsSentences.map(s => s.text.toLowerCase()).join(' ');
            const isDistributorSection = distributorPhrases.some(phrase => currentText.includes(phrase));

            // Если предисловие — останавливаем TTS
            if (isDistributorSection && actualSection < 5) {
                log(` ОБНАРУЖЕНО ПРЕДИСЛОВИЕ РАСПРОСТРАНИТЕЛЯ в секции ${actualSection}, останавливаем TTS`, 'tts');
                stopTTSFull(false);
                return;
            }

            // "* * *" пропускаются в speakCurrentSentence до озвучки — здесь ничего не нужно

            ttsSentenceIndex++;

            if (ttsSentenceIndex < ttsSentences.length) {
                const next = ttsSentences[ttsSentenceIndex];
                // Если предыдущее предложение было split — переворот уже произошёл
                // синхронно в window.ttsNext (виртуальное тире), а не по таймеру.
                if (isOnNextPage(next.range)) {
                    log(' Следующее предл. на новой странице → листаем', 'tts');
                    await turnPageTTS();
                } else {
                    await speakCurrentSentence();
                }
                return;
            }

            // Конец блока — берём следующий блок секции
            const ssml = view.tts.next(false);
            if (!ssml) {
                await goToNextSection();
                return;
            }

            if (loadSentencesFromBlock() && ttsSentences.length > 0) {
                // Пропускаем блок если его подпись совпадает с предыдущим (дубль заголовка в FB2)
                const sig = blockSignature();
                if (sig && sig === ttsLastBlockSignature) {
                    log(` Дубль блока пропущен: "${ttsSentences[0].text.substring(0, 40)}"`, 'tts');
                    // Сбрасываем signature и переходим к СЛЕДУЮЩЕМУ блоку (не инкремент внутри дубля!)
                    ttsLastBlockSignature = '';
                    const skipSsml = view.tts.next(false);
                    if (!skipSsml) {
                        await goToNextSection();
                    } else if (loadSentencesFromBlock() && ttsSentences.length > 0) {
                        ttsLastBlockSignature = blockSignature();
                        await speakCurrentSentence();
                    } else {
                        await advanceToNextSentence();
                    }
                    return;
                }
                
                //  НОВАЯ ПРОВЕРКА: Пропускаем первый блок секции 0 если он уже читался
                // Это предотвращает дублирование заголовка книги в FB2
                if (actualSection === 0 && ttsLastGlobalText) {
                    // Проверяем ВСЕ предложения блока на дублирование
                    const blockText = ttsSentences.map(s => s.text.trim()).join(' ');
                    if (blockText.includes(ttsLastGlobalText)) {
                        log(` Дубль заголовка книги пропущен: "${blockText.substring(0, 60)}"`, 'tts');
                        const skipSsml = view.tts.next(false);
                        if (!skipSsml) {
                            await goToNextSection();
                        } else if (loadSentencesFromBlock() && ttsSentences.length > 0) {
                            ttsLastBlockSignature = blockSignature();
                            await speakCurrentSentence();
                        } else {
                            await advanceToNextSentence();
                        }
                        return;
                    }
                }
                
                ttsLastBlockSignature = sig;
                const next = ttsSentences[0];
                if (isOnNextPage(next.range)) {
                    log(' Новый блок на следующей странице → листаем', 'tts');
                    await turnPageTTS();
                } else {
                    await speakCurrentSentence();
                }
            } else {
                await advanceToNextSentence();
            }
        }

        // Переходим к следующей секции книги
        async function goToNextSection() {
            log(' Конец секции, переход...', 'tts');

            const sectionBefore = currentSection;
            // Используем section.total из lastLocation (надёжнее чем book.sections.length)
            const totalSections = view?.lastLocation?.section?.total
                                  ?? book?.sections?.length
                                  ?? 0;

            // Если уже на последней секции — конец книги
            if (totalSections > 0 && sectionBefore >= totalSections - 1) {
                log(` Конец книги (секция ${sectionBefore}/${totalSections - 1})`, 'tts');
                stopTTSFull(true);
                return;
            }

            clearTTSHighlight();
            ttsPageTurning = true;

            // Ждём create-overlay — сигнал что новая секция загружена и iframe готов
            await new Promise(resolve => {
                let resolved = false;
                const done = () => { if (!resolved) { resolved = true; resolve(); } };
                view.addEventListener('create-overlay', done, { once: true });
                setTimeout(done, 3000);
                view.next();
            });

            await new Promise(r => setTimeout(r, 300));
            
            // Обновляем currentSection из renderer.getContents() — самый надёжный способ
            try {
                const contents = view.renderer?.getContents?.();
                if (contents?.length > 0 && contents[0].index !== undefined) {
                    currentSection = contents[0].index;
                    log(` goToNextSection: currentSection обновлён → ${currentSection}`, 'tts');
                }
            } catch(e) {}
            ttsPageTurning = false;

            if (!ttsActive) return;

            // Проверяем: секция действительно сменилась?
            if (currentSection === sectionBefore) {
                // view.next() не сработал — проверяем, это действительно конец книги или просто конец текста в секции
                // Если мы на последней секции И в ней нет больше текста — это конец книги
                if (totalSections > 0 && sectionBefore >= totalSections - 1) {  // всё ещё конец
                    // Мы уже исчерпали все блоки последней секции (view.tts.next() вернул null
                    // ещё в advanceToNextSentence), а view.next() не смог продвинуться дальше.
                    // Вызывать view.tts.start() здесь нельзя — он сбросит позицию в начало
                    // последней секции и TTS зациклится, перечитывая её заново.
                    log(' Конец книги (последняя секция, все блоки исчерпаны)', 'tts');
                    stopTTSFull(true);
                    return;
                }
                // view.next() не смог продвинуть нас вперёд, секция не изменилась.
                // Мы попали сюда потому что view.tts.next() уже вернул null в advanceToNextSentence —
                // все блоки текущей секции исчерпаны. Вызывать tts.start() нельзя: он сбросит
                // позицию в начало секции и TTS зациклится. currentSection мог отстать от реального
                // (напр. показывает N-1 вместо N) — поэтому не полагаемся на сравнение с totalSections.
                log(' Конец книги (view.next() не сработал, блоки секции исчерпаны)', 'tts');
                stopTTSFull(true);
                return;
            }

            // Секция сменилась — пересоздаём TTS для нового doc
            if (!await initTTSForCurrentDoc()) {
                // Если false из-за рекламной секции — пропускаем её и идём дальше
                const docTitle = (getTTSDoc()?.title || '').toLowerCase();
                const h1Text   = (getTTSDoc()?.querySelector('h1,h2')?.textContent || '').toLowerCase();
                const isAdSection = TTS_SKIP_TITLES.some(t =>
                    (docTitle + ' ' + h1Text).includes(t));
                if (isAdSection && ttsActive) {
                    // Проверяем есть ли ещё секции после рекламной
                    const totalSec = view.renderer?.getContents?.()?.length
                                  ?? view.book?.sections?.length ?? 0;
                    const curSec   = view.renderer?.getContents?.()?.[0]?.index ?? 0;
                    if (totalSec > 0 && curSec >= totalSec - 1) {
                        // Рекламная глава последняя — останавливаем TTS на предыдущей позиции
                        log(' Рекламная секция последняя — конец книги, останавливаем TTS', 'tts');
                        stopTTSFull(true);
                        return;
                    }
                    log(' Рекламная секция пропущена, переходим дальше', 'info');
                    setTimeout(() => { if (ttsActive) window.ttsNext(); }, 100);
                    return;
                }
                log(' Не удалось инициализировать TTS в новой секции', 'error');
                ttsActive = false;
                updateTTSButtons();
                return;
            }
